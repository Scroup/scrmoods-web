    const p = gi.t ? Math.min(100, gi.saved / gi.t * 100) : 0, pPlan = gi.t ? Math.min(100, (gi.saved + gi.thisM) / gi.t * 100) : 0;
    const late = g.mode === 'by' && g.by && gi.eta && ymDiff(g.by, gi.eta) > 0;
    return `<div class="goalc" data-id="${g.id}" style="--c:${color}">
      <div class="gtop"><span class="tic" style="--c:${color}">${goalIcon(g.n)}</span><div class="gt"><b>${esc(g.n || 'Цель')}</b><i>${goalLine(g, gi)}</i></div>
        ${gi.done ? '' : `<button class="gsave" data-act="goal" data-id="${g.id}">Отложил</button>`}</div>
      <div class="gbar2"><i class="plan" style="width:${pPlan}%"></i><i style="width:${p}%"></i></div>
      <div class="gnums"><span><b class="num">${gel(gi.saved)}</b> из <span class="num">${gel(gi.t)}</span></span><span class="num">${money(p, 0)}%</span></div>
      ${!gi.done && gi.monthly > 0 ? `<div class="gmonth">${gi.skip && gi.contrib[0] ? `первый взнос ${shortDate(gi.contrib[0].date)}` : gi.loggedNow >= gi.monthly - .5 ? '✓ в этом месяце отложено' : gi.loggedNow ? `в этом месяце: ${gel(gi.loggedNow)} из ${gel(gi.monthly)}` : `в этом месяце отложить ${gel(gi.thisM)}${gi.contrib[0] ? ` · ${gi.contrib[0].date === now ? 'сегодня' : shortDate(gi.contrib[0].date)}` : ''}`}</div>` : ''}
      ${late ? `<div class="tlwarn">к сроку не успеваете</div>` : ''}</div>`;
  }).join('');
  const gMonthly = c.goals.reduce((t, x) => t + (x.gi.done ? 0 : x.gi.monthly), 0);


  // траты текущего периода по датам
  const expRows = c.pOut.map(e => `<tr><td><span class="tic" style="--c:${e.color || C_NEED}">${e.kind === 'goal' ? goalIcon(e.n) : iconOf(e.n)}</span></td><td class="tn"><b>${esc(e.n)}</b><i>${e.date === now ? 'сегодня' : `${shortDate(e.date)} · ${whenWord(e.date).replace(/, .*/, '')}`}${e.kind === 'goal' ? ' · на цель' : e.kind === 'once' ? ' · разово' : ''}</i></td>
    <td class="tv num">${gel(e.gel)}</td></tr>`).join('');
  const tiles = [['Будет денег', c.total, 'var(--acc)'], ['Обязательные и разовые', c.pNeed, C_NEED], ['На цели', c.pGoal, C_GOAL], ['Повседневное', c.pLife, C_FREE]];
  const stack = c.total > 0 ? [[c.pNeed, C_NEED], [c.pGoal, C_GOAL], [c.res, C_RES], [c.pLife, C_FREE], [c.pKeep, '#9AA5B1']].map(([v, col]) => v > 0.5 ? `<i style="flex:${v};background:${col}"></i>` : '').join('') : '';

  $main.innerHTML = `
    <div class="jhead" style="--d:0ms"><div class="t"><div class="big">План</div><div class="sub">до ${shortDate(c.end)} · прогноз на год</div></div>
      ${viewSeg()}<button class="rbtn" data-act="bwiz" aria-label="Изменить ответы"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg></button></div>
    <div class="card bhero" style="--d:40ms">
      <div class="bh"><div class="bt"><div class="k">Можно тратить в день</div><div class="v num">${bm(s0.rate)}<small> ${bS()}</small></div>
        <div class="s">до ${shortDate(s0.stop < c.end ? s0.stop : c.end)} включительно</div></div>
        <div class="bg">${ring(1 - pToday, c.spentToday > s0.rate)}<div class="bgt"><b class="num">${bm(left)}</b><i>осталось<br>сегодня</i></div></div></div>
      ${c.spentToday ? `<div class="btoday">Сегодня по учёту расходов потрачено <b class="num">${gel(c.spentToday)}</b>${c.spentToday > s0.rate ? ` — это на ${gel(c.spentToday - s0.rate)} больше дневного` : ''}.</div>` : `<div class="btoday">Записывайте траты во вкладке «Расходы» — тут будет видно, сколько осталось на сегодня.</div>`}
      <div class="bchips">${next ? `<span class="bnext">С ${shortDate(next.start)} — <b class="num">${gel(next.rate)}</b> в день</span>` : ''}${gMonthly ? `<span class="bnext goal">🎯 на цели <b class="num">${gel(gMonthly)}</b> в месяц</span>` : ''}</div>
    </div>
    ${warns.map((w, k) => `<div class="bwarn" style="--d:${60 + k * 20}ms"><span aria-hidden="true">⚠️</span><div>${w}</div></div>`).join('')}
    ${c.past.length ? `<button class="btn outline" data-act="bwizhave" style="width:calc(100% - 20px);margin:10px 10px 0">Обновить, сколько денег сейчас</button>` : ''}

    ${c.goals.length ? `<div class="card" style="--d:80ms"><h2 class="hl">Цели</h2>${goalsHtml}
      <button class="addrow" data-act="bwizgoals">+ добавить цель</button></div>` : ''}

    ${incomeCard(c)}

// линия остатка по дням: мягкая заливка, точки поступлений и крупных трат
function lineChart(c) {
  const W = 340, H = 170, l = 8, r = 8, t = 22, b = 26, s = c.series;
  const vals = s.map(p => p.bal).concat([c.have, c.res, 0]);
  const lo = Math.min(...vals), hi = Math.max(...vals) || 1, span = hi - lo || 1;
  const X = i => l + (W - l - r) * (s.length > 1 ? i / (s.length - 1) : .5), Y = v => t + (H - t - b) * (1 - (v - lo) / span);
  const pts = [[X(0), Y(c.have)], ...s.map((p, i) => [X(i), Y(p.bal)])];
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const area = line + `L${X(s.length - 1).toFixed(1)} ${Y(lo)}L${X(0)} ${Y(lo)}Z`;
  const grid = [0, .5, 1].map(k => { const v = lo + span * k; return `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${W - r}" y="${Y(v) - 4}" text-anchor="end" class="gt">${bm(v)}</text>`; }).join('');
  const zero = lo < 0 ? `<line x1="${l}" x2="${W - r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--danger)" stroke-width="1.2"/>` : '';
  const resL = c.res ? `<line x1="${l}" x2="${W - r}" y1="${Y(c.res)}" y2="${Y(c.res)}" stroke="${C_RES}" stroke-width="1.6" stroke-dasharray="5 4"/>` : '';
  const at = d => { const i = daysTo(now, d); return i >= 0 && i < s.length ? i : -1; };
  const incs = c.pInc.filter(e => e.date > now).map(e => { const i = at(e.date); return i < 0 ? '' : `<circle cx="${X(i)}" cy="${Y(s[i].bal)}" r="5.5" fill="${C_FREE}" stroke="var(--page)" stroke-width="2"/>`; }).join('');
  const bigSum = c.pOut.reduce((z, e) => z + e.gel, 0);
  const big = c.pOut.filter(e => e.gel >= bigSum * .12).map(e => { const i = at(e.date); return i < 0 ? '' : `<circle cx="${X(i)}" cy="${Y(s[i].bal)}" r="4.5" fill="${e.color || C_NEED}" stroke="var(--page)" stroke-width="2"/>`; }).join('');
  const ticks = [...new Set([0, Math.floor((s.length - 1) / 2), s.length - 1])].map(i => `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === s.length - 1 ? 'end' : 'middle'}" class="gt">${tinyDate(s[i].d)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Остаток денег по дням" id="lcsvg" data-w="${W}" data-l="${l}" data-r="${r}">
    <defs><linearGradient id="lgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc);stop-opacity:.32"/><stop offset="1" style="stop-color:var(--acc);stop-opacity:0"/></linearGradient></defs>
    ${grid}${zero}<path d="${area}" fill="url(#lgA)"/>${resL}<path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${big}${incs}<line id="lcx" x1="0" x2="0" y1="${t - 6}" y2="${H - b}" stroke="var(--soft)" stroke-width="1" stroke-dasharray="2 3" visibility="hidden"/>
    <circle id="lcd" r="5" fill="var(--acc)" stroke="var(--page)" stroke-width="2" visibility="hidden"/>${ticks}</svg>`;
}
// подсказка при касании графика: дата и остаток
function lineTip(c) {
  const box = $('#lc'), svg = $('#lcsvg'); if (!box || !svg) return;
  const s = c.series, W = +svg.dataset.w, l = +svg.dataset.l, r = +svg.dataset.r;
  const vals = s.map(p => p.bal).concat([c.have, c.res, 0]), lo = Math.min(...vals), span = (Math.max(...vals) || 1) - lo || 1;
  const show = ev => {
    const rc = svg.getBoundingClientRect(), x = (ev.clientX - rc.left) / rc.width * W;
    const i = Math.max(0, Math.min(s.length - 1, Math.round((x - l) / (W - l - r) * (s.length - 1)))), p = s[i];
    const cx = l + (W - l - r) * (s.length > 1 ? i / (s.length - 1) : .5), cy = 22 + (170 - 22 - 26) * (1 - (p.bal - lo) / span);
    $('#lcx').setAttribute('x1', cx); $('#lcx').setAttribute('x2', cx); $('#lcx').setAttribute('visibility', 'visible');
    $('#lcd').setAttribute('cx', cx); $('#lcd').setAttribute('cy', cy); $('#lcd').setAttribute('visibility', 'visible');
    const ev2 = [...c.pInc.filter(e => e.date === p.d && p.d > now).map(e => `+${gel(e.gel)} ${esc(e.n)}`), ...c.pOut.filter(e => e.date === p.d).map(e => `−${gel(e.gel)} ${e.kind === 'goal' ? '🎯 ' : ''}${esc(e.n)}`)];
    const tip = $('#lctip'); tip.hidden = false;
    tip.innerHTML = `<b>${p.d === now ? 'Сегодня' : shortDate(p.d)}</b> · <span class="num">${gel(p.bal)}</span>${ev2.length ? `<i>${ev2.join('<br>')}</i>` : ''}`;
    const px = cx / W * rc.width; tip.style.left = Math.max(4, Math.min(rc.width - tip.offsetWidth - 4, px - tip.offsetWidth / 2)) + 'px';
  };
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', () => { $('#lctip').hidden = true; $('#lcx').setAttribute('visibility', 'hidden'); $('#lcd').setAttribute('visibility', 'hidden'); });
}

/* ---------- повседневные траты по статьям вместо безликого «на жизнь» ---------- */
function dailyParts(c) {
  const lim = budget.lim || {}, ks = CATS.filter(k => lim[k.id] > 0);
  if (!(c.pLife > 0)) return [];
  if (!ks.length) return [{ n: 'Повседневное: продукты, кафе, транспорт', ic: '🛒', v: c.pLife, col: C_FREE }];
  const k = c.N / 30.4, want = ks.reduce((t, x) => t + lim[x.id] * k, 0), sc = want > c.pLife ? c.pLife / want : 1;
  const parts = ks.map((x, i) => ({ n: x.n, ic: x.s, v: lim[x.id] * k * sc, col: ['#58B37E', '#7CC79A', '#3E9A62', '#9AD3AE', '#2F7F55', '#B5DEC2', '#6DB98A'][i % 7] }));
  const rest = c.pLife - parts.reduce((t, x) => t + x.v, 0);
  if (rest > 1) parts.push({ n: 'Свободно на мелочи', ic: '✨', v: rest, col: '#CDE8D6' });
  return parts;
}
function dailyCard(c) {
  const lim = budget.lim || {}, ym = ymOf(now), dim = daysTo(`${ym}-01`, endOfMonth(now)) + 1, dl = dim - ymd(now)[2] + 1;
  const spent = id => spends.filter(x => x.date.startsWith(ym) && (x.cat || 'other') === id).reduce((t, x) => t + x.gel, 0);
  const list = CATS.filter(k => lim[k.id] > 0 || spent(k.id) > 0 && k.id !== 'home').map((k, i) => ({ k, lim: lim[k.id] || 0, sp: spent(k.id), col: PAL[CATS.indexOf(k) % PAL.length] }));
  const limSum = list.reduce((t, r) => t + r.lim, 0), spSum = list.reduce((t, r) => t + r.sp, 0);
  const life = (c.months[1] || c.months[0]).life;
  if (!limSum) return `<div class="card" style="--d:90ms"><h2 class="hl">Повседневные траты</h2>
    <p class="hint" style="margin:8px 0 10px">Сейчас на продукты, кафе, транспорт и мелочи остаётся ≈ <b class="num">${gel(life)}</b> в месяц одной суммой. Распределите по статьям — будет видно, сколько осталось на каждую.</p>
    <button class="btn outline" data-act="bwizdaily" style="margin:0">Распределить по статьям</button></div>`;
  return `<div class="card" style="--d:90ms"><h2 class="hl">Повседневные траты · ${MONTHS[ymd(now)[1] - 1].toLowerCase()}</h2>
    <table class="ftable dtab"><thead><tr><th></th><th>Статья</th><th>Лимит</th><th>Потрачено</th><th>Осталось</th></tr></thead><tbody>
    ${list.map(r => { const left = r.lim - r.sp, p = r.lim ? Math.min(100, r.sp / r.lim * 100) : 100;
      return `<tr><td><span class="tic" style="--c:${r.col}">${r.k.s}</span></td><td class="tn"><b>${esc(r.k.n)}</b><span class="pbar"><i style="width:${p}%;background:${left < 0 ? 'var(--danger)' : r.col}"></i></span>${r.lim && left > 0 ? `<i>≈ ${gel(left / dl)} в день до конца месяца</i>` : ''}</td>
        <td class="tv num">${r.lim ? bm(r.lim) : '—'}</td><td class="tv num">${bm(r.sp)}</td><td class="tv num ${left < 0 ? 'neg' : 'pos'}">${bm(left)}</td></tr>`; }).join('')}</tbody>
    <tfoot><tr><td></td><td class="tn"><b>Всего</b></td><td class="tv num">${bm(limSum)}</td><td class="tv num">${bm(spSum)}</td><td class="tv num ${limSum - spSum < 0 ? 'neg' : ''}">${bm(limSum - spSum)}</td></tr></tfoot></table>
    <p class="hint" style="margin:8px 0 0">${limSum > life + 1 ? `Лимиты больше, чем остаётся после обязательных трат и целей (${gel(life)}), на <b class="num">${gel(limSum - life)}</b>.` : life - limSum > 1 ? `Ещё свободно ≈ <b class="num">${gel(life - limSum)}</b> в месяц.` : 'Все деньги распределены.'} Потрачено — по вкладке «Расходы».</p>
    <button class="addrow" data-act="bwizdaily">изменить лимиты</button></div>`;
}


/* ---------- доходы в плане: выключатели и средний по факту ---------- */
const swBtn = x => `<button class="tsw ${x.off ? '' : 'on'}" data-act="incoff" data-id="${x.id}" role="switch" aria-checked="${!x.off}" aria-label="${x.off ? 'Включить' : 'Выключить'} «${esc(x.n)}»"><i></i></button>`;
function incomeCard(c) {

        <div class="it"><b>${esc(x.n || 'Доход')}</b><i>${isAvg(x) ? avgWord(a) : x.rep === 'n' ? mword(+x.cnt || 1) : REP[x.rep || 'once']}${x.date ? ` · ${x.rep === 'once' ? shortDate(x.date) : ymd(x.date)[2] + '-го'}` : ''}</i></div>

    ${!hasAvg && a.n ? `<button class="incsug" data-act="addavg"><span>📈</span><span><b>Средний доход по факту ≈ <span class="num">${gel(a.v)}</span></b><i>${avgWord(a)}. Добавить в план как ежемесячный доход</i></span><span class="plus">+</span></button>` : ''}
    <p class="hint" style="margin:8px 0 0">Выключенный доход не учитывается в плане, графиках и таблицах. Можно, например, выключить зарплату и включить средний доход по факту.</p></div>`;
}

/* ---------- накопления: всё свободное — в копилку ---------- */
/* Каждый месяц: доход − обязательные платежи − разовые траты − повседневные траты (лимиты, а без них — средние из «Расходов»).
   Весь остаток идёт в накопления. Цели закрываются по очереди, как они стоят в списке. Для сравнения — взносы по плану. */
function saveSim(c) {
  const lim = budget.lim || {}, limSum = Object.values(lim).reduce((t, v) => t + (+v || 0), 0);
  const av = catAvg(), avSum = Object.entries(av).filter(([k]) => k !== 'home').reduce((t, [, v]) => t + v, 0);
  const daily = limSum || avSum, src = limSum ? 'lim' : avSum ? 'avg' : '';
  const goals = c.goals.filter(x => x.gi.t > 0);
  const saved0 = goals.reduce((t, x) => t + x.gi.saved, 0);
  const cur = ymOf(now), dim = daysTo(`${cur}-01`, endOfMonth(now)) + 1, restK = (dim - ymd(now)[2] + 1) / dim;
  const M = c.months.map((m, i) => ({ ym: m.ym, inc: m.inc, out: m.need + m.once, daily: daily * (i === 0 ? restK : 1), goalPlan: m.goal }));
  for (const m of M) m.free = m.inc - m.out - m.daily;
  const tail = M.slice(1), avgFree = tail.reduce((t, m) => t + m.free, 0) / Math.max(1, tail.length), avgPlan = tail.reduce((t, m) => t + m.goalPlan, 0) / Math.max(1, tail.length);
  const start = saved0 + Math.max(0, c.have - c.res);            // уже накоплено на целях + свободные деньги на счетах сверх запаса
  // сколько месяцев показывать: пока не закроются все цели (до 10 лет), но не меньше года
  const targets = []; let acc = 0;
  for (const x of goals) { acc += x.gi.t; targets.push({ ...x, cum: acc }); }
  const pts = [{ ym: cur, max: start, plan: saved0, i: 0 }];
  let S = start, P = saved0, doneAt = targets.length && targets.every(t => S >= t.cum) ? 0 : null;
  for (let i = 0; i < 120; i++) {
    const m = M[i] || { ym: ymAdd(cur, i), free: avgFree, goalPlan: avgPlan };
    S += m.free; P += m.goalPlan;
    pts.push({ ym: m.ym, max: S, plan: P, free: m.free, i: i + 1 });   // конец месяца m
    if (doneAt == null && targets.length && targets.every(t => S >= t.cum)) doneAt = i;
    if (i >= 11 && (!targets.length || doneAt != null && i >= doneAt + 2)) break;   // год, а если цели дальше — пока не закроются (до 10 лет)
  }
  for (const t of targets) { const hit = pts.find(p => p.max >= t.cum); t.etaMax = hit ? hit.ym : null; const hp = pts.find(p => p.plan >= t.cum); t.etaPlanCum = hp ? hp.ym : null; }
  return { daily, src, limSum, avSum, start, saved0, pts, targets, avgFree, months: M };
}
function savingsCard(c) {
  const s = saveSim(c);
  if (!s.src) return `<div class="card" style="--d:150ms"><h2 class="hl">Накопления: всё свободное — в копилку</h2>
    <p class="hint" style="margin:8px 0 10px">Чтобы посчитать, сколько можно копить, если все свободные деньги откладывать, задайте повседневные траты по статьям (продукты, кафе, транспорт) — или записывайте траты во вкладке «Расходы».</p>
    <button class="btn outline" data-act="bwizdaily" style="margin:0">Задать повседневные траты</button></div>`;

  const rows = s.months.map((m, i) => { const p = s.pts[i + 1], done = s.targets.filter(x => x.etaMax === p.ym);
    return `<tr class="srow ${m.free < 0 ? 'bad' : ''} ${i + 1 === savSel ? 'sel' : ''}" data-si="${i + 1}"><td class="tn"><b>${ymName(m.ym)}</b>${done.length ? `<i>🎉 ${done.map(x => esc(x.g.n)).join(', ')}</i>` : ''}</td><td class="tv num">${bm(m.inc)}</td><td class="tv num">${bm(m.out + m.daily)}</td>
      <td class="tv num ${m.free < 0 ? 'neg' : 'pos'}">${m.free >= 0 ? '+' : ''}${bm(m.free)}</td><td class="tv num"><b>${bm(p.max)}</b></td></tr>`; }).join('');
  const year = s.pts[Math.min(12, n)];
  return `<div class="card chart scard" style="--d:150ms"><h2 class="hl">Накопления: всё свободное — в копилку</h2>
    <p class="hint" style="margin:4px 0 8px">Каждый месяц после обязательных платежей, разовых трат и повседневных трат (${s.src === 'lim' ? `по лимитам: ${gel(s.limSum)} в месяц` : `в среднем по «Расходам»: ${gel(s.avSum)} в месяц`}) весь остаток откладывается. Цели закрываются по очереди.</p>
    <div class="tiles ftiles">
      <div style="--c:${C_GOAL}"><span>Свободно в месяц</span><b class="num ${s.avgFree < 0 ? 'neg' : ''}">${gel(s.avgFree)}</b><i>в среднем за год</i></div>
      <div style="--c:${C_FREE}"><span>Через год будет</span><b class="num">${gel(year.max)}</b><i>по плану взносов — ${gel(year.plan)}</i></div>
      <div style="--c:var(--acc)"><span>Сейчас</span><b class="num">${gel(s.start)}</b><i>на целях ${gel(s.saved0)} + свободное на счетах</i></div></div>
    ${(() => { const planM = s.months.slice(1).reduce((t, m) => t + m.goalPlan, 0) / Math.max(1, s.months.length - 1), over = planM - s.avgFree;
      return over > 1 ? `<div class="bwarn" style="margin:12px 0 0"><span aria-hidden="true">⚠️</span><div>Взносы на цели по плану (${gel(planM)} в месяц) больше, чем остаётся после повседневных трат (${gel(s.avgFree)}). Чтобы так копить, повседневные траты придётся урезать на <b class="num">${gel(over)}</b> в месяц — или уменьшить взносы.</div></div>` : ''; })()}
    <div class="lgnd" style="margin-top:12px"><span><em style="background:${C_GOAL}"></em>накоплено</span><span><em style="background:${C_FREE}"></em>добавилось за месяц</span><span><em class="dash2"></em>по плану взносов</span><span>наведите или нажмите на месяц</span></div>
    <div class="sscroll">${saveChart(s)}<div class="lctip" id="stip" hidden></div></div>
    <div class="sdet" id="sdet">${saveDetail(s, savSel)}</div>
    ${s.targets.length ? `<div class="sgoals">${s.targets.map(x => `<div class="feta" style="--c:${x.color}"><span class="tic" style="--c:${x.color}">${goalIcon(x.g.n)}</span>
      <div class="ft"><b>${esc(x.g.n)}</b><i>${gel(x.gi.left)} из ${gel(x.gi.t)} ещё копить</i></div>

function saveBind() {

/* ---------- вид плана: карточки (телефон) или таблицы (компьютер) ---------- */

/* столбики по месяцам: parts — [[сумма, цвет], …] снизу вверх, inc — линия дохода */

  const yv = v => (H - top - bot) * v / fmax;

    const x = 8 + step * i + (step - bw) / 2;
    let y = H - bot, out = '';
    for (const [v, col] of m.parts) { if (v <= 0) continue; const h = Math.max(1.5, yv(v)); y -= h; out += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${col}"/>`; }
    const iy = H - bot - yv(m.inc), id = 'fc' + Math.random().toString(36).slice(2, 7);
    return `<g><clipPath id="${id}"><rect x="${x}" y="${top - 4}" width="${bw}" height="${H - bot - top + 4}" rx="5"/></clipPath><g clip-path="url(#${id})">${out}</g>
      ${m.inc ? `<line x1="${x - 3}" x2="${x + bw + 3}" y1="${iy}" y2="${iy}" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>` : ''}
      ${m.short > 1 ? `<circle cx="${x + bw / 2}" cy="${top - 2}" r="4" fill="var(--danger)"/>` : ''}
      <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" class="gt">${MONTHS_S[+m.ym.slice(5) - 1]}</text></g>`;
  }).join('') + [.5, 1].map(k => `<line x1="4" x2="${W - 4}" y1="${H - bot - (H - top - bot) * k}" y2="${H - bot - (H - top - bot) * k}" class="gl"/><text x="${W - 4}" y="${H - bot - (H - top - bot) * k - 3}" text-anchor="end" class="gt">${money(fmax * k / bK() / 1000, 1)}k</text>`).join('');

/* ---------- прогноз на год: по плану или по среднему доходу и тратам из записей ---------- */
function avgFacts(c) {
  const cur = ymOf(now), d0 = ymd(now)[2], dim = daysTo(`${cur}-01`, endOfMonth(now)) + 1;
  const prev = [1, 2, 3].map(k => ymAdd(cur, -k)), inM = (d, ym) => d.slice(0, 7) === ym;
  const ai = avgIncome(), incV = ai.n ? Array(ai.n).fill(ai.v) : [];

  const curSp = spends.filter(x => inM(x.date, cur)).reduce((t, x) => t + x.gel, 0);
  const part = d0 >= 7 && curSp > 0;
  if (part) spV.push(curSp / d0 * dim);                        // этот месяц — пересчитан на целый месяц
  const ahead = c.months.slice(1);
  return {
    inc: incV.length ? avg(incV) : avg(ahead.map(m => m.inc)), incN: incV.length,
    sp: spV.length ? avg(spV) : avg(ahead.map(m => m.life)), spN: spV.length - (part ? 1 : 0), part,
    bills: avg(ahead.map(m => m.need + m.once))

}
function avgForecast(c) {

  const withBills = budget.fBills != null ? budget.fBills : !(a.bills > 0 && homeAvg >= a.bills * 0.5);
  const surplus = a.inc - a.sp - (withBills ? a.bills : 0);
  const gs = c.goals.filter(x => !x.gi.done && x.gi.t > 0).map(x => ({ ...x, left: x.gi.left, want: x.gi.monthly > 0 ? x.gi.monthly : 0 }));
  const wantSum = gs.reduce((t, g) => t + g.want, 0);

/* ---------- таблицы на месяц, как в бюджетной таблице Excel ---------- */
let tblYm = ymOf(now);
const factOf = ym => { budget.fact = budget.fact || {}; const F = budget.fact[ym] = budget.fact[ym] || {}; for (const k of ['inc', 'got', 'bill', 'paid', 'cat']) F[k] = F[k] || {}; return F; };
function occursIn(x, ym, kind) {
  if (kind === 'inc') {
    const start = x.date || budget.start || now;
    if (x.rep === 'once' || !x.rep) return ymOf(start) === ym;
    const k = ymDiff(ymOf(start), ym); return k >= 0 && (x.rep !== 'n' || k < (+x.cnt || 1));
  }
  if (x.rep === 'once') return ymOf(x.date || budget.start || now) === ym;
  const k = ymDiff(x.from || ymOf(budget.start || now), ym);
  return k >= 0 && (x.rep !== 'n' || k < (+x.cnt || 1));
}
/* столбец «Факт» таблицы «Доходы» за месяц: вписанные суммы, галочки «получено», записи из «Приходов»
   и суммы, вписанные за месяц (их раскладываем по статьям, крупные регулярные первыми). Средний доход — без участия. */
function incFactOf(ym) {
  const G = (a, cc) => toGel(fxNum(a) || 0, cc) || 0, F = (budget.fact && budget.fact[ym]) || {}, Fi = F.inc || {}, Fg = F.got || {};
  const rows = budget.inc.filter(x => !isAvg(x) && occursIn(x, ym, 'inc')).map(x => ({ x, off: !!x.off, plan: x.off ? 0 : G(amtOf(x), x.c), full: G(amtOf(x), x.c), day: ymd(x.date || budget.start || now)[2] }));
  const recInc = incomeOfMonth(ym);
  let pool = recInc;
  rows.forEach(r => { r.auto = null; });
  const live = rows.filter(r => !r.off && Fi[r.x.id] == null && !Fg[r.x.id]).sort((a, b) => (a.x.rep === 'once') - (b.x.rep === 'once') || b.plan - a.plan);
  live.forEach((r, i) => { const v = i === live.length - 1 ? pool : Math.min(pool, r.plan); r.auto = v > 0.005 ? v : null; pool -= v > 0 ? v : 0; });
  for (const r of rows) r.fact = Fi[r.x.id] != null ? Fi[r.x.id] : Fg[r.x.id] ? r.full : r.auto;
  const extra = Math.max(0, pool);       // пришло, но разложить не на что
  return { rows, recInc, extra, total: rows.reduce((t, r) => t + (r.fact || 0), 0) + extra };
}
function monthTable(c, ym) {
  const G = (a, cc) => toGel(fxNum(a) || 0, cc) || 0, F = factOf(ym), inM = d => d.slice(0, 7) === ym;
  const IF = incFactOf(ym), recInc = IF.recInc, extra = IF.extra;
  const avgRows = budget.inc.filter(x => isAvg(x) && occursIn(x, ym, 'inc')).map(x => ({ x, off: !!x.off, plan: x.off ? 0 : G(incA(x), 'GEL'), day: ymd(x.date || now)[2], fact: null, auto: null }));
  const inc = [...avgRows, ...IF.rows];
  const bills = budget.exp.filter(x => x.rep !== 'once' && occursIn(x, ym, 'exp')).map(x => ({ x, plan: G(x.a, x.c) }));
  const once = budget.exp.filter(x => x.rep === 'once' && occursIn(x, ym, 'exp')).map(x => ({ x, plan: G(x.a, x.c) }));
  for (const r of [...bills, ...once]) r.fact = F.bill[r.x.id] != null ? F.bill[r.x.id] : F.paid[r.x.id] ? r.plan : null;
  const lim = budget.lim || {};
  const spentBy = id => spends.filter(x => inM(x.date) && (x.cat || 'other') === id).reduce((t, x) => t + x.gel, 0);
  const cats = CATS.filter(k => lim[k.id] != null || spentBy(k.id) > 0).map((k, i) => {
    const auto = spentBy(k.id), fact = F.cat[k.id] != null ? F.cat[k.id] : auto;
    return { k, lim: lim[k.id] || 0, auto, fact, ovr: F.cat[k.id] != null, color: PAL[CATS.indexOf(k) % PAL.length] };
  });
  const goals = c.goals.map(({ g, gi, color }) => {
    const started = ym >= ymOf(budget.start || now), until = gi.eta ? ym <= gi.eta : !gi.done;
    const plan = started && until && !(gi.done && ym > ymOf(now)) ? (ym === ymOf(now) ? (gi.skip ? 0 : gi.monthly) : gi.monthly) : 0;
    const fact = (g.log || []).filter(l => inM(l.d)).reduce((t, l) => t + l.g, 0);
    return { g, gi, color, plan, fact };
  });
  const sum = (a, k) => a.reduce((t, r) => t + (r[k] || 0), 0);
  const mi = ymDiff(ymOf(now), ym), mrow = mi >= 0 && mi < c.months.length ? c.months[mi] : null;
  const life = mrow ? mrow.life : Math.max(0, sum(inc, 'plan') - sum(bills, 'plan') - sum(once, 'plan') - sum(goals, 'plan'));
  const limSum = cats.reduce((t, r) => t + r.lim, 0);
  const P = { inc: sum(inc, 'plan'), bills: sum(bills, 'plan'), once: sum(once, 'plan'), exp: limSum || life, goals: sum(goals, 'plan') };
  const A = { inc: IF.total, bills: sum(bills, 'fact'), once: sum(once, 'fact'), exp: cats.reduce((t, r) => t + r.fact, 0), goals: sum(goals, 'fact') };
  return { F, inc, recInc, extra, bills, once, cats, goals, life, limSum, P, A };
}

const tin = (tb, id, v, cls = '', ph = '') => `<input class="tin ${cls}" data-tb="${tb}" data-id="${id}" value="${esc(v)}" placeholder="${ph}" ${/num/.test(cls) ? 'inputmode="decimal"' : ''} aria-label="${ph || tb}">`;

function tcard(title, hc, body, extra = '') {
  return `<section class="tcardx" style="--hc:${hc}"><header>${title}</header>${body}${extra}</section>`;
}
function hbars(rowsH) {   // план (зелёный) против факта (розовый)
  const W = 300, rowH = 34, H = rowsH.length * rowH + 8, l = 70, mx = Math.max(...rowsH.flatMap(r => [r[1], r[2]]), 1), sc = v => (W - l - 10) * v / mx;
  return `<svg viewBox="0 0 ${W} ${H}" class="hb" role="img" aria-label="План и факт">${rowsH.map(([n, p, a], i) => { const y = 6 + i * rowH;

      <rect x="${l}" y="${y + 3}" width="${Math.max(2, sc(p))}" height="10" rx="5" fill="${C_FREE}"/><rect x="${l}" y="${y + 16}" width="${Math.max(a ? 2 : 0, sc(a))}" height="10" rx="5" fill="#E8A5A0"/>`; }).join('')}
    <line x1="${l}" x2="${l}" y1="2" y2="${H - 2}" stroke="var(--rule)"/></svg>`;
}
function donut(parts, center, label) {
  const tot = parts.reduce((t, x) => t + x.v, 0);
  if (!(tot > 0)) return `<div class="empty" style="padding:30px 8px">пока пусто</div>`;
  let acc = 0; const R = 50, L = 2 * Math.PI * R, gap = parts.length > 1 ? 2 : 0;
  return `<div class="dwrap"><svg viewBox="0 0 140 140" class="dn">${parts.map(x => { const len = x.v / tot * L, s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${x.col}" stroke-width="18" stroke-dasharray="${Math.max(len - gap, .1)} ${L}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`; acc += len; return s; }).join('')}
    <text x="70" y="68" text-anchor="middle" class="dv num">${center}</text><text x="70" y="84" text-anchor="middle" class="dk">${label}</text></svg>
    <div class="dl">${parts.map(x => `<span><em style="background:${x.col}"></em>${esc(x.n)}<b class="num">${money(x.v / tot * 100, 0)}%</b></span>`).join('')}</div></div>`;
}

function tblEdit(t) {
  const f = t.dataset.tb, id = t.dataset.id, F = factOf(tblYm), v = t.type === 'checkbox' ? t.checked : t.value;
  const num = s => { const n = fxNum(s); return isFinite(n) ? r2(n) : null; };
  const inc = budget.inc.find(x => x.id === id), exp = budget.exp.find(x => x.id === id);
  switch (f) {
    case 'incN': inc.n = v.trim() || 'Доход'; break;
    case 'incA': inc.a = num(v) == null ? '' : String(num(v)); break;
    case 'incDay': { const d = parseInt(v, 10); if (d >= 1 && d <= 31) inc.date = atDay(ymOf(inc.date || now), d); break; }
    case 'incGot': if (v) F.got[id] = true; else { delete F.got[id]; delete F.inc[id]; } break;
    case 'incFact': if (String(v).trim() === '') delete F.inc[id]; else F.inc[id] = r2(num(v) * bK()); break;
    case 'billN': exp.n = v.trim() || 'Счёт'; break;
    case 'billA': exp.a = num(v) == null ? '' : String(num(v)); break;
    case 'billDay': { const d = parseInt(v, 10); exp.day = d >= 1 && d <= 31 ? d : ''; break; }
    case 'onceDate': exp.date = v; break;
    case 'billPaid': if (v) F.paid[id] = true; else { delete F.paid[id]; delete F.bill[id]; } break;
    case 'billFact': if (String(v).trim() === '') delete F.bill[id]; else F.bill[id] = r2(num(v) * bK()); break;
    case 'catLim': budget.lim = budget.lim || {}; budget.lim[id] = r2((num(v) || 0) * bK()); break;
    case 'catFact': if (String(v).trim() === '') delete F.cat[id]; else F.cat[id] = r2(num(v) * bK()); break;
    case 'baseCur': budget.base = v; toast(`Валюта плана: ${CUR[v].n.toLowerCase()}`); break;
    case 'mincA': case 'mincC': { const e = minc[id] = minc[id] || { a: '', c: baseCur() };
      if (f === 'mincA') e.a = num(v) == null ? '' : String(num(v)); else e.c = v;
      if (!(fxNum(e.a) > 0) && f === 'mincA') delete minc[id];
      saveMinc(); break; }
    case 'addCat': if (v) { budget.lim = budget.lim || {}; budget.lim[v] = 0; } break;
    case 'acN': case 'acA': case 'acC': { const x = (budget.accts || []).find(y => y.id === id); if (!x) return;
      if (f === 'acN') x.n = v.trim(); else if (f === 'acA') x.a = num(v) == null ? '' : String(num(v)); else x.c = v; break; }
    default: return;
  }
  saveBudget();
  // перерисовать, но не потерять ячейку, в которую перешли по Tab
  setTimeout(() => {
    const a = document.activeElement, key = a && a.dataset && a.dataset.tb ? [a.dataset.tb, a.dataset.id] : null;
    const y = window.scrollY; render(); window.scrollTo(0, y);
    const n = f === 'addCat' ? ['catLim', v] : key;
    if (n) { const el = document.querySelector(`[data-tb="${n[0]}"][data-id="${n[1]}"]`); if (el) { el.focus(); el.select && el.select(); } }
  }, 0);
}

}
function tblDel(k, id) {

function toCsv() {
  const head = 'Дата;Сумма;Валюта;Курс НБГ;GEL;Курс;Комментарий';
  const lines = [...rows].sort((a, b) => a.date.localeCompare(b.date)).map(r => {
    const k = rateOf(r), g = gelOf(r), [y, m, d] = r.date.split('-');
    return [`${d}.${m}.${y}`, r.usd.toFixed(2).replace('.', ','), curOf(r), k ? k.toFixed(4).replace('.', ',') : '', g != null ? g.toFixed(2).replace('.', ',') : '',
      r.manual ? 'вручную' : 'НБГ', '"' + (r.note || '').replace(/"/g, '""') + '"'].join(';');
  });
  return '﻿' + [head, ...lines].join('\r\n');
}
function fromCsv(text) {
  let added = 0;
  const lines = text.replace(/^﻿/, '').split(/\r?\n/);
  if (/Категория/.test(lines[0] || '')) return spendFromCsv(lines);
  const withCur = /Валюта/.test(lines[0] || '');
  for (const ln of lines.slice(1)) {
    if (!ln.trim()) continue;
    let c = (ln.match(/("([^"]|"")*"|[^;]*)(;|$)/g) || []).map(s => s.replace(/;$/, '').replace(/^"|"$/g, '').replace(/""/g, '"'));
    const cur = withCur && INC_CUR[c[2]] ? c[2] : 'USD';
    if (withCur) c = [c[0], c[1], ...c.slice(3)];
    const [d, m, y] = (c[0] || '').split('.'); if (!y) continue;
    const date = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`, usd = parseFloat((c[1] || '').replace(',', '.'));
    if (!(usd >= 0)) continue;
    const note = c[5] || '';
    if (rows.some(r => r.date === date && r.usd === usd && curOf(r) === cur && (r.note || '') === note)) continue;
    const manual = c[4] === 'вручную', rate = parseFloat((c[2] || '').replace(',', '.'));
    const rec = { id: newId(), ts: Date.now(), date, usd, note, rate: manual ? rate : null, manual: manual && rate > 0, cur };
    if (meId()) rec.by = meId();
    rows.push(rec);
    added++;
  }
  return added;
}
function spendCsv() {
  const head = 'Дата;Сумма;Валюта;Курс;GEL;Категория;Комментарий';
  const lines = [...spends].sort((a, b) => a.date.localeCompare(b.date) || a.ts - b.ts).map(x => {
    const [y, m, d] = x.date.split('-');
    return [`${d}.${m}.${y}`, x.amt.toFixed(2).replace('.', ','), x.cur, x.k.toFixed(6).replace('.', ','), x.gel.toFixed(2).replace('.', ','),
      catOf(x.cat).n, '"' + (x.note || '').replace(/"/g, '""') + '"'].join(';');
  });
  return '﻿' + [head, ...lines].join('\r\n');
}
function spendFromCsv(lines) {
  let added = 0;
  for (const ln of lines.slice(1)) {
    if (!ln.trim()) continue;
    const c = (ln.match(/("([^"]|"")*"|[^;]*)(;|$)/g) || []).map(s => s.replace(/;$/, '').replace(/^"|"$/g, '').replace(/""/g, '"'));
    const [d, m, y] = (c[0] || '').split('.'); if (!y) continue;
    const date = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`, num = v => parseFloat((v || '').replace(/\s/g, '').replace(',', '.'));
    const amt = num(c[1]), k = num(c[3]) || 1, gel = num(c[4]);
    if (!(amt > 0) || !(gel >= 0)) continue;
    const cat = (CATS.find(x => x.n === c[5]) || CATS[CATS.length - 1]).id, note = c[6] || '';
    if (spends.some(x => x.date === date && x.amt === amt && x.cur === c[2] && (x.note || '') === note)) continue;
    spends.push({ id: newId(), date, ts: Date.now() + added, amt, cur: c[2] || 'GEL', k, gel, cat, note });
    added++;
  }
  saveSpends();
  return added;
}
async function exportCsv(kind) {

/* ---------- звёздочки при выборе и лёгкая вибрация (как в scrmoods) ---------- */
const STAR_PATH = (() => {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 0.45 : 1, a = -Math.PI / 2 + i * Math.PI / 5;
    d += (i ? 'L' : 'M') + (Math.cos(a) * r).toFixed(3) + ' ' + (Math.sin(a) * r).toFixed(3);
  }
  return d + 'Z';
})();
function popButton(p) {
  if ((window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  const b = p.el;
  if (!b || !b.animate) return;
  b.animate([
    { transform: 'scale(1)' }, { transform: 'scale(.84)', offset: .17 }, { transform: 'scale(1.08)', offset: .5 },
    { transform: 'scale(.98)', offset: .78 }, { transform: 'scale(1)' },
  ], { duration: 440, easing: 'ease-out' });
  if (!p.stars) return;
  const r = b.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, reach = Math.min(r.width, r.height) / 2;
  const main = p.color === 'acc' ? getComputedStyle(document.documentElement).getPropertyValue('--acc').trim() : getComputedStyle(b).backgroundColor;
  const colors = [main, main, '#E8A93A', '#E8A93A', main];
  let layer = document.getElementById('sparkles');
  if (!layer) { layer = document.createElement('div'); layer.id = 'sparkles'; document.body.appendChild(layer); }
  const n = 9, start = Math.random() * 6.28;
  for (let i = 0; i < n; i++) {
    const ang = start + i * 2 * Math.PI / n + (Math.random() - .5) * .5;
    const dist = reach * .7 + 38 * (.75 + Math.random() * .6), d0 = reach * .7;
    const size = 14 * (.8 + Math.random() * .5), dot = i % 3 === 2, spin = (Math.random() - .5) * 540;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const el = document.createElement('span');
    const w = dot ? size * .45 : size;
    el.style.cssText = `left:${cx - w / 2}px;top:${cy - w / 2}px;width:${w}px;height:${w}px;` + (dot ? `border-radius:50%;background:${color}` : '');
    if (!dot) el.innerHTML = `<svg viewBox="-1 -1 2 2"><path d="${STAR_PATH}" fill="${color}"/></svg>`;
    layer.appendChild(el);
    const at = (k, sc, rot) => `translate(${Math.cos(ang) * k}px, ${Math.sin(ang) * k}px) rotate(${rot}deg) scale(${sc})`;
    el.animate([
      { transform: at(d0, .2, 0), opacity: 1 },
      { transform: at(d0 + (dist - d0) * .5, 1.1, spin * .3), opacity: 1, offset: .2 },
      { transform: at(d0 + (dist - d0) * .85, .95, spin * .7), opacity: 1, offset: .55 },
      { transform: at(dist, .5, spin), opacity: 0 },
    ], { duration: 720, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => el.remove();
  }
}
function haptic() {
  try {

/* ---------- совместный бюджет: синхронизация через свой Cloudflare Worker (формат 2) ----------
   Общие: План (budget, minc), Расходы (spend, spCatsUser), Приходы (rows, у каждого прихода владелец by)
   и участники (members). Всё шифруется AES-GCM ключом из кода синхронизации; сервер хранит шифр.

   Как не терять данные:
   • Данные раскладываются на «поля»: статья/расход/приход целиком, поле объекта, порядок списка.
   • У каждого поля время последней правки. Время ставится ТОЛЬКО когда правку делает человек
     в этой вкладке (store.set сравнивает с тем, что вкладка видела раньше). Поле, изменённое не так
     (устаревшая вкладка, старая версия приложения), получает время 0 и проигрывает свежему.
   • Запись исчезает только после явного удаления (надгробие с временем). Просто «нет в списке» —
     не удаление: запись вернётся с сервера или с другого устройства.
   • Побеждает самая поздняя правка поля. Перед любым удалением с другого устройства — резервная копия.
   • Вкладки слушают друг друга (storage), синхронизирует одна вкладка за раз (navigator.locks).
   • Ключ формата 2 другой, поэтому старые версии приложения не могут ни прочитать, ни перезаписать данные. */
const SYNC_SERVER = '';            // адрес Worker'а по умолчанию; пусто — спрашиваем в настройках
const CROCK = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const SK2D = { budget: 'budget', spend: 'spend', minc: 'minc', spCatsUser: 'cats', rows: 'rows', members: 'members' };
const D2SK = Object.fromEntries(Object.entries(SK2D).map(([a, b]) => [b, a]));
const KEYED = new Set(['budget.accts', 'budget.inc', 'budget.exp', 'budget.goals', 'budget.goals[].log', 'spend', 'cats', 'rows']);
const TOMB_DAYS = 180;
let syncCfg = store.get('sync', null);          // { code, server, dev, me, v, ok, err }
let members = store.get('members', {});         // { id: { n: имя } }
let syncKeyC = {}, syncBusy = false, syncAgain = false, syncWait = false, syncTimer = null, syncState = '', syncJoin = null, syncRenderWait = false;
let syncHist = null;                            // версии на сервере для окна восстановления
// старые ключи формата 1 больше не нужны
try { localStorage.removeItem('scrmoney.syncBase'); localStorage.removeItem('scrmoney.syncRecv'); } catch (e) {}

const syncNorm = s => String(s || '').toUpperCase().replace(/O/g, '0').replace(/[IL]/g, '1').replace(/[^0-9A-Z]/g, '').split('').filter(c => CROCK.includes(c)).join('');
const syncFmt = c => c.match(/.{1,4}/g).join('-');
const syncNewCode = () => { const b = crypto.getRandomValues(new Uint8Array(20)); return [...b].map(x => CROCK[x & 31]).join(''); };
const syncSrv = () => ((syncCfg && syncCfg.server) || store.get('syncServer', '') || SYNC_SERVER).replace(/\/+$/, '');
const syncSave = () => syncSetLocal('sync', syncCfg);
const b64 = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const utf8 = s => new TextEncoder().encode(s);
const netErr = e => /Failed to fetch|NetworkError|Load failed|network/i.test(e && e.message || '') ? 'нет связи с сервером' : (e && e.message) || 'ошибка';
async function syncRoom(code) { const h = new Uint8Array(await crypto.subtle.digest('SHA-256', utf8('scrmoney-room-v1:' + code))); return [...h].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function syncKey(code, ver = 2) {
  const id = ver + ':' + code;
  if (syncKeyC[id]) return syncKeyC[id];
  const raw = await crypto.subtle.importKey('raw', utf8(code), 'PBKDF2', false, ['deriveKey']);
  return syncKeyC[id] = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: utf8(ver === 2 ? 'scrmoney-sync-v2' : 'scrmoney-sync-v1'), iterations: 150000, hash: 'SHA-256' }, raw, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

async function syncEnc(code, obj) {

// формат 2 → { f: Map путь→{t,v}, z: Map путь→t }; формат 1 (v23) переводится с временем 0: только заполняет пробелы
async function syncDec(code, d) {
  const parts = String(d).split('.');

  catch (e) { throw new Error('не удалось расшифровать — проверьте код'); }
  if (v2) return { f: new Map(obj.f.map(([p, t, v]) => [p, { t, v }])), z: new Map(obj.z || []) };
  const doc = obj.doc || {}, f = new Map();
  for (const [p, v] of flatDoc({ budget: doc.budget || null, spend: doc.spend || [], minc: doc.minc || {}, cats: doc.cats || [] })) f.set(p, { t: 0, v });
  return { f, z: new Map() };
}

// ---------- поля ----------
const canon = x => x === undefined ? 'u' : JSON.stringify(x, (k, v) => v && typeof v === 'object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((o, kk) => (o[kk] = v[kk], o), {}) : v);
const same = (a, b) => canon(a) === canon(b);
const isObj = x => x !== null && typeof x === 'object' && !Array.isArray(x);
const fnv = s => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
const hv = v => fnv(canon(v));
// копия без пустых объектов (их на лету создаёт factOf)
function clean(x) {
  if (Array.isArray(x)) return x.map(clean);
  if (isObj(x)) { const o = {}; for (const k of Object.keys(x)) { if (x[k] === undefined) continue; const v = clean(x[k]); if (isObj(v) && !Object.keys(v).length) continue; o[k] = v; } return o; }
  return x;
}
const pk = segs => JSON.stringify(segs);
const normPath = segs => segs.reduce((s, x) => x[0] === '@' ? s + '[]' : s ? s + '.' + x : x, '');
function flatten(x, segs, out) {
  if (x === undefined) return;
  if (Array.isArray(x) && KEYED.has(normPath(segs))) {
    const ord = [];
    for (const el of x) {
      if (!isObj(el)) continue;
      const id = el.id != null ? String(el.id) : 'h' + hv(el);
      if (ord.includes(id)) continue;
      ord.push(id);
      const s2 = [...segs, '@' + id], leaf = {};
      for (const k of Object.keys(el)) {
        if (el[k] === undefined) continue;
        if (Array.isArray(el[k]) && KEYED.has(normPath([...s2, k]))) flatten(el[k], [...s2, k], out); else leaf[k] = el[k];
      }
      out.set(pk(s2), leaf);
    }
    out.set(pk([...segs, '#']), ord);
    return;
  }
  if (isObj(x)) { for (const k of Object.keys(x)) flatten(x[k], [...segs, k], out); return; }
  out.set(pk(segs), x);
}
const flatDoc = D => { const out = new Map(); for (const k of Object.keys(D)) flatten(D[k], [k], out); return out; };
const flatKey = (dk, v) => { const out = new Map(); flatten(v, [dk], out); return out; };
function unflatten(map) {
  const root = {}, KC = Symbol('keyed');
  const entries = [...map].map(([p, v]) => [JSON.parse(p), v]).sort((a, b) => a[0].length - b[0].length);
  for (const [segs, val] of entries) {
    let node = root;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i], last = i === segs.length - 1, next = segs[i + 1];
      if (s[0] === '@') {
        const id = s.slice(1); let it = node.items.get(id);
        if (!it) { it = {}; node.items.set(id, it); }
        if (last) { Object.assign(it, isObj(val) ? val : {}); it[KC] = true; } else node = it;
      } else if (s === '#') { node.order = Array.isArray(val) ? val : []; }
      else if (next !== undefined && (next[0] === '@' || next === '#')) {
        if (!node[s] || !node[s].items) node[s] = { items: new Map(), order: null, [KC]: 'list' };
        node = node[s];
      } else if (last) { if (!(isObj(node[s]) && Object.keys(node[s]).length)) node[s] = val; }
      else { if (!isObj(node[s]) || node[s].items) node[s] = {}; node = node[s]; }
    }
  }
  const fin = x => {
    if (x && x[KC] === 'list') {
      const ids = [...(x.order || []).filter(id => x.items.has(id)), ...[...x.items.keys()].filter(id => !(x.order || []).includes(id))];
      return [...new Set(ids)].map(id => x.items.get(id)).filter(it => it[KC]).map(fin);
    }
    if (Array.isArray(x)) return x;
    if (isObj(x)) { const o = {}; for (const k of Object.keys(x)) o[k] = fin(x[k]); return o; }
    return x;
  };

}

// ---------- время правок: что изменил человек в этой вкладке ----------
let syncLast = {};                              // ключ хранилища → Map полей, какими их видела эта вкладка
const readClk = () => store.get('syncClk', {}), readTomb = () => store.get('syncTomb', {});

const getK = k => k === 'rows' ? rowsFix(store.get('rows', [])) : store.get(k, k === 'budget' ? null : k === 'minc' || k === 'members' ? {} : []);

function syncRecord(k, v) {
  const nf = flatKey(SK2D[k], v), of = syncLast[k] || new Map(), t = Date.now();

// ---------- слияние ----------
// побеждает больший (время, значение раньше надгробия, детерминированно по тексту)
function syncMerge(A, B) {
  const f = new Map(), z = new Map(), paths = new Set([...A.f.keys(), ...A.z.keys(), ...B.f.keys(), ...B.z.keys()]);

    const c = [];
    for (const S of [A, B]) { if (S.f.has(p)) c.push({ t: S.f.get(p).t, v: S.f.get(p).v, val: 1 }); if (S.z.has(p)) c.push({ t: S.z.get(p), val: 0 }); }
    c.sort((x, y) => y.t - x.t || y.val - x.val || (canon(y.v) > canon(x.v) ? 1 : canon(y.v) < canon(x.v) ? -1 : 0));
    const w = c[0];
    if (w.val) f.set(p, { t: w.t, v: w.v }); else if (w.t > cutoff) z.set(p, w.t);
  }

}
const sigOf = S => canon([[...S.f].map(([p, e]) => [p, e.t, e.v]).sort((a, b) => a[0] < b[0] ? -1 : 1), [...S.z].sort((a, b) => a[0] < b[0] ? -1 : 1)]);

  return { f, z: new Map(Object.entries(tomb).filter(([p]) => !f.has(p))) };
}
const docOf = S => { const m = new Map(); for (const [p, e] of S.f) m.set(p, e.v); const u = unflatten(m); return { budget: u.budget || null, spend: u.spend || [], minc: u.minc || {}, cats: u.cats || [], rows: u.rows || [], members: u.members || {} }; };

const countOf = D => ({ rows: (D.rows || []).length, spend: (D.spend || []).length, plan: D.budget ? (D.budget.inc || []).length + (D.budget.exp || []).length + (D.budget.goals || []).length + (D.budget.accts || []).length : 0 });
// записать итог слияния в хранилище и память, не считая это своей правкой
function syncApply(M, D, write = true) {
  if (write) for (const dk of Object.keys(D)) { const k = D2SK[dk]; syncSetLocal(k, D[dk]); syncLoadMem(k, D[dk]); syncSeen(k, D[dk]); }

}

function syncCanApply() {

function syncStatus(s, err) {

  if (syncCfg && (s === 'ok' || s === 'err')) { const c = store.get('sync', null) || syncCfg; if (s === 'ok') { c.ok = Date.now(); c.err = ''; } else c.err = err; c.v = Math.max(c.v || 0, syncCfg.v || 0); syncCfg = { ...syncCfg, ok: c.ok, err: c.err, v: c.v }; syncSave(); }

}

  if (!syncCanApply()) { syncWait = true; return; }
  // одна вкладка за раз
  if (navigator.locks && navigator.locks.request) {
    return navigator.locks.request('scrmoney-sync', { ifAvailable: true }, async lock => { if (!lock) { syncSoon(4000); return; } await syncRun(); });
  }

}
async function syncRun() {
  syncBusy = true; syncWait = false; syncStatus('busy');
  syncCfg = store.get('sync', null) || syncCfg;
  const cfg = syncCfg;
  try {
    const url = syncSrv() + '/r/' + await syncRoom(cfg.code);
    for (let tries = 0; tries < 4; tries++) {
      const res = await fetch(url, { cache: 'no-store' });
      let R = { f: new Map(), z: new Map() }, rv = 0, have = false;
      if (res.status === 200) {
        const j = await res.json(); rv = j.v;
        if (rv < (cfg.v || 0)) { syncStatus('wait'); syncSoon(15000); return; }      // сервер ещё не догнал нашу запись
        R = await syncDec(cfg.code, j.d); have = true;
      } else if (res.status !== 404) throw new Error('сервер ответил ' + res.status);
      else if (cfg.v > 0) { syncStatus('wait'); syncSoon(15000); return; }
      if (store.get('sync', null) === null || syncCfg !== cfg) return;
      if (!syncCanApply()) { syncWait = true; syncStatus('wait'); return; }
      // дальше до записи — без await: правки не могут вклиниться
      const Ld = storeDoc(), L = localState(Ld), M = syncMerge(L, R), Md = docOf(M);
      Md.budget = Md.budget ? budgetAccts(budgetMigrate(Md.budget)) : null;
      const changed = flatSig(Md) !== flatSig(Ld);
      if (changed) {
        const a = countOf(Ld), b = countOf(Md);
        if (b.rows < a.rows || b.spend < a.spend || b.plan < a.plan) backupMake('до удаления с другого устройства', Ld);
        syncApply(M, Md); render();
        toast('Обновлено с другого устройства');
      } else syncApply(M, Ld, false);
      if (have && sigOf(M) === sigOf(R)) { cfg.v = rv; syncStatus('ok'); return; }
      const body = { v: rv, d: await syncEnc(cfg.code, { v: 2, f: [...M.f].map(([p, e]) => [p, e.t, e.v]), z: [...M.z] }) };
      const put = await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (put.status === 409) continue;
      if (!put.ok) throw new Error('сервер ответил ' + put.status);

    }

}

}

    case 'synccreate': {
      const s = syncServerIn(), name = ($('#syncNameIn').value || '').trim();
      if (!okServer(s)) { toast('Впишите адрес сервера'); $('#syncSrvIn') && $('#syncSrvIn').focus(); return; }
      if (!name) { toast('Впишите своё имя'); $('#syncNameIn').focus(); return; }
      syncBox('<p class="hint" style="text-align:center">создаю…</p>');
      backupMake('перед созданием общего бюджета');
      const ok = await syncCreate(s, name);
      if (!ok) { const e = syncCfg && syncCfg.err; syncOff(); render(); syncBox(`<p class="hint syncerr" style="text-align:center">Не получилось: ${esc(e || 'нет связи с сервером')}</p>`); return; }
      render(); toast('Общий бюджет создан'); syncBox(syncInviteHtml()); return;
    }
    case 'syncjoin': syncJoin = { code: (syncJoin && syncJoin.code) || '' }; syncBox(syncJoinHtml()); $('#syncCodeIn').focus(); return;
    case 'syncjoingo': {
      const code = syncNorm($('#syncCodeIn').value), s = syncServerIn();
      if (code.length !== 20) { toast('В коде 20 знаков'); return; }
      if (!okServer(s)) { toast('Впишите адрес сервера'); return; }
      syncJoin = { code, server: s, name: ($('#syncNameIn') && $('#syncNameIn').value || '').trim() };
      syncBox('<p class="hint" style="text-align:center">проверяю код…</p>');
      try { Object.assign(syncJoin, await syncPeek(code, s)); } catch (e) { syncBox(syncJoinHtml() + `<p class="hint syncerr" style="text-align:center">${esc(netErr(e))}</p>`); return; }
      syncBox(syncWhoHtml()); return;
    }
    case 'syncme': syncJoin.name = ($('#syncJoinName') && $('#syncJoinName').value || syncJoin.name || '').trim(); syncJoin.me = el.dataset.id || null; syncBox(syncWhoHtml()); return;
    case 'syncplan': syncJoin.name = ($('#syncJoinName') && $('#syncJoinName').value || syncJoin.name || '').trim(); syncJoin.plan = el.dataset.v; syncBox(syncWhoHtml()); return;
    case 'syncjoinyes': {
      const j = syncJoin;
      if (!j.me) { j.name = ($('#syncJoinName') && $('#syncJoinName').value || j.name || '').trim(); if (!j.name) { toast('Впишите своё имя'); return; } }
      const planQ = j.D.budget && budget && !same(clean(budget), clean(j.D.budget));
      let mode = j.plan;
      if (!mode) { const tR = Math.max(0, ...[...j.R.f].filter(([p]) => p.startsWith('["budget"')).map(([, e]) => e.t)), tL = Math.max(0, ...Object.entries(readClk()).filter(([p]) => p.startsWith('["budget"')).map(([, c]) => c[0])); mode = tL > tR ? 'mine' : 'theirs'; }
      if (planQ || budget) backupMake('перед подключением к общему бюджету');
      syncJoin = null;
      await syncConnect(j, planQ ? mode : 'theirs');
      tab = budget ? 'plan' : tab; render(); window.scrollTo(0, 0);
      toast(syncState === 'ok' ? 'Подключено к общему бюджету' : 'Подключено, синхронизация чуть позже');
      return;
    }
    case 'syncjoinno': syncJoin = null; syncBox(''); return;
    case 'syncinvite': {
      const link = syncLink(), text = 'Общий бюджет в scrmoney: откройте ссылку на своём телефоне';
      if (navigator.share) { try { await navigator.share({ title: 'scrmoney', text, url: link }); return; } catch (e) { if (e.name === 'AbortError') return; } }
      syncBox(syncInviteHtml());
      try { await navigator.clipboard.writeText(link); toast('Ссылка скопирована'); } catch (e) {}
      return;
    }
    case 'synccopy': try { await navigator.clipboard.writeText(syncLink()); toast('Ссылка скопирована'); } catch (e) { toast('Не удалось скопировать'); } return;
    case 'syncnow': syncNow(); return;
    case 'syncgo': tab = 'settings'; render(true); window.scrollTo(0, 0); return;
    case 'syncoff': syncBox(`<div class="confirm">Отключить синхронизацию на этом устройстве? Данные останутся здесь, у других участников всё сохранится.<div class="row"><button class="btn outline" data-act="syncoffno">Нет</button><button class="btn primary" data-act="syncoffyes">Отключить</button></div></div>`); return;
    case 'syncoffno': syncBox(''); return;
    case 'syncoffyes': syncOff(); render(); toast('Синхронизация отключена'); return;
    // резервные копии
    case 'syncbk': {
      const b = $('#bkList'); if (!b) return;
      if (b.innerHTML) { b.innerHTML = ''; return; }
      b.innerHTML = backupListHtml(); return;
    }
    case 'syncbkuse': { const l = store.get('backups', []), x = l[+el.dataset.i]; if (x) $('#bkList').innerHTML = backupAskHtml(x.d, x.t, 'syncbkyes', el.dataset.i); return; }
    case 'syncbkyes': { const l = store.get('backups', []), x = l[+el.dataset.i]; if (x) { restoreDoc(x.d, 'Возвращена копия: ' + atWord(x.t)); } return; }
    case 'syncbkno': $('#bkList').innerHTML = backupListHtml(); return;
    case 'syncsrvh': {
      const b = $('#bkList'); if (!b || !syncCfg) return;
      b.innerHTML = '<p class="hint" style="text-align:center">загружаю версии с сервера…</p>';
      try {
        const res = await fetch(syncSrv() + '/r/' + await syncRoom(syncCfg.code) + '/h', { cache: 'no-store' });
        if (res.status === 404) { b.innerHTML = '<p class="hint">На сервере старая версия Worker\'а без истории. Обновите его код из файла sync-worker.js (SYNC.md, шаг 3).</p>'; return; }
        if (!res.ok) throw new Error('сервер ответил ' + res.status);
        syncHist = (await res.json()).list || [];
        b.innerHTML = syncHist.length ? `<p class="hint" style="margin:6px 0">Версии на сервере (раз в 10 минут, хранятся 30 дней):</p>` + syncHist.map((h, i) => `<button class="bkrow" data-act="syncsrvget" data-i="${i}"><b>${atWord(h.t)}</b><i>версия ${h.v}</i></button>`).join('') : '<p class="hint">Версий на сервере пока нет — они появляются после правок.</p>';
      } catch (e) { b.innerHTML = `<p class="hint syncerr">${esc(netErr(e))}</p>`; }
      return;
    }
    case 'syncsrvget': {
      const h = syncHist && syncHist[+el.dataset.i]; if (!h) return;
      const b = $('#bkList'); b.innerHTML = '<p class="hint" style="text-align:center">загружаю…</p>';
      try {
        const res = await fetch(syncSrv() + '/r/' + await syncRoom(syncCfg.code) + '/h/' + encodeURIComponent(h.k), { cache: 'no-store' });
        if (!res.ok) throw new Error('сервер ответил ' + res.status);
        const D = docOf(await syncDec(syncCfg.code, (await res.json()).d));
        syncHist.D = D; b.innerHTML = backupAskHtml(D, h.t, 'syncsrvyes', el.dataset.i);
      } catch (e) { b.innerHTML = `<p class="hint syncerr">${esc(netErr(e))}</p>`; }
      return;
    }
    case 'syncsrvyes': if (syncHist && syncHist.D) restoreDoc(syncHist.D, 'Возвращена версия с сервера'); return;
    case 'syncfile': backupFile(); return;
    case 'syncwhome': case 'syncwhonew': {
      let id = el.dataset.id;
      if (act === 'syncwhonew') { const n = ($('#whoNewName').value || '').trim(); if (!n) { toast('Впишите своё имя'); $('#whoNewName').focus(); return; } id = newId(); members = { ...members, [id]: { n } }; store.set('members', members); }
      syncCfg = { ...syncCfg, me: id }; syncSave(); syncAssignRows(); render(); toast('Готово: ' + memberName(id)); syncSoon(500); return;
    }
    case 'syncfilein': $('#importFile').click(); return;
  }
}
function backupListHtml() {
  const l = store.get('backups', []);
  return (l.length ? l.map((x, i) => `<button class="bkrow" data-act="syncbkuse" data-i="${i}"><b>${atWord(x.t)}</b><i>${esc(x.why)} · ${backupWord(x.d)}</i></button>`).join('') : '<p class="hint">Копий пока нет.</p>')
    + (syncCfg ? '<button class="btn outline" data-act="syncsrvh" style="margin-top:8px">Версии на сервере</button>' : '');
}
const backupAskHtml = (D, t, act, i) => `<div class="confirm">Вернуть данные на ${atWord(t)}?<br><small>${backupWord(D)}. Сейчас: ${backupWord(storeDoc())}. Текущие данные сохраню в копию${syncCfg ? ', возвращённое уйдёт всем участникам' : ''}.</small>
  <div class="row"><button class="btn outline" data-act="syncbkno">Нет</button><button class="btn primary" data-act="${act}" data-i="${i}">Вернуть</button></div></div>`;
function backupSection() {
  return `<p class="hint" style="margin:6px 0 8px">Приложение само делает копии раз в день и перед каждым удалением с другого устройства${syncCfg ? '; сервер хранит версии каждые 10 минут' : ''}.</p>
    <button class="btn outline" data-act="syncbk">Резервные копии</button>
    <div id="bkList"></div>
    <button class="btn outline" data-act="syncfile">Сохранить всё в файл</button>
    <button class="btn outline" data-act="syncfilein">Загрузить из файла</button>
    <p class="hint" style="margin:0 0 6px;text-align:center">файл копии (.json) или CSV приходов и расходов</p>`;
}
const syncInviteHtml = () => `<div class="syncinv"><p class="hint" style="margin:8px 0 6px">Отправьте эту ссылку — человек откроет её у себя и окажется в общем бюджете:</p>
  <input class="in" readonly value="${esc(syncLink())}" onclick="this.select()" aria-label="Ссылка-приглашение">
  <button class="btn outline" data-act="synccopy">Скопировать ссылку</button></div>`;

// приглашение по ссылке: #join=КОД&s=адрес
(function syncFromHash() {
  const h = new URLSearchParams(location.hash.slice(1)), code = syncNorm(h.get('join'));
  if (!code) return;
  history.replaceState(null, '', location.pathname + location.search);
  if (syncCfg && syncCfg.code === code) { setTimeout(() => toast('Это устройство уже в общем бюджете'), 300); return; }
  if (h.get('s')) store.set('syncServer', h.get('s').replace(/\/+$/, ''));
  if (syncCfg) syncOff();
  syncJoin = { code };
  tab = 'settings';
  setTimeout(() => { const b = document.querySelector('[data-act=syncjoingo]'); if (b) b.click(); }, 50);
})();
document.addEventListener('click', e => { const el = e.target.closest('[data-act^=sync]'); if (el) syncAct(el.dataset.act, el); });
document.addEventListener('change', e => {
  if (e.target.id !== 'syncNameIn' || !syncCfg) return;
  const n = e.target.value.trim(); if (!n) return;
  members = { ...members, [meId()]: { n } }; store.set('members', members); toast('Имя сохранено');
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncSoon(300); else if (syncCfg && !syncBusy) syncNow(); });
window.addEventListener('online', () => syncSoon(300));
document.addEventListener('focusout', () => setTimeout(() => {
  if (syncRenderWait && syncCanApply()) { syncRenderWait = false; render(); }
  if (syncWait) syncSoon(1500);
}, 0));
setInterval(() => { if (syncCfg && document.visibilityState === 'visible' && !syncBusy) syncNow(); }, 45000);
// что вкладка видит сейчас — от этого считаются свои правки
for (const k of Object.keys(SK2D)) syncSeen(k, getK(k));
syncReady = true;
// общий бюджет из версии 23: у устройства ещё нет участника — заводим, приходы — его
if (syncCfg && !syncCfg.me) { const dm = 'd:' + syncCfg.dev; let ch = false; for (const r of rows) if (!r.by) { r.by = dm; ch = true; } if (ch) save(); }
if (multi() && incWho !== 'me' && incWho !== 'all' && !members[incWho]) incWho = 'all';

render(true);
syncStatus('');
syncSoon(600);
// сначала один запрос всех валют на сегодня, из него же берётся курс доллара
loadFx([...new Set([...fxList, 'USD', 'EUR', 'RUB'])]).finally(() => {
  render();
  loadMissing();
});
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
