  $('#ps').innerHTML = edit.manual ? `по курсу, который вы ввели: ${edit.rate} ₾ за ${s} · ${chk}`
    : autoRate ? `по курсу НБГ${on}: ${autoRate.toFixed(4).replace('.', ',')} ₾ за ${s} · ${chk}`
    : autoErr ? `Курс НБГ${on} не загрузился (${esc(autoErr)}). Посмотрите его на сайте — ${chk} — и впишите в поле «Курс».`
    : edit.date ? `загружаю курс НБГ${on}…` : 'выберите дату';
}
function openSpend(x) {
  const c = catOf(x.cat);
  $modal.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="st">
    <div class="dh"><b id="st">${c.n}</b><button class="x" data-act="close" aria-label="Закрыть">✕</button></div>
    <div class="preview" style="margin-top:8px"><div class="pv num">${money(x.gel)} ₾</div>
      <div class="ps">${x.cur !== 'GEL' ? `${fxFmt(x.amt, x.cur)} ${CUR[x.cur] ? CUR[x.cur].s : x.cur} по курсу ${x.k.toFixed(4).replace('.', ',')} ₾ · ` : ''}${dayWord(x.date)}</div></div>
    <div class="cats">${CATS.map(k => `<button data-act="spsetcat" data-id="${k.id}" class="${(x.cat || 'other') === k.id ? 'on' : ''}">${k.n}</button>`).join('')}</div>
    <input class="in" id="spEditNote" type="text" maxlength="80" placeholder="на что" value="${esc(x.note || '')}" style="margin-top:10px">
    <button class="btn primary" data-act="spupd" data-id="${x.id}" style="margin-top:14px">Сохранить</button>
    <button class="btn quiet" data-act="spdel" data-id="${x.id}">Удалить расход</button><div id="delBox"></div>
  </div>`;
  edit = { spend: x.id, cat: x.cat || 'other' };
  $modal.classList.add('open');
}
function closeModal() { $modal.classList.remove('open'); $modal.innerHTML = ''; edit = null; }

/* ---------- CSV ---------- */
function toCsv() {
  const head = 'Дата;Сумма;Валюта;Курс НБГ;GEL;Курс;Комментарий';
  const lines = [...rows].sort((a, b) => a.date.localeCompare(b.date)).map(r => {
    const k = rateOf(r), g = gelOf(r), [y, m, d] = r.date.split('-');
    return [`${d}.${m}.${y}`, r.usd.toFixed(2).replace('.', ','), curOf(r), k ? k.toFixed(4).replace('.', ',') : '', g != null ? g.toFixed(2).replace('.', ',') : '',
      r.manual ? 'вручную' : 'НБГ', '"' + (r.note || '').replace(/"/g, '""') + '"'].join(';');
  });
  return '﻿' + [head, ...lines].join('\r\n');
}
function fromCsv(text) {
  let added = 0;
  const lines = text.replace(/^﻿/, '').split(/\r?\n/);
  if (/Категория/.test(lines[0] || '')) return spendFromCsv(lines);
  const withCur = /Валюта/.test(lines[0] || '');
  for (const ln of lines.slice(1)) {
    if (!ln.trim()) continue;
    let c = (ln.match(/("([^"]|"")*"|[^;]*)(;|$)/g) || []).map(s => s.replace(/;$/, '').replace(/^"|"$/g, '').replace(/""/g, '"'));
    const cur = withCur && INC_CUR[c[2]] ? c[2] : 'USD';
    if (withCur) c = [c[0], c[1], ...c.slice(3)];
    const [d, m, y] = (c[0] || '').split('.'); if (!y) continue;
    const date = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`, usd = parseFloat((c[1] || '').replace(',', '.'));
    if (!(usd >= 0)) continue;
    const note = c[5] || '';
    if (rows.some(r => r.date === date && r.usd === usd && curOf(r) === cur && (r.note || '') === note)) continue;
    const manual = c[4] === 'вручную', rate = parseFloat((c[2] || '').replace(',', '.'));
    rows.push({ id: nextId++, date, usd, note, rate: manual ? rate : null, manual: manual && rate > 0, cur });
    added++;
  }
  return added;
}
function spendCsv() {
  const head = 'Дата;Сумма;Валюта;Курс;GEL;Категория;Комментарий';
  const lines = [...spends].sort((a, b) => a.date.localeCompare(b.date) || a.ts - b.ts).map(x => {
    const [y, m, d] = x.date.split('-');
    return [`${d}.${m}.${y}`, x.amt.toFixed(2).replace('.', ','), x.cur, x.k.toFixed(6).replace('.', ','), x.gel.toFixed(2).replace('.', ','),
      catOf(x.cat).n, '"' + (x.note || '').replace(/"/g, '""') + '"'].join(';');
  });
  return '﻿' + [head, ...lines].join('\r\n');
}
function spendFromCsv(lines) {
  let added = 0;
  for (const ln of lines.slice(1)) {
    if (!ln.trim()) continue;
    const c = (ln.match(/("([^"]|"")*"|[^;]*)(;|$)/g) || []).map(s => s.replace(/;$/, '').replace(/^"|"$/g, '').replace(/""/g, '"'));
    const [d, m, y] = (c[0] || '').split('.'); if (!y) continue;
    const date = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`, num = v => parseFloat((v || '').replace(/\s/g, '').replace(',', '.'));
    const amt = num(c[1]), k = num(c[3]) || 1, gel = num(c[4]);
    if (!(amt > 0) || !(gel >= 0)) continue;
    const cat = (CATS.find(x => x.n === c[5]) || CATS[CATS.length - 1]).id, note = c[6] || '';
    if (spends.some(x => x.date === date && x.amt === amt && x.cur === c[2] && (x.note || '') === note)) continue;
    spends.push({ id: newId(), date, ts: Date.now() + added, amt, cur: c[2] || 'GEL', k, gel, cat, note });
    added++;
  }
  saveSpends();
  return added;
}
async function exportCsv(kind) {
  const sp = kind === 'spend';
  const name = `scrmoney-${sp ? 'rashody' : 'prihody'}-${now}.csv`, blob = new Blob([sp ? spendCsv() : toCsv()], { type: 'text/csv;charset=utf-8' });
  try {
    const file = new File([blob], name, { type: 'text/csv' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- звёздочки при выборе и лёгкая вибрация (как в scrmoods) ---------- */
const STAR_PATH = (() => {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 0.45 : 1, a = -Math.PI / 2 + i * Math.PI / 5;
    d += (i ? 'L' : 'M') + (Math.cos(a) * r).toFixed(3) + ' ' + (Math.sin(a) * r).toFixed(3);
  }
  return d + 'Z';
})();
function popButton(p) {
  if ((window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  const b = p.el;
  if (!b || !b.animate) return;
  b.animate([
    { transform: 'scale(1)' }, { transform: 'scale(.84)', offset: .17 }, { transform: 'scale(1.08)', offset: .5 },
    { transform: 'scale(.98)', offset: .78 }, { transform: 'scale(1)' },
  ], { duration: 440, easing: 'ease-out' });
  if (!p.stars) return;
  const r = b.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, reach = Math.min(r.width, r.height) / 2;
  const main = p.color === 'acc' ? getComputedStyle(document.documentElement).getPropertyValue('--acc').trim() : getComputedStyle(b).backgroundColor;
  const colors = [main, main, '#E8A93A', '#E8A93A', main];
  let layer = document.getElementById('sparkles');
  if (!layer) { layer = document.createElement('div'); layer.id = 'sparkles'; document.body.appendChild(layer); }
  const n = 9, start = Math.random() * 6.28;
  for (let i = 0; i < n; i++) {
    const ang = start + i * 2 * Math.PI / n + (Math.random() - .5) * .5;
    const dist = reach * .7 + 38 * (.75 + Math.random() * .6), d0 = reach * .7;
    const size = 14 * (.8 + Math.random() * .5), dot = i % 3 === 2, spin = (Math.random() - .5) * 540;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const el = document.createElement('span');
    const w = dot ? size * .45 : size;
    el.style.cssText = `left:${cx - w / 2}px;top:${cy - w / 2}px;width:${w}px;height:${w}px;` + (dot ? `border-radius:50%;background:${color}` : '');
    if (!dot) el.innerHTML = `<svg viewBox="-1 -1 2 2"><path d="${STAR_PATH}" fill="${color}"/></svg>`;
    layer.appendChild(el);
    const at = (k, sc, rot) => `translate(${Math.cos(ang) * k}px, ${Math.sin(ang) * k}px) rotate(${rot}deg) scale(${sc})`;
    el.animate([
      { transform: at(d0, .2, 0), opacity: 1 },
      { transform: at(d0 + (dist - d0) * .5, 1.1, spin * .3), opacity: 1, offset: .2 },
      { transform: at(d0 + (dist - d0) * .85, .95, spin * .7), opacity: 1, offset: .55 },
      { transform: at(dist, .5, spin), opacity: 0 },
    ], { duration: 720, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => el.remove();
  }
}
function haptic() {
  try {
    if (navigator.vibrate) { navigator.vibrate(10); return; }
    const label = document.createElement('label'), input = document.createElement('input');
    label.ariaHidden = 'true'; label.style.display = 'none';
    input.type = 'checkbox'; input.setAttribute('switch', '');
    label.appendChild(input); document.head.appendChild(label); label.click(); label.remove();
  } catch (e) {}
}
document.addEventListener('click', ev => { if (ev.target.closest && ev.target.closest('button')) haptic(); }, true);

let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('in'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('in'), 2200); }

/* ---------- события ---------- */
document.addEventListener('click', e => {
  const nav = e.target.closest('#nav button');
  if (nav) { tab = nav.dataset.tab; render(true); window.scrollTo(0, 0); if (tab === 'plan' && !budget && !store.get('planHello', false)) { store.set('planHello', true); openWizard(0); } return; }
  if (e.target === $modal) { closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  switch (el.dataset.act) {
    case 'prev': if (--viewM < 1) { viewM = 12; viewY--; } render(); break;
    case 'next': if (++viewM > 12) { viewM = 1; viewY++; } render(); break;
    case 'yprev': yearY--; render(); break;
    case 'ynext': yearY++; render(); break;
    case 'month': viewY = yearY; viewM = +el.dataset.m; tab = 'income'; render(); window.scrollTo(0, 0); break;
    case 'add': openEdit(null); break;
    case 'edit': openEdit(rows.find(r => r.id === +el.dataset.id)); break;
    case 'close': closeModal(); break;
    case 'save': {
      const usd = parseFloat($('#fUsd').value), date = $('#fDate').value;
      if (!(usd > 0)) { $('#fUsd').focus(); toast('Впишите сумму'); break; }
      if (!date) { toast('Выберите дату'); break; }
      const rec = { id: edit.id || nextId++, date, usd: r2(usd), note: $('#fNote').value.trim(), rate: edit.manual ? edit.rate : null, manual: !!edit.manual, cur: edit.cur };
      const i = rows.findIndex(r => r.id === rec.id);
      if (i >= 0) rows[i] = rec; else rows.push(rec);
      save(); closeModal();
      [viewY, viewM] = ymd(date);
      tab = 'income'; render(); toast(i >= 0 ? 'Сохранено' : 'Приход записан'); loadMissing();
      break;
    }
    case 'fcur': setCur(el.dataset.c); break;
    case 'fday': setDate(shift(now, +el.dataset.n)); break;
    case 'del': $('#delBox').innerHTML = `<div class="confirm">Удалить этот приход?<div class="row"><button class="btn outline" data-act="delno">Нет</button><button class="btn primary" data-act="delyes">Удалить</button></div></div>`; break;
    case 'delno': $('#delBox').innerHTML = ''; break;
    case 'delyes': rows = rows.filter(r => r.id !== edit.id); save(); closeModal(); render(); toast('Приход удалён'); break;
    case 'fxset': fxBase = { c: fxBase.c, v: el.dataset.v }; store.set('fxBase', fxBase); render(); break;
    case 'fxrm': fxList = fxList.filter(c => c !== el.dataset.c); if (fxBase.c === el.dataset.c) fxBase = { c: fxList[0], v: fxBase.v }; store.set('fxList', fxList); store.set('fxBase', fxBase); render(); break;
    case 'spcat': spCat = el.dataset.id; store.set('spCat', spCat); spCatsOpen = false;
      document.querySelectorAll('[data-act=spcat]').forEach(b => b.classList.toggle('on', b === el));
      $('#catName').textContent = catOf(spCat).n; $('#catList').hidden = true; $('.catbtn .arr').textContent = '▾'; break;
    case 'spcats': spCatsOpen = $('#catList').hidden; $('#catList').hidden = !spCatsOpen; $('.catbtn .arr').textContent = spCatsOpen ? '▴' : '▾'; break;
    case 'spcatnew': $('#catNew').hidden = false; $('#catNewIn').focus(); break;
    case 'spcatok': {
      const n = $('#catNewIn').value.trim(); if (!n) break;
      const ex = CATS.find(c => c.n.toLowerCase() === n.toLowerCase());
      if (ex) spCat = ex.id;
      else { const c = { id: 'u' + newId(), n, s: n[0].toUpperCase() }; userCats.push(c); store.set('spCatsUser', userCats); CATS.splice(CATS.length - 1, 0, c); spCat = c.id; }
      store.set('spCat', spCat); spCatsOpen = false; render(); toast('Категория: ' + catOf(spCat).n); break;
    }
    case 'fxclr': fxBase = { c: fxBase.c, v: '' }; store.set('fxBase', fxBase); fxList.forEach(c => { $('#fx' + c).value = ''; }); spSum(); break;
    case 'fxtoggle': {
      const c = el.dataset.c;
      if (fxList.includes(c)) { if (fxList.length <= 2) { toast('Нужно хотя бы две валюты'); break; } fxList = fxList.filter(x => x !== c); if (fxBase.c === c) fxBase = { c: 'GEL', v: '' }; }
      else { fxList.push(c); loadFx(fxList).then(() => tab === 'spend' && render()); }
      store.set('fxList', fxList); store.set('fxBase', fxBase); fxSetOpen = true; render(); break;
    }
    case 'spday': spDate = shift(now, +el.dataset.n); render(); break;
    case 'spprev': if (--spM < 1) { spM = 12; spY--; } render(); break;
    case 'spnext': if (++spM > 12) { spM = 1; spY++; } render(); break;
    case 'spsave': {
      const v = fxNum(fxBase.v), c = fxBase.c, k = fxRate(c);
      if (!(v > 0)) { toast('Впишите сумму'); break; }
      if (!k) { toast('Нет курса для ' + c); break; }
      const date = spDate || now;
      const x = { id: newId(), date, ts: Date.now(), amt: r2(v), cur: c, k, gel: r2(v * k), cat: spCat, note: spNote.trim() };
      spends.push(x); saveSpends();
      fxBase = { c, v: '' }; store.set('fxBase', fxBase); spNote = ''; spDate = null;
      [spY, spM] = ymd(date);
      render(); toast(`Записано: ${money(x.gel)} ₾ · ${catOf(x.cat).n}`);
      break;
    }
    case 'spopen': openSpend(spends.find(x => x.id === el.dataset.id)); break;
    case 'spsetcat': edit.cat = el.dataset.id; document.querySelectorAll('[data-act=spsetcat]').forEach(b => b.classList.toggle('on', b === el)); break;
    case 'spupd': { const x = spends.find(y => y.id === el.dataset.id); x.cat = edit.cat; x.note = $('#spEditNote').value.trim(); saveSpends(); closeModal(); render(); toast('Сохранено'); break; }
    case 'spdel': $('#delBox').innerHTML = `<div class="confirm">Удалить этот расход?<div class="row"><button class="btn outline" data-act="delno">Нет</button><button class="btn primary" data-act="spdelyes" data-id="${el.dataset.id}">Удалить</button></div></div>`; break;
    case 'spdelyes': spends = spends.filter(x => x.id !== el.dataset.id); saveSpends(); closeModal(); render(); toast('Расход удалён'); break;
    case 'exportsp': exportCsv('spend'); break;
    case 'bwiz': openWizard(budget ? 1 : 0); break;
    case 'bwizhave': openWizard(1, 'have'); break;
    case 'bnew': $('#bnewBox').innerHTML = `<div class="confirm">Удалить план и пройти вопросы заново?<div class="row"><button class="btn outline" data-act="bnewno">Нет</button><button class="btn primary" data-act="bnewyes">Да</button></div></div>`; break;
    case 'bnewno': $('#bnewBox').innerHTML = ''; break;
    case 'bnewyes': budget = null; store.set('budget', null); wizDraft = null; render(); openWizard(0); break;
    case 'skin': applySkin(el.dataset.id); render(); break;
    case 'theme': if (skin !== 'classic') applySkin('classic'); applyTheme(el.dataset.id); render(); break;
    case 'export': exportCsv(); break;
    case 'import': $('#importFile').click(); break;
    case 'wipe': $('#wipeBox').innerHTML = `<div class="confirm">Удалить все ${rows.length} ${plural(rows.length, 'запись', 'записи', 'записей')}? Сначала сохраните CSV.<div class="row"><button class="btn outline" data-act="wipeno">Нет</button><button class="btn primary" data-act="wipeyes">Удалить всё</button></div></div>`; break;
    case 'wipeno': $('#wipeBox').innerHTML = ''; break;
    case 'wipeyes': rows = []; save(); render(); toast('Все записи удалены'); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && wiz) closeWizard(); else if (e.key === 'Escape' && $modal.classList.contains('open')) closeModal(); });
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { const n = fromCsv(String(rd.result)); save(); render(); toast(n ? `Добавлено записей: ${n}` : 'Новых записей нет'); loadMissing(); e.target.value = ''; };
  rd.readAsText(f, 'utf-8');
};

render(true);
// сначала один запрос всех валют на сегодня, из него же берётся курс доллара
loadFx([...new Set([...fxList, 'USD', 'EUR', 'RUB'])]).finally(() => {
  render();
  loadMissing();
});
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
