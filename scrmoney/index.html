<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>scrmoney</title>
<meta name="theme-color" content="#F3E1DC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="scrmoney">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face { font-family: Lora; src: url(../lora_regular.woff) format('woff'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: Lora; src: url(../lora_medium.woff) format('woff'); font-weight: 500 700; font-style: normal; font-display: swap; }
@font-face { font-family: Lora; src: url(../lora_italic.woff) format('woff'); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: Lora; src: url(../lora_medium_italic.woff) format('woff'); font-weight: 500 700; font-style: italic; font-display: swap; }
:root {
  /* та же палитра, что в scrmoods: какао-чернила на розоватой бумаге */
  --paper: #F3E1DC; --page: #FFF8F5; --ink: #3B2A25; --soft: #8A6B63; --faint: #C2A49B; --rule: #EBCFC6;
  --acc: #C0584A; --wash: #F9DCD3; --on-acc: #fff; --good: #93A77F; --warn: #D9B26A; --danger: #A8463F;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: Lora, Georgia, serif; font-size: 15.5px; line-height: 1.35; }
body { padding-top: calc(56px + var(--safe-top)); padding-bottom: calc(84px + var(--safe-bottom)); -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
#main { max-width: 620px; margin: 0 auto; }
.num { font-variant-numeric: tabular-nums lining-nums; }

/* верхняя полоса */
#top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: var(--paper); padding-top: var(--safe-top); }
#top .row { height: 56px; display: flex; align-items: center; padding: 0 16px 0 24px; max-width: 620px; margin: 0 auto; }
#top h1 { flex: 1; margin: 0; font-size: 21px; font-weight: 500; font-style: italic; color: var(--acc); }
#top .sync { font-size: 13px; font-style: italic; color: var(--soft); }

/* нижняя навигация */
#nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; background: var(--paper); border-top: 1px solid var(--rule);
  display: flex; justify-content: center; padding-bottom: var(--safe-bottom); }
#nav button { flex: 1; max-width: 200px; height: 68px; color: var(--soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12.5px; }
#nav .ic { width: 52px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
#nav svg { width: 22px; height: 22px; fill: currentColor; }
#nav button.on { color: var(--acc); font-weight: 500; }
#nav button.on .ic { background: var(--wash); }

/* заголовок страницы: крупный месяц, курсивная подпись, круглые стрелки */
.jhead { display: flex; align-items: flex-end; padding: 12px 20px 2px 24px; gap: 8px; }
.jhead .t { flex: 1; min-width: 0; }
.jhead .big { font-size: 32px; line-height: 38px; font-weight: 500; letter-spacing: -0.3px; }
.jhead .sub { font-size: 15.5px; font-style: italic; color: var(--soft); }
.rbtn { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--page); border: 1px solid var(--rule); display: grid; place-items: center; margin-bottom: 4px; color: var(--ink); }
.rbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
.rbtn:disabled { color: var(--rule); }

/* секции: курсивный заголовок и тонкая линия */
.section { padding: 0 20px; }
h2.hl { display: flex; align-items: center; gap: 14px; margin: 28px 0 6px; font-size: 19px; line-height: 24px; font-weight: 400; font-style: italic; color: var(--acc); }
h2.hl::after { content: ""; flex: 1 0 24px; height: 1px; background: var(--rule); }
.card { background: var(--page); border: 1px solid var(--rule); border-radius: 20px; margin: 12px 10px 0; padding: 4px 16px 16px; }
.card h2.hl { margin-top: 14px; }

/* курс дня — как цитата дня */
.rate { display: flex; padding: 12px 24px 4px 18px; gap: 4px; }
.rate .qm { width: 26px; flex: none; font-size: 30px; line-height: 40px; color: color-mix(in srgb, var(--acc) 55%, transparent); }
.rate .rv { font-size: 30px; line-height: 38px; font-weight: 500; }
.rate .rv small { font-size: 17px; font-weight: 400; color: var(--soft); }
.rate .rs { font-size: 13.5px; font-style: italic; color: var(--soft); margin-top: 2px; }
.rate .rs.bad { color: var(--danger); }
.rate .rvs { display: flex; flex-wrap: wrap; gap: 0 22px; }
.rate .rvs .rv { font-size: 26px; white-space: nowrap; }

/* большая кнопка — как «Summary» */
.sumbtn { display: flex; align-items: center; width: calc(100% - 20px); margin: 12px 10px 0; padding: 14px 18px; border-radius: 20px; background: var(--acc); color: var(--on-acc); text-align: left; }
.sumbtn > span:first-child { flex: 1; } .sumbtn b { display: block; font-size: 18px; font-weight: 500; } .sumbtn i { font-size: 13.5px; opacity: .85; }
.sumbtn .plus { width: 34px; height: 34px; border-radius: 50%; background: color-mix(in srgb, var(--on-acc) 18%, transparent); display: grid; place-items: center; font-size: 22px; line-height: 1; }

/* список приходов */
.inc { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 2px; text-align: left; border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); }
.inc:last-child { border-bottom: 0; }
.inc .d { width: 44px; flex: none; text-align: center; }
.inc .d b { display: block; font-size: 24px; line-height: 26px; font-weight: 500; }
.inc .d i { font-size: 12px; color: var(--soft); }
.inc .m { flex: 1; min-width: 0; }
.inc .m .usd { font-size: 17px; font-weight: 500; }
.inc .m .note { font-size: 13.5px; font-style: italic; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inc .g { text-align: right; flex: none; }
.inc .g b { display: block; font-size: 17px; font-weight: 500; color: var(--acc); }
.inc .g i { font-size: 12px; color: var(--soft); }
.inc .g i.manual { color: var(--warn); } .inc .g i.bad { color: var(--danger); }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 2px 0; border-top: 1px solid var(--rule); margin-top: 4px; }
.total span { font-style: italic; color: var(--soft); }
.total b { font-size: 19px; font-weight: 500; }
.empty { padding: 24px 8px 12px; text-align: center; font-style: italic; color: var(--soft); line-height: 21px; }

/* итоги года */
.yearbig { padding: 14px 4px 4px; }
.yearbig .k { font-size: 14px; font-style: italic; color: var(--soft); }
.yearbig .v { font-size: 38px; line-height: 44px; font-weight: 500; }
.yearbig .v small { font-size: 20px; color: var(--soft); font-weight: 400; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.pair > div { background: var(--paper); border-radius: 14px; padding: 10px 12px; }
.pair .k { font-size: 13px; font-style: italic; color: var(--soft); }
.pair .v { font-size: 19px; font-weight: 500; }
.limit { margin-top: 14px; }
.limit .bar { height: 8px; border-radius: 4px; background: var(--paper); overflow: hidden; }
.limit .bar i { display: block; height: 100%; border-radius: 4px; background: var(--good); transition: width .5s ease; }
.limit.hot .bar i { background: var(--warn); } .limit.over .bar i { background: var(--danger); }
.limit .lt { display: flex; justify-content: space-between; font-size: 12.5px; font-style: italic; color: var(--soft); margin-top: 6px; }
.chart svg { width: 100%; height: auto; display: block; margin-top: 8px; }
.mrow { display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 10px 2px; text-align: left; border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); }
.mrow:last-child { border-bottom: 0; }
.mrow .mn { flex: 1; } .mrow .mu { font-size: 13.5px; font-style: italic; color: var(--soft); } .mrow .mg { font-weight: 500; min-width: 110px; text-align: right; }
.mrow.zero { color: var(--faint); } .mrow.zero .mg { font-weight: 400; }
.hint { font-size: 13px; font-style: italic; color: var(--soft); line-height: 18px; margin: 10px 4px 0; }

/* выбор валюты и даты в окне прихода */
.seg { display: flex; gap: 6px; }
.seg button { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); font-size: 15px; white-space: nowrap; }
.seg button.on { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.seg.small button { min-height: 36px; font-size: 14px; }
.dayword { font-size: 13.5px; font-style: italic; color: var(--acc); margin-top: 6px; }
.chk { color: var(--acc); white-space: nowrap; }

/* личные расходы: конвертер */
.fx { padding-top: 6px; }
.fxrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); }
.fxrow:last-child { border-bottom: 0; }
.fxrow .sym { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--paper); border: 1px solid var(--rule); font-size: 19px; font-weight: 500; color: var(--acc); }
.fxrow.on .sym { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.fxrow .nm { flex: 1; min-width: 0; }
.fxrow .nm b { display: block; font-weight: 500; }
.fxrow .nm i { display: block; font-size: 12.5px; line-height: 16px; color: var(--soft); }
.fxrow input { width: 46%; max-width: 220px; min-width: 0; text-align: right; border: 1px solid transparent; border-radius: 12px; background: transparent; padding: 8px 10px; font-size: 22px; font-weight: 500; }
.fxrow input:focus { outline: none; border-color: var(--acc); background: var(--paper); }
.fxrow.on input { background: var(--wash); }
.fxrow .rm { width: 28px; height: 28px; flex: none; color: var(--faint); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chips button { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); font-size: 14px; }
.chips button.add { color: var(--acc); font-style: italic; }
.addsel { width: 100%; margin-top: 12px; }

/* учёт расходов */
.cats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.cats button { padding: 8px 13px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); font-size: 14px; }
.cats button.on { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.sprow { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.sprow .seg { flex: none; } .sprow .seg button { padding: 4px 12px; }
.sprow input[type=date] { flex: 1; min-width: 0; min-height: 36px; padding: 4px 10px; font-size: 14px; }
.fix { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 14px; padding: 14px 18px; border-radius: 999px; background: var(--acc); color: var(--on-acc); font-size: 17px; font-weight: 500; }
.fix i { font-weight: 400; font-size: 14px; opacity: .85; }
.fix:disabled { opacity: .45; }
.mhead { display: flex; align-items: center; gap: 8px; padding-top: 12px; }
.mhead .t { flex: 1; font-size: 19px; font-style: italic; color: var(--acc); }
.mhead .rbtn { width: 34px; height: 34px; margin: 0; background: var(--paper); } .mhead .rbtn svg { width: 18px; height: 18px; }
.spbig { font-size: 36px; line-height: 42px; font-weight: 500; margin-top: 6px; }
.spbig small { font-size: 20px; color: var(--soft); font-weight: 400; }
.speq { font-size: 14px; font-style: italic; color: var(--soft); }
.cmp { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13.5px; color: var(--soft); }
.cmp b { color: var(--ink); font-weight: 500; }
.cmp .up { color: var(--danger); } .cmp .down { color: var(--good); }
.catbar { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 7px 0; }
.catbar .cn { font-size: 15px; } .catbar .cv { font-size: 15px; font-weight: 500; text-align: right; }
.catbar .cb { grid-column: 1 / -1; height: 7px; border-radius: 4px; background: var(--paper); overflow: hidden; }
.catbar .cb i { display: block; height: 100%; border-radius: 4px; background: var(--acc); }
.catbar .cp { font-size: 12.5px; font-style: italic; color: var(--soft); font-weight: 400; margin-left: 6px; }
.dayh { font-size: 13.5px; font-style: italic; color: var(--soft); margin: 14px 0 2px; display: flex; justify-content: space-between; }
.sp { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 0; text-align: left; border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); }
.sp .ci { width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--wash); color: var(--acc); display: grid; place-items: center; font-size: 15px; font-weight: 500; }
.sp .m { flex: 1; min-width: 0; } .sp .m b { display: block; font-weight: 500; font-size: 15px; }
.sp .m i { display: block; font-size: 13px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp .v { text-align: right; flex: none; } .sp .v b { display: block; font-weight: 500; } .sp .v i { font-size: 12px; color: var(--soft); }

/* план бюджета */
.pfree { font-size: 38px; line-height: 44px; font-weight: 500; margin-top: 4px; }
.pfree small { font-size: 20px; color: var(--soft); font-weight: 400; }
.pfree.neg { color: var(--danger); }
.pline { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 15px; }
.pline span { color: var(--soft); font-style: italic; } .pline b { font-weight: 500; white-space: nowrap; text-align: right; }
.pline .of { font-size: 12.5px; font-weight: 400; }
.pline .up { color: var(--good); font-style: italic; } .pline .down { color: var(--danger); font-style: italic; }
.pline.sum { border-top: 1px solid var(--rule); margin-top: 4px; padding-top: 9px; }
.addrow { margin-top: 8px; color: var(--acc); font-style: italic; padding: 8px 2px; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 10px 0; }
.jump button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--page); font-size: 13.5px; color: var(--acc); }
.plist .pli { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 2px; text-align: left; border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); }
.plist .pli:last-child { border-bottom: 0; }
.pli .m { flex: 1; min-width: 0; } .pli .m b { display: block; font-weight: 500; font-size: 15.5px; }
.pli .m i { display: block; font-size: 12.5px; line-height: 16px; color: var(--soft); margin-top: 2px; }
.pli .v { text-align: right; flex: none; } .pli .v b { display: block; font-weight: 500; } .pli .v i { font-size: 12px; color: var(--soft); }
.pli.off { opacity: .5; }
.subtot { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; font-style: italic; color: var(--soft); margin: 14px 0 0; }
.subtot b { font-weight: 500; font-style: normal; color: var(--ink); white-space: nowrap; }
.prate { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 14px; font-style: italic; color: var(--soft); }
.prate span { flex: 1; } .prate .in { width: 90px; flex: none; text-align: right; min-height: 40px; padding: 6px 10px; font-size: 15px; font-style: normal; }
.mv { display: flex; flex-direction: column; flex: none; gap: 2px; }
.mv button { width: 26px; height: 20px; border-radius: 6px; border: 1px solid var(--rule); background: var(--paper); color: var(--acc); font-size: 12px; line-height: 1; }
.mv button:disabled { color: var(--rule); }
.goal .mv { margin-left: 8px; }
.gnum { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 8px; border-radius: 50%; background: var(--wash); color: var(--acc); font-size: 13px; vertical-align: 2px; }
.gorig { display: block; font-size: 12px; font-weight: 400; font-style: italic; color: var(--soft); text-align: right; }
.goal { padding: 10px 0 12px; border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); }
.goal:last-of-type { border-bottom: 0; }
.goal .eta { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 14px; }
.goal .eta b { font-weight: 500; color: var(--acc); } .goal .eta b.bad { color: var(--danger); } .goal .eta span { font-style: italic; color: var(--soft); text-align: right; }
.goal .dl { margin-top: 6px; font-size: 13.5px; line-height: 18px; font-style: italic; }
.goal .dl.ok { color: var(--good); } .goal .dl.no { color: var(--danger); }
.goal .gbar { height: 7px; border-radius: 4px; background: var(--paper); overflow: hidden; margin-top: 6px; }
.goal .gbar i { display: block; height: 100%; border-radius: 4px; background: var(--good); }
.toggle { display: flex; align-items: center; gap: 10px; padding: 12px 0 2px; font-size: 14.5px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--acc); flex: none; }
.prow { display: flex; align-items: baseline; gap: 10px; padding: 7px 2px; border-bottom: 1px solid color-mix(in srgb, var(--rule) 60%, transparent); font-size: 14.5px; }
.prow:last-child { border-bottom: 0; }
.prow .mn { flex: 1; } .prow .mu { font-size: 13px; font-style: italic; color: var(--soft); } .prow .mg { font-weight: 500; min-width: 100px; text-align: right; }
.prow .gx { font-size: 12px; font-style: italic; color: var(--acc); }
.prow .gl { font-size: 12px; font-style: italic; color: var(--good); }
.example { margin: 12px 10px 0; padding: 12px 16px; border-radius: 16px; background: var(--wash); font-size: 14px; line-height: 19px; font-style: italic; }
.seg.wrap { flex-wrap: wrap; } .seg.wrap button { flex: 1 1 40%; }
.dlg select.in { font-size: 15px; }
/* таблица как в Excel */
.ptable { overflow-x: auto; margin: 12px -16px 0; padding: 0 16px; -webkit-overflow-scrolling: touch; }
.ptable table { border-collapse: separate; border-spacing: 0; font-size: 13px; font-variant-numeric: tabular-nums lining-nums; }
.ptable th, .ptable td { padding: 6px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid color-mix(in srgb, var(--rule) 60%, transparent); }
.ptable th:first-child, .ptable td:first-child { position: sticky; left: 0; z-index: 1; background: var(--page); text-align: left; max-width: 132px; overflow: hidden; text-overflow: ellipsis; padding-left: 0; border-right: 1px solid var(--rule); }
.ptable thead th { font-weight: 400; font-style: italic; color: var(--soft); font-size: 12px; }
.ptable tr.sec td { font-style: italic; color: var(--acc); padding-top: 14px; border-bottom: 0; border-right: 0; }
.ptable tr.tot td { font-weight: 500; }
.ptable td.z { color: var(--faint); }
.ptable td.neg { color: var(--soft); }
/* здоровье бюджета */
.r503 { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--paper); margin: 10px 0 6px; }
.r503 i { display: block; height: 100%; }
.hrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 15px; }
.hrow .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.hrow .l { flex: 1; min-width: 0; } .hrow .l i { display: block; font-size: 12.5px; color: var(--soft); } .hrow b { font-weight: 500; }
.fbar { height: 8px; border-radius: 4px; background: var(--paper); overflow: hidden; margin: 2px 0 10px; }
.fbar i { display: block; height: 100%; border-radius: 4px; background: var(--acc); }
/* что если */
.whatrow { margin-top: 12px; }
.whatrow label { display: flex; justify-content: space-between; font-size: 15px; }
.whatrow label span { font-style: italic; color: var(--soft); }
.whatrow input[type=range] { width: 100%; accent-color: var(--acc); height: 32px; }
/* события */
.evt { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--rule) 60%, transparent); font-size: 14.5px; }
.evt:last-child { border-bottom: 0; }
.evt .when { width: 72px; flex: none; font-size: 13px; font-style: italic; color: var(--acc); padding-top: 1px; }
.evt .t { flex: 1; min-width: 0; }
.evt.egoal .t { color: var(--good); font-style: italic; }

.catbtn { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 14px; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--rule); background: var(--paper); text-align: left; }
.catbtn span:first-child { font-size: 14px; font-style: italic; color: var(--soft); }
.catbtn b { flex: 1; font-weight: 500; } .catbtn .arr { color: var(--acc); }
#catList { margin-top: 8px; }
.cats .catadd { color: var(--acc); font-style: italic; background: transparent; border-style: dashed; }
.catnew { display: flex; gap: 8px; width: 100%; }
.catnew[hidden] { display: none; }
.catnew .in { flex: 1; min-height: 40px; padding: 6px 12px; font-size: 15px; }
.fxset { margin: 4px 24px 12px; }
.fxset summary { cursor: pointer; font-size: 13.5px; font-style: italic; color: var(--soft); padding: 6px 0; }
.fxset .cats button:disabled { opacity: .6; }

/* настройки */
.themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.theme { border-radius: 16px; padding: 7px; text-align: left; border: 1px solid; min-width: 0; }
.theme.on { box-shadow: inset 0 0 0 1px var(--acc); }
.theme .mini { border-radius: 10px; padding: 8px; border: 1px solid; }
.theme .mini i { display: block; height: 5px; border-radius: 3px; margin-bottom: 5px; }
.theme .mini .pills { display: flex; gap: 4px; margin-top: 3px; }
.theme .mini b { flex: 1; height: 10px; border-radius: 5px; border: 1px solid transparent; }
.theme .nm { display: block; font-size: 12px; margin: 6px 0 0; font-style: italic; text-align: center; white-space: nowrap; overflow: hidden; }
.theme.on .nm { font-style: normal; font-weight: 500; }
.setrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.setrow .l { flex: 1; } .setrow .l i { display: block; font-size: 13px; color: var(--soft); }
.setrow input { width: 96px; text-align: right; }
.btn { display: block; width: 100%; margin: 8px 0; padding: 13px; border-radius: 999px; text-align: center; font-weight: 500; }
.btn.primary { background: var(--acc); color: var(--on-acc); }
.btn.outline { border: 1px solid var(--rule); color: var(--acc); background: var(--page); }
.btn.quiet { color: var(--danger); font-weight: 400; font-style: italic; }

/* поля */
.fld { display: block; margin-top: 14px; }
.fld > span { display: block; font-size: 14px; font-style: italic; color: var(--soft); margin-bottom: 6px; }
.in { width: 100%; min-height: 48px; border: 1px solid var(--rule); border-radius: 14px; background: var(--paper); padding: 10px 14px; font-size: 17px; }
.in.big { font-size: 26px; font-weight: 500; min-height: 60px; }
.in:focus { outline: none; border-color: var(--acc); }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* окно */
#modal { position: fixed; inset: 0; z-index: 50; background: rgba(59, 42, 37, .35); display: none; align-items: flex-end; justify-content: center; }
#modal.open { display: flex; }
.dlg { width: 100%; max-width: 520px; max-height: calc(100% - 24px - var(--safe-top)); overflow-y: auto; background: var(--page); border-radius: 26px 26px 0 0;
  padding: 18px 20px calc(18px + var(--safe-bottom)); animation: up .38s cubic-bezier(.16, 1, .3, 1) both; }
@media (min-width: 560px) { #modal { align-items: center; } .dlg { border-radius: 26px; } }
@keyframes up { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
.dlg .dh { display: flex; align-items: center; }
.dlg .dh b { flex: 1; font-size: 24px; font-weight: 500; }
.dlg .x { width: 44px; height: 44px; font-size: 18px; color: var(--soft); }
.preview { margin-top: 16px; padding: 14px 16px; border-radius: 16px; background: var(--wash); }
.preview .pv { font-size: 30px; line-height: 36px; font-weight: 500; }
.preview .ps { font-size: 13.5px; font-style: italic; color: var(--soft); margin-top: 2px; }
.preview .ps a { color: var(--acc); }
.confirm { margin-top: 6px; text-align: center; font-style: italic; }
.confirm .row { display: flex; gap: 8px; } .confirm .btn { flex: 1; }

#toast { position: fixed; left: 50%; bottom: calc(84px + var(--safe-bottom)); transform: translate(-50%, 20px); opacity: 0; z-index: 60; background: var(--ink); color: var(--page);
  padding: 10px 18px; border-radius: 999px; font-size: 14px; font-style: italic; transition: .3s ease; pointer-events: none; white-space: nowrap; }
#toast.in { opacity: 1; transform: translate(-50%, 0); }
#main.intro > * { animation: rise .5s cubic-bezier(.16, 1, .3, 1) both; animation-delay: var(--d, 0ms); }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #main.intro > *, .dlg { animation: none; } #toast, .limit .bar i { transition: none; } }
</style>
</head>
<body>
<div id="top"><div class="row">
  <h1>scrmoney</h1>
  <span class="sync" id="sync"></span>
</div></div>

<main id="main"></main>

<nav id="nav">
  <button data-tab="income"><span class="ic"><svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-1 10h-5v5h-2v-5H6v-2h5V6h2v5h5z"/></svg></span>Приходы</button>
  <button data-tab="spend"><span class="ic"><svg viewBox="0 0 24 24"><path d="M7 7h11.17l-2.58-2.59L17 3l5 5-5 5-1.41-1.41L18.17 9H7zm10 10H5.83l2.58 2.59L7 21l-5-5 5-5 1.41 1.41L5.83 15H17z"/></svg></span>Расходы</button>
  <button data-tab="plan"><span class="ic"><svg viewBox="0 0 24 24"><path d="M14.4 6 14 4H5v17h2v-7h5.6l.4 2h7V6z"/></svg></span>План</button>
  <button data-tab="year"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 11h4v9H4zM10 4h4v16h-4zM16 8h4v12h-4z"/></svg></span>Год</button>
  <button data-tab="settings"><span class="ic"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></span>Настройки</button>
</nav>

<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".csv,text/csv,text/plain" hidden>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $main = $('#main'), $modal = $('#modal');
const store = {
  get(k, d) { try { const v = localStorage.getItem('scrmoney.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('scrmoney.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- темы: те же мягкие палитры, что в scrmoods ---------- */
const THEMES = [
  { id: 'rosewood', name: 'Rosewood', paper: '#F3E1DC', page: '#FFF8F5', ink: '#3B2A25', soft: '#8A6B63', faint: '#C2A49B', rule: '#EBCFC6', acc: '#C0584A', wash: '#F9DCD3' },
  { id: 'peach', name: 'Peach', paper: '#FCE3CF', page: '#FFF8F1', ink: '#43291C', soft: '#93684F', faint: '#CFA588', rule: '#F3D0B5', acc: '#DB6E35', wash: '#FFE0CB' },
  { id: 'sepia', name: 'Sepia', paper: '#EADFCF', page: '#FBF6EE', ink: '#4F3933', soft: '#85695A', faint: '#BCA893', rule: '#E0D2BF', acc: '#945B46', wash: '#F0E0D0' },
  { id: 'matcha', name: 'Matcha', paper: '#E3EDD8', page: '#F9FCF4', ink: '#26331F', soft: '#5F7351', faint: '#A2B393', rule: '#CFDDBF', acc: '#5C8A3E', wash: '#DDEDCC' },
  { id: 'lavender', name: 'Lavender', paper: '#ECE3F4', page: '#FCF9FF', ink: '#33263F', soft: '#77648A', faint: '#B4A5C4', rule: '#DED0EC', acc: '#8A5BB8', wash: '#EBDCF7' },
  { id: 'berry', name: 'Berry', paper: '#F7DFE8', page: '#FFF7FA', ink: '#3D2030', soft: '#8F5F74', faint: '#C99AAD', rule: '#EFC9D7', acc: '#C24A7C', wash: '#FBD9E6' },
  { id: 'night', name: 'Night', paper: '#221A17', page: '#2E2420', ink: '#F1E4DC', soft: '#BCA79C', faint: '#7E6B62', rule: '#44362F', acc: '#E39A7E', wash: '#4A3129', onAcc: '#2A1C17', dark: true },
];
let theme = THEMES[0];
function applyTheme(id) {
  theme = THEMES.find(t => t.id === id) || THEMES[0];
  const r = document.documentElement.style;
  for (const k of ['paper', 'page', 'ink', 'soft', 'faint', 'rule', 'wash']) r.setProperty('--' + k, theme[k]);
  r.setProperty('--acc', theme.acc);
  r.setProperty('--on-acc', theme.onAcc || '#fff');
  document.documentElement.style.colorScheme = theme.dark ? 'dark' : 'light';
  document.querySelector('meta[name=theme-color]').setAttribute('content', theme.paper);
  store.set('theme', theme.id);
}
applyTheme(store.get('theme', 'rosewood'));

/* ---------- даты и числа ---------- */
const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const MONTHS_G = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS_P = ['январе', 'феврале', 'марте', 'апреле', 'мае', 'июне', 'июле', 'августе', 'сентябре', 'октябре', 'ноябре', 'декабре'];
const MONTHS_S = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const ymd = s => s.split('-').map(Number);
const longDate = s => { const [y, m, d] = ymd(s); return `${d} ${MONTHS_G[m - 1]} ${y}`; };
const wd = s => { const [y, m, d] = ymd(s); return WD[new Date(y, m - 1, d).getDay()]; };
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const money = (x, n = 2) => (isFinite(x) ? x : 0).toLocaleString('ru-RU', { minimumFractionDigits: n, maximumFractionDigits: n });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };

/* ---------- курс Национального банка Грузии ---------- */
const NBG = (d, c = 'USD') => `https://nbg.gov.ge/gw/api/ct/monetarypolicy/currencies/en/json/?currencies=${c}&date=${d}`;
const NBG_PAGE = 'https://nbg.gov.ge/en/monetary-policy/currency';   // официальная страница курсов, там можно выбрать дату
const INC_CUR = { USD: { s: '$', n: 'Доллары' }, EUR: { s: '€', n: 'Евро' } };
const rkey = (date, c = 'USD') => c === 'USD' ? date : c + '|' + date;   // доллары — по-старому, ключ = дата
/* Бережём сайт НБГ: курсы меняются раз в день, поэтому каждый адрес
   запрашивается не больше одного раза в сутки. Удачный ответ запоминается
   (прошлые даты — навсегда, сегодняшний курс — до конца дня). Если запрос
   не удался, следующая попытка — не раньше чем через час. */
const RETRY_MS = 60 * 60 * 1000;
let nbgLog = store.get('nbgLog', {});            // адрес -> { day, ok, t }
for (const k in nbgLog) if (nbgLog[k].day !== today()) delete nbgLog[k];
store.set('nbgLog', nbgLog);
async function nbgFetch(url) {
  const day = today(), e = nbgLog[url];
  if (e && e.day === day && (e.ok || Date.now() - e.t < RETRY_MS)) {
    const at = new Date(e.t + RETRY_MS);
    throw new Error(e.ok ? 'сегодня уже загружено' : `следующая попытка в ${String(at.getHours()).padStart(2, '0')}:${String(at.getMinutes()).padStart(2, '0')}`);
  }
  const mark = ok => { nbgLog[url] = { day, ok, t: Date.now() }; store.set('nbgLog', nbgLog); };
  let res;
  try { res = await fetch(url, { cache: 'no-store' }); } catch (err) { mark(false); throw new Error('нет связи с сайтом НБГ'); }
  if (!res.ok) { mark(false); throw new Error('сайт НБГ ответил ' + res.status); }
  try { const j = await res.json(); mark(true); return j; } catch (err) { mark(false); throw new Error('сайт НБГ прислал непонятный ответ'); }
}
let rates = store.get('rates', {});            // дата -> { rate, valid }
const pending = {};
function getRate(date, cur = 'USD') {
  const key = rkey(date, cur);
  if (rates[key]) return Promise.resolve(rates[key]);
  if (pending[key]) return pending[key];
  // курс на сегодня мог прийти вместе с остальными валютами
  if (date === today() && fx && fx.date === date && fx.r[cur]) {
    rates[key] = { rate: fx.r[cur], valid: fx.valid || date }; store.set('rates', rates);
    return Promise.resolve(rates[key]);
  }
  return pending[key] = nbgFetch(NBG(date, cur))
    .then(j => {
      const c = j && j[0] && (j[0].currencies || []).find(x => x.code === cur);
      if (!c) throw new Error('на эту дату курса нет');
      const v = { rate: c.rate / (c.quantity || 1), valid: (c.validFromDate || j[0].date || '').slice(0, 10) };
      if (date <= today()) { rates[key] = v; store.set('rates', rates); }
      return v;
    })
    .finally(() => { delete pending[key]; });
}

/* ---------- данные ---------- */
let rows = store.get('rows', []);
let nextId = rows.reduce((m, r) => Math.max(m, r.id), 0) + 1;
let failed = {};                                  // дата -> текст ошибки
const save = () => store.set('rows', rows);
const curOf = r => r.cur || 'USD';
const symOf = r => INC_CUR[curOf(r)].s;
const rateOf = r => r.manual ? r.rate : (rates[rkey(r.date, curOf(r))] ? rates[rkey(r.date, curOf(r))].rate : null);
// суммы по валютам: «2 320,00 $ · 500,00 €»
const byCur = list => { const t = {}; for (const r of list) t[curOf(r)] = (t[curOf(r)] || 0) + r.usd; return Object.keys(INC_CUR).filter(c => t[c]).map(c => `${money(t[c])} ${INC_CUR[c].s}`).join(' · '); };
const gelOf = r => { const k = rateOf(r); return k ? r2(r.usd * k) : null; };
let taxRate = store.get('tax', 1);
const LIMIT = 500000;

/* ---------- все курсы НБГ на дату (для конвертера) ---------- */
const CUR = {
  GEL: { s: '₾', n: 'Грузинский лари' }, USD: { s: '$', n: 'Доллар США' }, EUR: { s: '€', n: 'Евро' }, RUB: { s: '₽', n: 'Российский рубль' },
  TRY: { s: '₺', n: 'Турецкая лира' }, AMD: { s: '֏', n: 'Армянский драм' }, AZN: { s: '₼', n: 'Азербайджанский манат' }, GBP: { s: '£', n: 'Фунт стерлингов' },
  KZT: { s: '₸', n: 'Казахстанский тенге' }, UAH: { s: '₴', n: 'Гривна' }, AED: { s: 'د.إ', n: 'Дирхам ОАЭ' }, CNY: { s: '¥', n: 'Юань' },
  THB: { s: '฿', n: 'Тайский бат' }, PLN: { s: 'zł', n: 'Польский злотый' }, CHF: { s: '₣', n: 'Швейцарский франк' }, ILS: { s: '₪', n: 'Шекель' }
};
let fx = store.get('fx', null);                 // { date, valid, r: { USD: ₾ за 1, ... } }
let fxErr = null;
async function loadFx(want) {
  if (fx && fx.date === now && want.every(c => c === 'GEL' || fx.r[c])) return;
  const r = fx && fx.date === now ? { ...fx.r } : {};
  let valid = fx && fx.date === now ? fx.valid : '';
  const take = j => { for (const c of (j && j[0] && j[0].currencies) || []) { r[c.code] = c.rate / (c.quantity || 1); valid = valid || (c.validFromDate || j[0].date || '').slice(0, 10); } };
  const base = `https://nbg.gov.ge/gw/api/ct/monetarypolicy/currencies/en/json/?date=${now}`;
  if (rates[now] && !r.USD) { r.USD = rates[now].rate; valid = valid || rates[now].valid; }
  try {
    if (want.some(c => c !== 'GEL' && !r[c])) { try { take(await nbgFetch(base)); } catch (e) {} }
    for (const c of want) if (c !== 'GEL' && !r[c]) take(await nbgFetch(base + '&currencies=' + c));
    const miss = want.filter(c => c !== 'GEL' && !r[c]);
    fx = { date: now, valid, r }; store.set('fx', fx);
    fxErr = miss.length ? 'нет курса для ' + miss.join(', ') : null;
  } catch (e) { fxErr = e.message; }
}
let fxList = store.get('fxList', ['GEL', 'USD', 'RUB', 'EUR']);

/* ---------- личные расходы: история ---------- */
const CATS = [
  { id: 'food', n: 'Продукты', s: 'П' }, { id: 'cafe', n: 'Кафе', s: 'К' }, { id: 'transport', n: 'Транспорт', s: 'Т' },
  { id: 'home', n: 'Дом', s: 'Д' }, { id: 'shop', n: 'Покупки', s: 'П' }, { id: 'health', n: 'Здоровье', s: 'З' },
  { id: 'fun', n: 'Досуг', s: 'Д' }, { id: 'other', n: 'Другое', s: '·' }
];
// свои категории — перед «Другое»
let userCats = store.get('spCatsUser', []);
CATS.splice(CATS.length - 1, 0, ...userCats);
let spCatsOpen = false, fxSetOpen = false;
const catOf = id => CATS.find(c => c.id === id) || CATS[CATS.length - 1];
let spends = store.get('spend', []);            // { id, date, ts, amt, cur, k (₾ за 1), gel, cat, note }
const saveSpends = () => store.set('spend', spends);
const newId = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let spCat = store.get('spCat', 'food'), spNote = '', spDate = null;
let spY = ymd(today())[0], spM = ymd(today())[1];
let fxBase = store.get('fxBase', { c: 'USD', v: 100 });
const fxRate = c => c === 'GEL' ? 1 : (fx && fx.r[c]) || null;      // лари за 1 единицу
const fxFmt = (x, c) => { const n = Math.abs(x) >= 1000 || ['RUB', 'AMD', 'KZT'].includes(c) && Math.abs(x) >= 100 ? 0 : 2; return x.toLocaleString('ru-RU', { minimumFractionDigits: n, maximumFractionDigits: n }); };
const fxNum = s => parseFloat(String(s).replace(/\s/g, '').replace(',', '.'));

async function loadMissing() {
  const need = {};
  for (const r of rows) if (!r.manual && !rates[rkey(r.date, curOf(r))]) need[rkey(r.date, curOf(r))] = [r.date, curOf(r)];
  if (!Object.keys(need).length) return;
  $('#sync').textContent = 'обновляю курсы…';
  for (const [k, [d, c]] of Object.entries(need)) {
    try { await getRate(d, c); delete failed[k]; } catch (e) { failed[k] = e.message; }
  }
  $('#sync').textContent = '';
  render();
}

/* ---------- экраны ---------- */
let tab = 'income';
const now = today();
let viewY = ymd(now)[0], viewM = ymd(now)[1];
let yearY = viewY;
let todayRate = null, todayErr = null;

const arrow = d => `<svg viewBox="0 0 24 24"><path d="${d ? 'M9 6l6 6-6 6' : 'M15 6l-6 6 6 6'}"/></svg>`;

function renderIncome() {
  const key = `${viewY}-${String(viewM).padStart(2, '0')}`;
  const list = rows.filter(r => r.date.startsWith(key)).sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  const gel = list.reduce((s, r) => s + (gelOf(r) || 0), 0);
  const missing = list.some(r => gelOf(r) == null);
  const isNow = key === now.slice(0, 7);

  const check = `<a class="chk" href="${NBG_PAGE}" target="_blank" rel="noopener">проверить на nbg.gov.ge ↗</a>`;
  const kU = fx && fx.date === now ? fx.r.USD : null, kE = fx && fx.date === now ? fx.r.EUR : null;
  let rateHtml;
  if (kU) rateHtml = `<div class="rvs"><div class="rv num">${kU.toFixed(4).replace('.', ',')} <small>₾ за $</small></div>${kE ? `<div class="rv num">${kE.toFixed(4).replace('.', ',')} <small>₾ за €</small></div>` : ''}</div>

/* ---------- план бюджета ---------- */
/* Как в таблице бюджета: каждая статья дохода или расхода — строка с суммой,
   периодичностью и сроком действия. Дальше месяц за месяцем считаем, сколько
   остаётся и когда закроются цели.
   f: 'm' каждый месяц, 'q' раз в квартал, 'y' раз в год, 'once' один раз
   from / to: 'ГГГГ-ММ' (пусто — уже идёт / без конца), g: рост в год, %
   доходы: tx — облагается налогом; расходы: grp — 'need' обязательный или 'want' желание
   цели: by — к какому месяцу хочется накопить */
const MONTHS_SH = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const PCUR = ['GEL', 'USD', 'EUR', 'RUB'];
const FREQ = { m: 'каждый месяц', q: 'раз в квартал', y: 'раз в год', once: 'один раз' };
const planMonth = i => { const [y0, m0] = ymd(now), t = m0 - 1 + i; return { y: y0 + Math.floor(t / 12), m: ((t % 12) + 12) % 12 }; };
const planOff = ym => { if (!ym) return null; const [y, m] = ym.split('-').map(Number), [y0, m0] = ymd(now); return (y - y0) * 12 + (m - m0); };
const ymOf = i => { const { y, m } = planMonth(i); return `${y}-${String(m + 1).padStart(2, '0')}`; };
const ymShort = ym => { const { y, m } = planMonth(planOff(ym)); return `${MONTHS_SH[m]} ${y}`; };
const ymLong = ym => { const { y, m } = planMonth(planOff(ym)); return `${MONTHS[m]} ${y}`; };
const toGel = (a, c) => c === 'GEL' ? a : fxRate(c) ? a * fxRate(c) : null;
const amtTxt = (a, c) => `${money(+a || 0, Number.isInteger(+a || 0) ? 0 : 2)} ${CUR[c].s}`;

const PLAN_EXAMPLE = () => ({
  v: 2, example: true, horizon: 24, view: 'GEL', rate: 0, mode: 'chart',
  inc: [
    { id: 'i1', n: 'Зарплата', a: 2500, c: 'USD', f: 'm', from: '', to: '', g: 0, tx: true },
    { id: 'i2', n: 'Подработка', a: 400, c: 'USD', f: 'm', from: ymOf(1), to: ymOf(6), g: 0, tx: true },
    { id: 'i3', n: 'Годовой бонус', a: 3000, c: 'USD', f: 'once', from: ymOf(5), to: '', g: 0, tx: true }],
  exp: [
    { id: 'e1', n: 'Аренда квартиры', a: 1500, c: 'GEL', f: 'm', from: '', to: '', g: 5, grp: 'need' },
    { id: 'e2', n: 'Продукты', a: 600, c: 'GEL', f: 'm', from: '', to: '', g: 0, grp: 'need' },
    { id: 'e3', n: 'Транспорт', a: 80, c: 'GEL', f: 'm', from: '', to: '', g: 0, grp: 'need' },
    { id: 'e4', n: 'Связь и интернет', a: 50, c: 'GEL', f: 'm', from: '', to: '', g: 0, grp: 'need' },
    { id: 'e5', n: 'Страховка', a: 600, c: 'GEL', f: 'y', from: ymOf(3), to: '', g: 0, grp: 'need' },
    { id: 'e6', n: 'Кафе и развлечения', a: 400, c: 'GEL', f: 'm', from: '', to: '', g: 0, grp: 'want' }],
  savings: [{ id: 's1', n: 'Накопления', a: 2000, c: 'USD' }],
  goals: [{ id: 'g1', n: 'Подушка безопасности', a: 5000, c: 'USD', by: '' },
          { id: 'g2', n: 'Первый взнос за машину', a: 6000, c: 'USD', by: ymOf(14) }]
});
// прежние версии плана → новая модель (ничего не теряем)
function planMigrate(p) {
  if (!p || p.example) return PLAN_EXAMPLE();
  if (p.v === 2) return p;
  const base = x => ({ id: x.id || newId(), n: x.n || '', a: x.a === '' ? '' : +x.a || 0, c: x.c || 'GEL', f: 'm', from: '', to: '', g: 0 });
  const inc = (p.inc || []).map(x => {
    const o = { ...base(x), tx: p.tax !== false };
    if (x.t === 'once') { o.f = 'once'; o.from = x.from || ymOf(0); }
    else if (x.t === 'lim') { o.from = x.from || ymOf(0); o.to = ymOf(planOff(o.from) + Math.max(1, +x.cnt || 1) - 1); }
    return o;
  });
  const savings = p.savings || (p.saved ? [{ id: 's1', n: 'Накопления', a: p.saved.a, c: p.saved.c }] : []);
  return { v: 2, example: false, horizon: p.horizon || 12, view: p.view || 'GEL', rate: 0, mode: 'chart', inc,
    exp: (p.exp || []).map(x => ({ ...base(x), grp: 'need' })), savings, goals: (p.goals || []).map(g => ({ ...g, by: g.by || '' })) };
}
let plan = planMigrate(store.get('plan', null));
store.set('plan', plan);
const savePlan = () => { plan.example = false; store.set('plan', plan); };
let planWhat = { inc: 0, exp: 0 };

// сумма статьи в лари в месяце i (0 — этот месяц)
function itemAt(x, i) {
  const a = +x.a || 0; if (!a) return 0;
  const s = planOff(x.from) ?? 0, e = x.f === 'once' ? s : (planOff(x.to) ?? Infinity);
  if (i < s || i > e) return 0;
  if (x.f === 'q' && (i - s) % 3) return 0;
  if (x.f === 'y' && (i - s) % 12) return 0;
  const k = toGel(a, x.c); if (k == null) return 0;
  return k * Math.pow(1 + (+x.g || 0) / 100, Math.floor(i / 12));
}
// месяц за месяцем на 50 лет вперёд: доходы, налог, расходы, проценты, остаток
function planSim(opt = {}) {
  const ik = 1 + (opt.inc || 0) / 100, ek = 1 + (opt.exp || 0) / 100;
  const taxK = taxRate / 100, r = (+plan.rate || 0) / 1200;
  const saved = plan.savings.reduce((t, x) => t + (toGel(+x.a || 0, x.c) || 0), 0);
  const goals = []; let cum = 0;
  for (const g of plan.goals) {
    const t = toGel(+g.a || 0, g.c) || 0, before = cum; cum += t;
    goals.push({ g, t, cum, have: Math.max(0, Math.min(t, saved - before)), at: t > 0 && saved >= cum ? -1 : null, by: planOff(g.by), balBy: null });
  }
  const months = []; let bal = saved;
  for (let i = 0; i < 600; i++) {
    let inc = 0, tax = 0, need = 0, want = 0;
    for (const x of plan.inc) { const v = itemAt(x, i) * ik; inc += v; if (x.tx !== false) tax += v * taxK; }
    for (const x of plan.exp) { const v = itemAt(x, i) * ek; if (x.grp === 'want') want += v; else need += v; }
    const free = inc - tax - need - want, interest = bal > 0 ? bal * r : 0;
    bal += interest + free;
    if (i < Math.max(plan.horizon, 12)) months.push({ i, ...planMonth(i), inc, tax, need, want, free, interest, bal });
    for (const t of goals) {
      if (t.at === null && t.t > 0 && bal >= t.cum - 0.005) t.at = { k: i, ...planMonth(i) };
      if (t.by === i) t.balBy = bal;
    }
  }
  const y12 = months.slice(0, 12), avg = f => y12.reduce((t, m) => t + m[f], 0) / 12;
  return { saved, months, goals, avg: { inc: avg('inc'), tax: avg('tax'), need: avg('need'), want: avg('want'), free: avg('free') }, year: y12.reduce((t, m) => t + m.free + m.interest, 0) };
}
// подпись статьи: «каждый месяц · с ноя 2026 по апр 2027 · +5% в год»
function schedText(x, kind) {
  if (kind === 'goals') return x.by ? `хочу к ${ymShort(x.by)}` : 'без срока';
  if (kind === 'savings') return 'уже есть';
  const parts = [FREQ[x.f || 'm']];
  if (x.f === 'once') parts[0] = `один раз, ${ymShort(x.from || ymOf(0))}`;
  else {
    const s = planOff(x.from), e = planOff(x.to);
    if (s != null && s > 0 && e != null) parts.push(`${ymShort(x.from)} — ${ymShort(x.to)}`);
    else if (s != null && s > 0) parts.push(`с ${ymShort(x.from)}`);
    else if (e != null) parts.push(e < 0 ? `закончился в ${ymShort(x.to)}` : `до ${ymShort(x.to)}`);
    if (+x.g) parts.push(`${+x.g > 0 ? '+' : ''}${String(+x.g).replace('.', ',')}% в год`);
  }
  if (kind === 'inc' && x.tx === false) parts.push('без налога');
  return parts.join(' · ');
}
const itemEnded = x => x.f === 'once' ? (planOff(x.from) ?? 0) < 0 : planOff(x.to) != null && planOff(x.to) < 0;
// сколько раз и на какую сумму статья сработает за свой срок (для конечных сроков)
function itemTotal(x) {
  const s = planOff(x.from) ?? 0, e = x.f === 'once' ? s : planOff(x.to);
  if (e == null) return null;
  let n = 0, sum = 0;
  for (let i = Math.max(s, 0); i <= e; i++) { const v = itemAt(x, i); if (v) { n++; sum += v; } }
  return { n, sum };
}
function monthOptions(sel, empty) {
  let html = empty ? `<option value="" ${!sel ? 'selected' : ''}>${empty}</option>` : '';
  const o = planOff(sel), lo = Math.min(-24, o ?? 0), hi = Math.max(120, o ?? 0);
  for (let i = lo; i <= hi; i++) { const v = ymOf(i); html += `<option value="${v}" ${v === sel ? 'selected' : ''}>${ymLong(v)}${i === 0 ? ' (этот месяц)' : ''}</option>`; }
  return html;
}
// валюта показа
function planView() {
  const V = plan.view && (plan.view === 'GEL' || fxRate(plan.view)) ? plan.view : 'GEL', kV = V === 'GEL' ? 1 : fxRate(V);
  const num = (g, d = 0) => money(g / kV, d);
  return { V, kV, num, pv: g => `${num(g)} ${CUR[V].s}` };
}

function listRows(kind, filter) {
  const { V, pv } = planView();
  const list = plan[kind].filter(filter || (() => true));
  if (!list.length) return '';
  return `<div class="plist">${list.map(x => {
    const gel = toGel(+x.a || 0, x.c);
    return `<button class="pli ${kind !== 'goals' && kind !== 'savings' && itemEnded(x) ? 'off' : ''}" data-act="plopen" data-kind="${kind}" data-id="${x.id}">
      <span class="m"><b>${esc(x.n || 'Без названия')}</b><i>${schedText(x, kind)}</i></span>
      <span class="v"><b class="num">${amtTxt(x.a, x.c)}</b>${x.c !== V && gel != null ? `<i class="num">≈ ${pv(gel)}</i>` : ''}</span></button>`;
  }).join('')}</div>`;
}

function renderPlan() {

    <div class="jump" style="--d:30ms">${[['plTable', 'Таблица'], ['plInc', 'Доходы'], ['plExp', 'Расходы'], ['plSav', 'Накопления'], ['plGoals', 'Цели']].map(([id, l]) => `<button data-act="pljump" data-to="${id}">${l}</button>`).join('')}</div>

      <div class="subtot"><span>Желания</span><b class="num">≈ ${pv(sim.avg.want)} в месяц</b></div>
      ${listRows('exp', x => x.grp === 'want') || '<p class="hint" style="margin:4px 2px">Кафе, развлечения, путешествия, подписки.</p>'}
      <button class="addrow" data-act="pladd" data-kind="exp">+ добавить расход</button>
      ${lastSpend ? `<p class="hint" style="margin:0 2px">По учёту расходов в ${MONTHS_P[pm[1] - 1]} вы потратили <b class="num">${money(lastSpend)} ₾</b>. <button class="chk" data-act="plspend" data-v="${lastSpend}" style="font-style:italic">Добавить статьёй</button></p>` : ''}</div>
    <div class="card" id="plSav" style="--d:240ms"><h2 class="hl">Накопления</h2>
      ${listRows('savings') || '<p class="hint" style="margin:4px 2px">Сколько уже отложено — в любой валюте.</p>'}
      <button class="addrow" data-act="pladd" data-kind="savings">+ добавить накопления</button>
      <label class="prate"><span>Процент по вкладу, % годовых</span><input class="in num" id="plRate" inputmode="decimal" value="${plan.rate ? String(plan.rate).replace('.', ',') : ''}" placeholder="0"></label></div>
    <div class="card" id="plGoals" style="--d:260ms"><h2 class="hl">Цели</h2>
      ${listRows('goals') || '<p class="hint" style="margin:4px 2px">Машина, квартира, подушка безопасности, отпуск.</p>'}
      <button class="addrow" data-act="pladd" data-kind="goals">+ добавить цель</button>
      <p class="hint" style="margin:0 2px">Цели копятся по очереди, сверху вниз. Порядок меняется стрелками ↑ ↓ в блоке «Когда дойдёте до цели».</p></div>
    <p class="hint" style="margin:12px 24px">Доллары, евро и рубли пересчитаны по сегодняшнему курсу НБГ. Это прикидка: реальные суммы и курс будут немного плавать.</p>`;
  $('#plRate').oninput = e => { const v = fxNum(e.target.value); plan.rate = v >= 0 ? v : 0; savePlan(); planOut(); };
  planOut();
}

function goalStatus(t, pv) {
  if (!t.t) return { when: '<b>впишите сумму</b>', dl: '' };
  const when = t.at === -1 ? '<b>уже накоплено</b>'
    : t.at ? `<b>${MONTHS[t.at.m]} ${t.at.y}</b><span>${t.at.k === 0 ? 'в этом месяце' : 'через ' + (t.at.k + 1) + ' ' + plural(t.at.k + 1, 'месяц', 'месяца', 'месяцев')}</span>`
    : '<b class="bad">не накопится</b><span>свободных денег не хватает</span>';
  let dl = '';
  if (t.by != null) {
    if (t.at === -1 || (t.at && t.at.k <= t.by)) dl = `<div class="dl ok">✓ успеваете к ${ymShort(t.g.by)}</div>`;
    else if (t.by < 0) dl = `<div class="dl no">срок ${ymShort(t.g.by)} уже прошёл</div>`;
    else {
      const short = t.cum - (t.balBy ?? 0), per = short / (t.by + 1);
      dl = `<div class="dl no">к ${ymShort(t.g.by)} не хватит ${pv(short)} — нужно откладывать ещё ${pv(per)} в месяц</div>`;
    }
  }
  return { when, dl };
}

function planOut() {
  const box = $('#planOut'); if (!box) return;
  const sim = planSim(), { V, num, pv } = planView();
  const m0 = sim.months[0], neg = m0.free < 0;
  const noRate = [...plan.inc, ...plan.exp, ...plan.goals, ...plan.savings].some(x => x.c !== 'GEL' && !fxRate(x.c));
  const H = plan.horizon, months = sim.months.slice(0, H);
  const second = g => V === 'GEL' ? (fxRate('USD') ? `≈ ${money(g / fxRate('USD'), 0)} $` : '') : `≈ ${money(g, 0)} ₾`;

  // --- когда дойдёте до цели
  const gHtml = sim.goals.map((t, i, all) => {
    const pct = t.t ? Math.min(100, t.have / t.t * 100) : 0, st = goalStatus(t, pv);
    return `<div class="goal"><div class="pline" style="padding:0;align-items:center">
      <b style="font-size:16px;flex:1;min-width:0;white-space:normal;line-height:21px;text-align:left"><span class="gnum">${i + 1}</span>${esc(t.g.n || 'Цель')}</b>
      <b class="num">${pv(t.t)}${t.g.c !== V && t.g.c !== 'GEL' ? `<span class="gorig">${amtTxt(t.g.a, t.g.c)}</span>` : ''}</b>
      ${all.length > 1 ? `<span class="mv" data-id="${t.g.id}"><button data-act="plup" ${i === 0 ? 'disabled' : ''} aria-label="Выше">↑</button><button data-act="pldown" ${i === all.length - 1 ? 'disabled' : ''} aria-label="Ниже">↓</button></span>` : ''}</div>
      <div class="gbar"><i style="width:${pct}%"></i></div>

  }).join('');

  // --- график накоплений
  const W = 340, CH = 150, top = 16, bot = 18, n = months.length;
  const goalMax = sim.goals.length ? sim.goals[sim.goals.length - 1].cum : 0;
  const mx = Math.max(...months.map(m => m.bal), goalMax, 1), mn = Math.min(0, ...months.map(m => m.bal));
  const y = v => top + (CH - top - bot) * (mx - v) / (mx - mn || 1), bw = (W - 6) / n;
  const bars = months.map((m, i) => { const y1 = y(Math.max(m.bal, 0)), y2 = y(Math.min(m.bal, 0));
    return `<rect x="${3 + i * bw + bw * 0.15}" y="${y1}" width="${Math.max(bw * 0.7, 1.2)}" height="${Math.max(y2 - y1, 1)}" rx="${n > 24 ? 1 : 3}" fill="${m.bal < 0 ? 'var(--danger)' : 'color-mix(in srgb, var(--acc) 55%, var(--page))'}"/>`; }).join('');
  const glines = sim.goals.filter(g => g.t > 0 && g.cum <= mx).map(g => `<line x1="0" x2="${W}" y1="${y(g.cum)}" y2="${y(g.cum)}" stroke="var(--good)" stroke-dasharray="4 4"/>

  const step = n <= 12 ? 1 : n <= 24 ? 3 : n <= 60 ? 12 : 24;
  const labels = months.map((m, i) => i % step === 0 ? `<text x="${i === 0 && n > 24 ? 2 : 3 + i * bw + bw / 2}" y="${CH - 4}" text-anchor="${i === 0 && n > 24 ? 'start' : 'middle'}" font-size="10" font-style="italic" fill="var(--soft)">${n > 24 ? m.y : MONTHS_SH[m.m]}</text>` : '').join('');
  const reached = {}; sim.goals.forEach(g => { if (g.at && g.at !== -1) (reached[g.at.k] = reached[g.at.k] || []).push(g.g.n || 'цель'); });
  const events = planEvents(sim, pv);
  const evBy = {}; events.forEach(e => { if (e.cls !== 'egoal') (evBy[e.i] = evBy[e.i] || []).push(e.short); });
  const rowsList = n <= 24
    ? months.map((m, i) => ({ l: `${MONTHS[m.m]}${m.y !== ymd(now)[0] ? ' ' + m.y : ''}`, add: m.free + m.interest, bal: m.bal, gl: reached[i], ex: evBy[i] }))
    : months.filter((m, i) => m.m === 11 || i === n - 1).map(m => ({ l: `к концу ${m.m === 11 ? m.y + ' года' : MONTHS_G[m.m] + ' ' + m.y}`, add: null, bal: m.bal }));

  // --- здоровье бюджета: правило 50/30/20 и подушка
  const net = sim.avg.inc - sim.avg.tax;
  const sh = v => net > 0 ? v / net * 100 : 0;
  const pN = sh(sim.avg.need), pW = sh(sim.avg.want), pS = sh(sim.avg.free);

    <div class="hrow">${dot(pS >= 20 ? 2 : pS >= 10 ? 1 : 0)}<span class="l">Откладываете <i>норма от 20%</i></span><b class="num">${money(pS, 0)}%</b></div>
    ${cushion != null ? `<div class="hrow">${dot(cushion >= 6 ? 2 : cushion >= 3 ? 1 : 0)}<span class="l">Подушка безопасности <i>советуют 3–6 месяцев</i></span><b class="num">${money(cushion, 1)} мес.</b></div>` : ''}
    <p class="hint" style="margin:6px 0 0">Правило 50/30/20: половина дохода после налога — на обязательное, до трети — на желания, от пятой части — в накопления. Подушка — на сколько месяцев обязательных расходов хватит накоплений. Средние за ближайшие 12 месяцев.</p>`
    : '<p class="hint">Добавьте доходы, чтобы увидеть доли.</p>';

  // --- план и факт за этот месяц
  const key = now.slice(0, 7);
  const factInc = rows.filter(r => r.date.startsWith(key)).reduce((t, r) => t + (gelOf(r) || 0), 0);
  const factExp = spends.filter(x => x.date.startsWith(key)).reduce((t, x) => t + x.gel, 0);
  const planExp = m0.need + m0.want;
  const fbar = (f, p) => `<div class="fbar"><i style="width:${p > 0 ? Math.min(100, f / p * 100) : 0}%;${f > p ? 'background:var(--danger)' : ''}"></i></div>`;
  const fact = factInc || factExp ? `<div class="card" style="--d:150ms"><h2 class="hl">${MONTHS[ymd(now)[1] - 1]}: план и факт</h2>
      <div class="pline"><span>доходы — пришло</span><b class="num">${pv(factInc)} <span class="of">из ${pv(m0.inc)}</span></b></div>${fbar(factInc, m0.inc)}
      <div class="pline"><span>расходы — записано</span><b class="num">${pv(factExp)} <span class="of">из ${pv(planExp)}</span></b></div>${fbar(factExp, planExp)}
      <p class="hint" style="margin:2px 0 0">Факт — из вкладок «Приходы» и «Расходы». Если аренду и другие крупные платежи вы туда не записываете, факт расходов будет меньше плана.</p></div>` : '';

  box.innerHTML = `
    <div class="card" style="--d:40ms">
      <div class="seg small" style="margin-top:14px">${['GEL', 'USD', 'EUR'].map(k => `<button data-act="plview" data-c="${k}" class="${V === k ? 'on' : ''}" ${k !== 'GEL' && !fxRate(k) ? 'disabled' : ''}>${CUR[k].s} ${k === 'GEL' ? 'Лари' : k === 'USD' ? 'Доллары' : 'Евро'}</button>`).join('')}</div>
      <div class="yearbig" style="padding-bottom:0"><div class="k">${neg ? 'Не хватает в этом месяце' : 'Свободно в этом месяце'}</div>
        <div class="pfree num ${neg ? 'neg' : ''}">${num(Math.abs(m0.free))} <small>${CUR[V].s}</small></div>
        <div class="speq num">${second(Math.abs(m0.free))}${!neg && m0.inc ? ` · ${money(m0.free / m0.inc * 100, 0)}% дохода` : ''}</div></div>
      <div style="margin-top:12px">
        <div class="pline"><span>доходы</span><b class="num">${pv(m0.inc)}</b></div>
        ${m0.tax ? `<div class="pline"><span>налог ${String(taxRate).replace('.', ',')}%</span><b class="num">− ${pv(m0.tax)}</b></div>` : ''}
        <div class="pline"><span>обязательные расходы</span><b class="num">− ${pv(m0.need)}</b></div>
        ${m0.want ? `<div class="pline"><span>желания</span><b class="num">− ${pv(m0.want)}</b></div>` : ''}
        <div class="pline sum"><span>в среднем свободно в месяц за год</span><b class="num">${pv(sim.avg.free)}</b></div>
        <div class="pline"><span>за ближайшие 12 месяцев отложите${plan.rate ? ' (с процентами)' : ''}</span><b class="num">${pv(sim.year)}</b></div>
      </div>
      ${noRate ? `<p class="hint" style="color:var(--danger)">Курс НБГ ещё не загрузился — суммы в валюте пока не учтены.</p>` : ''}
    </div>
    ${sim.goals.length ? `<div class="card" style="--d:60ms"><h2 class="hl">Когда дойдёте до цели</h2>${gHtml}</div>` : ''}
    <div class="card" id="plTable" style="--d:80ms"><h2 class="hl">Прогноз</h2>
      <div class="seg small" style="margin-top:6px">${[[12, '1 год'], [24, '2 года'], [60, '5 лет'], [120, '10 лет']].map(([h, l]) => `<button data-act="plh" data-h="${h}" class="${H === h ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div class="seg small" style="margin-top:6px">${[['chart', 'График'], ['table', 'Таблица']].map(([k, l]) => `<button data-act="plmode" data-m="${k}" class="${(plan.mode || 'chart') === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${(plan.mode || 'chart') === 'table' ? planTable(sim, num) : `
      <svg viewBox="0 0 ${W} ${CH}" style="width:100%;height:auto;display:block;margin-top:12px" role="img" aria-label="Накопления по месяцам">
        <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--rule)"/>${bars}${glines}${labels}</svg>
      <div style="margin-top:8px">${rowsList.map(r => `<div class="prow"><span class="mn">${r.l}${r.ex ? `<br><span class="gx">${esc(r.ex.join(', '))}</span>` : ''}${r.gl ? `<br><span class="gl">✓ цель: ${esc(r.gl.join(', '))}</span>` : ''}</span>
        ${r.add != null ? `<span class="mu num">${r.add >= 0 ? '+' : '−'}${num(Math.abs(r.add))}</span>` : ''}<span class="mg num" style="${r.bal < 0 ? 'color:var(--danger)' : ''}">${pv(r.bal)}</span></div>`).join('')}</div>`}
      <button class="btn outline" data-act="plcsv" style="margin-top:12px">Скачать таблицу для Excel (CSV)</button>
    </div>
    ${fact}
    <div class="card" style="--d:100ms"><h2 class="hl">Здоровье бюджета</h2>${health}</div>
    <div class="card" style="--d:120ms"><h2 class="hl">Что если</h2>
      <div class="whatrow"><label for="wInc"><span>Доходы</span><b class="num" id="wIncV"></b></label><input type="range" id="wInc" min="-50" max="50" step="5" value="${planWhat.inc}"></div>
      <div class="whatrow"><label for="wExp"><span>Расходы</span><b class="num" id="wExpV"></b></label><input type="range" id="wExp" min="-50" max="50" step="5" value="${planWhat.exp}"></div>
      <div id="whatRes"></div>
      <button class="addrow" data-act="plwhat0">сбросить</button>
    </div>
    ${events.length ? `<div class="card" style="--d:140ms"><h2 class="hl">Ближайшие события</h2>${events.map(e => `<div class="evt ${e.cls}"><span class="when">${MONTHS_SH[planMonth(e.i).m]} ${planMonth(e.i).y}</span><span class="t">${e.txt}</span></div>`).join('')}</div>` : ''}`;
  $('#wInc').oninput = e => { planWhat.inc = +e.target.value; whatIf(); };
  $('#wExp').oninput = e => { planWhat.exp = +e.target.value; whatIf(); };
  whatIf();
}

// «что если» — пересчёт без сохранения
function whatIf() {
  const box = $('#whatRes'); if (!box) return;
  const sign = v => v > 0 ? `+${v}%` : v < 0 ? `−${-v}%` : 'как в плане';
  $('#wIncV').textContent = sign(planWhat.inc); $('#wExpV').textContent = sign(planWhat.exp);
  const { pv } = planView(), a = planSim(), b = planSim(planWhat);
  if (!planWhat.inc && !planWhat.exp) { box.innerHTML = '<p class="hint" style="margin:8px 0 0">Подвигайте ползунки: например, что будет, если доход вырастет на 20% или расходы — на 10%. План при этом не меняется.</p>'; return; }
  const d = b.avg.free - a.avg.free;
  const goals = b.goals.filter(t => t.t > 0).map((t, i) => {
    const o = a.goals.filter(x => x.t > 0)[i];
    const lab = x => x.at === -1 ? 'уже есть' : x.at ? `${MONTHS_SH[x.at.m]} ${x.at.y}` : 'не накопится';
    let diff = '';
    if (o.at && t.at && o.at !== -1 && t.at !== -1) { const k = o.at.k - t.at.k; diff = k > 0 ? `<span class="up">на ${k} мес. раньше</span>` : k < 0 ? `<span class="down">на ${-k} мес. позже</span>` : 'без изменений'; }
    return `<div class="pline"><span>${esc(t.g.n || 'Цель')}</span><b class="num">${lab(o)} → ${lab(t)} ${diff ? `<span class="of">${diff}</span>` : ''}</b></div>`;
  }).join('');
  box.innerHTML = `<div class="pline sum"><span>свободно в месяц, в среднем</span><b class="num">${pv(a.avg.free)} → ${pv(b.avg.free)}</b></div>
    <div class="pline"><span>разница</span><b class="num" style="color:var(--${d >= 0 ? 'good' : 'danger'})">${d >= 0 ? '+' : '−'}${pv(Math.abs(d))} в месяц</b></div>${goals}`;
}

// ближайшие 24 месяца: начала и окончания статей, разовые суммы, годовые платежи, цели
function planEvents(sim, pv) {
  const ev = [], add = (i, txt, short, cls) => { if (i >= 0 && i < 24) ev.push({ i, txt, short, cls }); };
  for (const [kind, list] of [['inc', plan.inc], ['exp', plan.exp]]) for (const x of list) {
    if (!(+x.a)) continue;
    const nm = esc(x.n || (kind === 'inc' ? 'доход' : 'расход')), s = planOff(x.from), e = planOff(x.to), sg = kind === 'inc' ? '+' : '−';
    if (x.f === 'once') { add(s ?? 0, `${sg} ${amtTxt(x.a, x.c)} · ${nm}`, `${sg} ${x.n}`, kind); continue; }
    if (x.f === 'y' || x.f === 'q') {
      const st = x.f === 'y' ? 12 : 3; let i = s ?? 0; while (i < 0) i += st;
      for (let k = 0; i < 24 && (e == null || i <= e) && k < (x.f === 'y' ? 2 : 1); i += st, k++) add(i, `${sg} ${amtTxt(x.a, x.c)} · ${nm} (${FREQ[x.f]})`, `${sg} ${x.n}`, kind);
    } else if (s != null && s > 0) add(s, `начинается: ${nm}, ${amtTxt(x.a, x.c)} в месяц`, `с этого месяца ${x.n}`, kind);
    if (e != null && x.f !== 'once' && e >= 0) add(e, `последний месяц: ${nm}`, `последний месяц ${x.n}`, kind);
  }
  for (const t of sim.goals) if (t.at && t.at !== -1) add(t.at.k, `✓ накопите на цель «${esc(t.g.n || 'цель')}»`, '', 'egoal');
  return ev.sort((a, b) => a.i - b.i).slice(0, 12);
}

// таблица как в Excel: статьи по строкам, месяцы (или годы) по столбцам
function planMatrix(sim, cols) {
  const taxK = taxRate / 100;
  const sumCols = f => cols.map(c => c.idx.reduce((t, i) => t + f(i), 0));
  const rowsOut = [];
  rowsOut.push({ sec: 'Доходы' });
  for (const x of plan.inc) rowsOut.push({ l: x.n || 'Доход', v: sumCols(i => itemAt(x, i)) });
  if (plan.inc.some(x => x.tx !== false) && taxRate) rowsOut.push({ l: `Налог ${String(taxRate).replace('.', ',')}%`, v: sumCols(i => -plan.inc.reduce((t, x) => t + (x.tx !== false ? itemAt(x, i) * taxK : 0), 0)) });
  for (const [g, lab] of [['need', 'Обязательные расходы'], ['want', 'Желания']]) {
    const list = plan.exp.filter(x => (x.grp === 'want' ? 'want' : 'need') === g); if (!list.length) continue;
    rowsOut.push({ sec: lab });
    for (const x of list) rowsOut.push({ l: x.n || 'Расход', v: sumCols(i => -itemAt(x, i)) });
  }
  rowsOut.push({ sec: 'Итоги' });
  rowsOut.push({ l: 'Свободно', v: sumCols(i => sim.months[i].free), tot: true });
  if (plan.rate) rowsOut.push({ l: 'Проценты по вкладу', v: sumCols(i => sim.months[i].interest) });
  rowsOut.push({ l: 'Накоплено', v: cols.map(c => sim.months[c.idx[c.idx.length - 1]].bal), tot: true });
  return rowsOut;
}
function planCols(H, byYear) {
  const cols = [];
  for (let i = 0; i < H; i++) {
    const { y, m } = planMonth(i);
    if (byYear) { const last = cols[cols.length - 1]; if (last && last.y === y) last.idx.push(i); else cols.push({ y, l: String(y), idx: [i] }); }
    else cols.push({ l: `${MONTHS_SH[m]}${m === 0 || i === 0 ? ' ' + String(y).slice(2) : ''}`, idx: [i] });
  }
  return cols;
}
function planTable(sim, num) {
  const H = plan.horizon, cols = planCols(H, H > 24), mat = planMatrix(sim, cols);
  const cell = v => Math.abs(v) < 0.5 ? '<td class="z">—</td>' : `<td class="${v < 0 ? 'neg' : ''}">${v < 0 ? '−' : ''}${num(Math.abs(v))}</td>`;
  return `<div class="ptable"><table><thead><tr><th>${H > 24 ? 'по годам' : 'по месяцам'}, ${CUR[planView().V].s}</th>${cols.map(c => `<th>${c.l}</th>`).join('')}</tr></thead><tbody>
    ${mat.map(r => r.sec ? `<tr class="sec"><td colspan="${cols.length + 1}">${r.sec}</td></tr>` : `<tr class="${r.tot ? 'tot' : ''}"><td>${esc(r.l)}</td>${r.v.map(cell).join('')}</tr>`).join('')}
  </tbody></table></div><p class="hint" style="margin:6px 0 0">Таблица листается вбок. Минус — деньги уходят.</p>`;
}
async function planCsv() {
  const sim = planSim(), { V, kV } = planView(), cols = planCols(plan.horizon, false), mat = planMatrix(sim, cols);
  const f = v => (v / kV).toFixed(2).replace('.', ',');
  const lines = [`Статья (${V});${cols.map(c => { const { y, m } = planMonth(c.idx[0]); return `${MONTHS[m]} ${y}`; }).join(';')}`];
  for (const r of mat) lines.push(r.sec ? r.sec : `"${String(r.l).replace(/"/g, '""')}";${r.v.map(f).join(';')}`);
  const name = `scrmoney-plan-${now}.csv`, blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  try {
    const file = new File([blob], name, { type: 'text/csv' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function peSum() {
  const el = $('#peSum'); if (!el || !pedit) return;
  const { kind, x } = pedit, { pv } = planView(), gel = toGel(+x.a || 0, x.c);
  if (!(+x.a)) { el.textContent = 'Впишите сумму.'; return; }

  const tot = itemTotal(x);

}
