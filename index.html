<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>scrmoods</title>
<meta name="theme-color" content="#EFE4DF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="scrmoods">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face { font-family: Lora; src: url(lora_regular.woff) format('woff'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: Lora; src: url(lora_medium.woff) format('woff'); font-weight: 500 700; font-style: normal; font-display: swap; }
@font-face { font-family: Lora; src: url(lora_italic.woff) format('woff'); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: Lora; src: url(lora_medium_italic.woff) format('woff'); font-weight: 500 700; font-style: italic; font-display: swap; }
:root {
  /* cocoa ink on blush paper, dusty rosewood accent: same palette as the Android app */
  --paper: #EFE4DF; --page: #FCF8F6; --ink: #3B2A25; --soft: #86706A; --faint: #B9A59D; --rule: #E3D3CC;
  --acc: #A0594F; --wash: #F1DFD9; --on-acc: #fff; --bad: #C98378; --mid: #D9B26A; --good: #93A77F; --danger: #A8463F;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: Lora, Georgia, serif; font-size: 15.5px; line-height: 1.35; }
body { padding-top: calc(56px + var(--safe-top)); padding-bottom: calc(68px + var(--safe-bottom)); -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

/* top bar */
#top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: var(--paper); padding-top: var(--safe-top); }
#top .row { height: 56px; display: flex; align-items: center; padding: 0 8px 0 24px; }
#top h1 { flex: 1; margin: 0; font-size: 21px; font-weight: 500; font-style: italic; color: var(--acc); }
#top .gear { width: 44px; height: 44px; display: grid; place-items: center; color: var(--soft); }
#top .gear svg { width: 24px; height: 24px; fill: currentColor; }

/* bottom nav */
#nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; background: var(--paper); border-top: 1px solid var(--rule);
  display: flex; padding-bottom: var(--safe-bottom); }
#nav button { flex: 1; height: 68px; color: var(--soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12.5px; }
#nav .ic { width: 58px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
#nav svg { width: 22px; height: 22px; fill: currentColor; }
#nav button.on { color: var(--acc); font-weight: 500; }
#nav button.on .ic { background: var(--wash); }

/* page heading: big weekday / month, italic date, round arrows */
.jhead { display: flex; align-items: flex-end; padding: 12px 20px 2px; gap: 8px; }
.jhead .t { flex: 1; min-width: 0; }
.jhead .big { font-size: 32px; line-height: 38px; font-weight: 500; letter-spacing: -0.3px; }
.jhead .sub { font-size: 15.5px; font-style: italic; color: var(--soft); }
.jhead .back { font-size: 15px; font-style: italic; color: var(--acc); padding: 4px 0 0; }
.rbtn { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--page); border: 1px solid var(--rule); display: grid; place-items: center; margin-bottom: 4px; color: var(--ink); }
.rbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
.rbtn:disabled { color: var(--rule); }

/* sections: italic heading followed by a hairline */
.section { padding: 0 20px; }
.section h2 { display: flex; align-items: center; gap: 14px; margin: 28px 0 2px; font-size: 19px; line-height: 24px; font-weight: 400; font-style: italic; color: var(--acc); }
.section h2::after { content: ""; flex: 1 0 24px; height: 1px; background: var(--rule); }
.q { font-size: 15.5px; line-height: 21px; margin: 18px 0 8px; }

/* answer pills: always one line; fitPills() shrinks a row's text slightly if needed */
.seg { display: flex; gap: 4px; }
.section > .seg, .rangeseg .seg { margin-left: -4px; margin-right: -4px; } /* answer rows reach slightly past the text for more room */
.seg + .seg { margin-top: 6px; }
.seg button { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 4px 5px; border-radius: 999px; border: 1px solid var(--rule);
  background: var(--page); font-size: 14px; white-space: nowrap; overflow: hidden; text-align: center; }
.seg button.on { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.yn { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.yn .q { margin: 0; flex: 1; }
.yn .seg { width: 116px; flex: none; }
.yn .seg button { min-height: 40px; }
.yn.stack { flex-direction: column; align-items: stretch; gap: 8px; }
.yn.stack .seg { align-self: flex-end; }

/* journal sections sit on rounded pages */
.card { background: var(--page); border: 1px solid var(--rule); border-radius: 20px; margin: 12px 10px 0; padding: 0 14px 16px; }
.card h2 { margin-top: 16px; }
.card .seg button { background: var(--paper); }
.card .seg button.on { background: var(--acc); }
.card .ruled { border: 0; border-radius: 0; margin-top: 6px; padding: 10px 2px 4px; background: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px) content-box content-box; }
.card .rbtn { background: var(--paper); }
.jhead { padding-left: 24px; }
.themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.theme { border-radius: 16px; padding: 7px; text-align: left; border: 1px solid; min-width: 0; }
.theme.on { box-shadow: inset 0 0 0 1px var(--acc); }
.theme .mini { border-radius: 10px; padding: 8px; border: 1px solid; }
.theme .mini i { display: block; height: 5px; border-radius: 3px; margin-bottom: 5px; }
.theme .mini .pills { display: flex; gap: 4px; margin-top: 3px; }
.theme .mini b { flex: 1; height: 10px; border-radius: 5px; border: 1px solid transparent; }
.theme .nm { display: block; font-size: 12px; margin: 6px 0 0; font-style: italic; text-align: center; white-space: nowrap; overflow: hidden; }
.theme.on .nm { font-style: normal; font-weight: 500; }

/* quote of the day */
.quote { display: flex; padding: 10px 24px 4px 18px; }
.quote .qm { width: 26px; flex: none; font-size: 46px; line-height: 46px; color: color-mix(in srgb, var(--acc) 55%, transparent); }
.quote p { margin: 6px 0 0; font-size: 16px; line-height: 23px; font-style: italic; }
.quote .qa { display: block; margin-top: 4px; font-size: 13px; font-style: italic; color: var(--acc); }

/* summary */
.sumbtn { display: flex; align-items: center; width: calc(100% - 32px); margin: 12px 16px 0; padding: 14px 18px; border-radius: 16px; background: var(--acc); color: var(--on-acc); text-align: left; }
.sumbtn > span:first-child { flex: 1; } .sumbtn b { display: block; font-size: 18px; font-weight: 500; } .sumbtn i { font-size: 13.5px; opacity: .85; }
.sumbtn .star { width: 34px; height: 34px; border-radius: 50%; background: color-mix(in srgb, var(--on-acc) 18%, transparent); display: grid; place-items: center; }
#summary { position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column; padding: calc(16px + var(--safe-top)) 24px calc(28px + var(--safe-bottom)); background: var(--page); cursor: pointer; user-select: none; }
#summary.sum-good { background: color-mix(in srgb, var(--good) 28%, var(--page)); }
#summary.sum-care { background: color-mix(in srgb, var(--bad) 24%, var(--page)); }
#summary.sum-mood { background: var(--wash); }
.sbars { display: flex; gap: 4px; } .sbars i { flex: 1; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 15%, transparent); }
.sbars i.on { background: color-mix(in srgb, var(--ink) 70%, transparent); }
.stop { display: flex; align-items: center; margin-top: 4px; } .stop span { flex: 1; font-size: 14px; font-style: italic; color: var(--acc); }
.sclose { width: 44px; height: 44px; font-size: 18px; color: var(--soft); }
.sbody { flex: 1; display: flex; flex-direction: column; justify-content: center; animation: sfade .35s ease; }
.sk { font-size: 17px; font-style: italic; color: var(--acc); }
.sh { font-size: 32px; line-height: 39px; font-weight: 500; margin: 10px 0 18px; }
.sbody p { margin: 0 0 10px; font-size: 17px; line-height: 25px; } .sbody p.soft { font-style: italic; color: var(--soft); }
.shint { text-align: center; font-size: 13px; font-style: italic; color: var(--faint); }
@keyframes sfade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sbody { animation: none; } }

/* fixed Trends charts */
.tcard { margin: 12px 16px 0; padding: 12px 0 10px; background: var(--page); border: 1px solid var(--rule); border-radius: 16px; }
.tcard .tt { font-size: 18px; font-weight: 500; padding: 0 14px 6px; }
.tcard svg { width: 100%; height: auto; display: block; }
.tcard .ends { display: flex; padding: 0 14px 0 70px; font-size: 12px; font-style: italic; color: var(--soft); }
.legend2 { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 14px 0; font-size: 12px; color: var(--soft); }
.legend2 span { display: inline-flex; align-items: center; gap: 5px; }
.legend2 i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.legend2 i.ln { width: 4px; background: var(--acc); }
.tnote2 { padding: 8px 14px 0; font-size: 13px; font-style: italic; color: var(--soft); line-height: 18px; }

/* mood scale */
.mstate { display: flex; height: 196px; border-radius: 16px; overflow: hidden; background: var(--paper); border: 1px solid var(--rule); }
.mstate .mempty { margin: auto; padding: 20px; text-align: center; font-size: 14px; font-style: italic; color: var(--soft); line-height: 19px; }
.mhalf { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 12px 18px; }
.mstate.two .mhalf { padding: 12px 10px; }
.mstate.two .mhalf + .mhalf { border-left: 1px solid var(--rule); }
.mhalf .mnum { font-size: 42px; line-height: 46px; font-weight: 500; }
.mhalf b { font-size: 18px; line-height: 23px; font-weight: 500; }
.mhalf i { font-size: 13.5px; line-height: 18px; color: var(--soft); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.mstate.two .mnum { font-size: 34px; line-height: 38px; }
.mstate.two b { font-size: 14px; line-height: 18px; }
.mstate.two i { font-size: 12px; line-height: 16px; -webkit-line-clamp: 5; }
.mdots { display: flex; gap: 3px; margin-top: 12px; }
.mdots button { flex: 1; aspect-ratio: 1; border-radius: 50%; border: 1px solid; font-size: 12.5px; padding: 0; color: var(--ink); }
.mlabels { display: flex; margin-top: 6px; font-size: 12px; font-style: italic; color: var(--soft); }
.mlabels span { flex: 1; } .mlabels span:nth-child(2) { text-align: center; } .mlabels span:last-child { text-align: right; }
.mmixed { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.mmixed button { flex: none; white-space: nowrap; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); color: var(--acc); font-size: 14px; font-weight: 500; }
.mmixed button.on { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.mmixed span { font-size: 12.5px; font-style: italic; color: var(--faint); }
.msupport { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--wash); font-size: 13.5px; line-height: 19px; }
.switchrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 0 6px; }
.switchrow .t { flex: 1; } .switchrow .t b { display: block; font-weight: 400; font-size: 16px; }
.switchrow .t i { display: block; font-size: 13px; line-height: 18px; color: var(--soft); }
.switch { width: 50px; height: 30px; flex: none; border-radius: 15px; background: var(--paper); border: 1px solid var(--rule); position: relative; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--faint); transition: left .15s; }
.switch.on { background: var(--acc); border-color: var(--acc); }
.switch.on::after { left: 24px; background: var(--on-acc); }

/* number slider */
.num { margin-top: 18px; }
.num .head { display: flex; align-items: baseline; gap: 4px; }
.num .head .q { margin: 0; flex: 1; }
.num .val { font-size: 21px; font-weight: 500; color: var(--acc); }
.num .unit, .num .unset { font-size: 14.5px; font-style: italic; color: var(--soft); }
.num .unset { color: var(--faint); }
.num .ctrl { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.num .ctrl .rbtn { margin: 0; font-size: 20px; }
.num input[type=range] { flex: 1; accent-color: var(--acc); height: 32px; }
.num .clear { display: block; margin-left: auto; font-size: 14px; font-style: italic; color: var(--soft); padding: 2px 8px; }
.textq textarea, .dlg input[type=text], .dlg input[type=number], .dlg textarea {
  width: 100%; border: 1px solid var(--rule); border-radius: 12px; background: var(--page); padding: 10px 12px; }
.textq textarea { min-height: 64px; resize: vertical; }
.textq textarea:focus, .dlg input:focus, .dlg textarea:focus { outline: none; border-color: var(--acc); }

/* the day's note on ruled notebook lines */
.ruled { display: block; width: 100%; min-height: 168px; margin-top: 14px; padding: 10px 18px 12px; resize: none;
  font-size: 15.5px; line-height: 28px; border: 1px solid var(--rule); border-radius: 16px;
  background: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px) content-box content-box, var(--page);
  background-attachment: local; }
.ruled:focus { outline: none; border-color: var(--faint); }
.ruled::placeholder { font-style: italic; color: var(--faint); }

.link { display: inline-block; margin: 6px 0 0 -12px; padding: 10px 12px; color: var(--acc); font-size: 15px; font-weight: 500; font-style: italic; border-radius: 999px; }
.tnote { display: flex; align-items: flex-start; gap: 4px; margin-top: 8px; }
.tnote .t { width: 52px; flex: none; color: var(--acc); font-size: 14px; font-style: italic; padding-top: 2px; }
.tnote .x { flex: 1; white-space: pre-wrap; line-height: 21px; }
.tnote button { color: var(--faint); width: 32px; height: 28px; font-size: 14px; }

/* calendar */
.calgrid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 6px 12px 0; gap: 2px; }
.calgrid .wd { text-align: center; font-size: 13px; font-style: italic; color: var(--soft); padding: 6px 0; }
.day { aspect-ratio: 1; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 15px; }
.day.today { box-shadow: inset 0 0 0 1.5px var(--acc); font-weight: 600; }
.day.sel { background: var(--acc); color: var(--on-acc); }
.day.future { color: var(--faint); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 20px; font-size: 14px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.info { color: var(--soft); font-size: 14.5px; padding: 6px 20px; line-height: 1.45; }
.hint { color: var(--faint); font-size: 14px; font-style: italic; padding: 4px 20px; }

/* trends */
.picker { margin: 12px 20px 0; position: relative; }
.picker .ptitle { font-size: 22px; line-height: 28px; font-weight: 500; padding-right: 26px; }
.picker .ptitle::after { content: " ▾"; color: var(--acc); font-size: 18px; }
/* the real dropdown sits invisibly on top of the heading, so the whole heading is tappable */
.picker select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; appearance: none; -webkit-appearance: none; font-size: 16px; }
.picker .sub { font-size: 14px; font-style: italic; color: var(--soft); margin-top: 2px; }
.rangeseg { margin: 18px 20px 14px; }
.chart { margin: 0 16px; padding: 10px 0 8px; background: var(--page); border: 1px solid var(--rule); border-radius: 16px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .ends { display: flex; padding: 0 16px 0 70px; font-size: 12px; font-style: italic; color: var(--soft); }
.stat { display: flex; padding: 5px 0; }
.stat span:first-child { flex: 1; color: var(--soft); }
.stat span:last-child { font-weight: 500; }
.dist { display: flex; align-items: center; padding: 3px 0; font-size: 14px; gap: 8px; }
.dist .l { width: 96px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dist .b { flex: 1; height: 12px; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.dist .b i { display: block; height: 100%; }
.dist .c { width: 30px; color: var(--soft); text-align: right; }
.ovsec { font-size: 14px; font-style: italic; color: var(--acc); margin: 18px 0 2px; }
.ov2 { display: block; width: 100%; text-align: left; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.ov2 .top { display: flex; gap: 10px; align-items: flex-start; }
.ov2 .l { flex: 1; font-size: 15px; line-height: 20px; }
.ov2 .r { display: flex; flex-direction: column; align-items: flex-end; flex: none; max-width: 48%; }
.ov2 .cnt { font-size: 12.5px; font-style: italic; color: var(--soft); margin-top: 2px; padding-right: 4px; }
.tag { font-size: 13.5px; font-weight: 500; padding: 2px 10px; border-radius: 999px; white-space: nowrap; background: color-mix(in srgb, var(--acc) 14%, transparent); }
.tag.good { background: rgba(147,167,127,.32); } .tag.mixed { background: rgba(217,178,106,.32); } .tag.bad { background: rgba(201,131,120,.32); }
.ov2 .strip { display: flex; gap: 2px; height: 10px; margin-top: 8px; }
.ov2 .strip i { flex: 1; border-radius: 2px; }
.ov2 .attn { display: block; margin-top: 6px; font-size: 13px; font-style: italic; font-weight: 500; color: var(--danger); }
.ov { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); width: 100%; text-align: left; }
.ov .l { flex: 1; line-height: 21px; }
.ov .s { color: var(--soft); font-size: 14px; font-style: italic; max-width: 46%; text-align: right; }

/* data & tracking points */
.count { font-size: 24px; font-weight: 500; margin-top: 12px; }
.btn { display: block; width: 100%; margin: 8px 0; padding: 13px; border-radius: 999px; text-align: center; font-weight: 500; }
.btn.primary { background: var(--acc); color: var(--on-acc); }
.btn.outline { border: 1px solid var(--rule); color: var(--acc); background: var(--page); }
.backrow { display: flex; align-items: center; gap: 4px; padding: 4px 8px; font-size: 23px; font-weight: 500; }
.backrow button { width: 44px; height: 44px; font-size: 22px; color: var(--ink); }
.prow { display: flex; align-items: center; padding: 6px 0; gap: 2px; }
.prow .lab { flex: 1; min-width: 0; }
.prow .lab div:first-child { font-size: 15px; line-height: 20px; }
.prow .lab div:last-child { font-size: 13px; color: var(--soft); font-style: italic; }
.prow .ic { width: 36px; height: 36px; color: var(--soft); font-size: 16px; display: grid; place-items: center; border-radius: 50%; }
.prow .ic:disabled { color: var(--rule); }
.prow .ic.red { color: var(--danger); }
.empty { color: var(--faint); padding: 6px 0; font-size: 15px; font-style: italic; }
.small-btn { color: var(--soft); font-size: 15px; font-style: italic; padding: 6px 8px; }

/* dialogs */
#modal { position: fixed; inset: 0; z-index: 50; background: rgba(59, 42, 37, .35); display: none; align-items: center; justify-content: center; padding: 16px; }
#modal.open { display: flex; }
.dlg { background: var(--page); border-radius: 22px; width: 100%; max-width: 480px; max-height: calc(100vh - 64px); display: flex; flex-direction: column; }
.dlg h3 { margin: 0; padding: 22px 22px 10px; font-size: 20px; font-weight: 500; }
.dlg .body { padding: 0 22px; overflow: auto; }
.dlg .acts { display: flex; justify-content: flex-end; gap: 4px; padding: 12px 14px 14px; }
.dlg .acts button { color: var(--soft); padding: 10px 14px; }
.dlg .acts button:last-child { color: var(--acc); font-weight: 500; }
.dlg label.f { display: block; font-size: 14px; color: var(--soft); margin: 12px 0 4px; }
.dlg textarea { min-height: 110px; resize: vertical; }
.dlg .radio { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 15px; }
.dlg .radio input { width: 20px; height: 20px; flex: none; accent-color: var(--acc); margin: 0; }
.dlg .row3 { display: flex; gap: 8px; }
.dlg .row3 > div { flex: 1; }
.err { color: var(--danger); font-size: 14px; margin-top: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(84px + var(--safe-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--page);
  padding: 10px 18px; border-radius: 20px; font-size: 15px; z-index: 60; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="top"><div class="row">
  <h1>scrmoods</h1>
</div></div>

<script>
'use strict';
/* =====================================================================
   Data model — identical to the Android app, and the same XML file format,
   so an export from one can be imported into the other.
   ===================================================================== */
const KEY = 'scrmoods.xml';
const FREQ = ['Not at all', 'Somewhat', 'Fairly', 'Very'];
const LEVEL = ['Not at all', 'Low', 'Medium', 'High'];
const TYPES = { scale: 'Scale (choose one option)', yesno: 'Yes / No', number: 'Number (slider)', text: 'Text' };

const DEFAULT_SECTIONS = [
  { id: 'bipolar', title: 'Mood scale' },
  { id: 'daily', title: 'Daily Check-in' },
  { id: 'health', title: 'Health and Self Care' },
  { id: 'social', title: 'Mental and Social Stimulation' },
  { id: 'custom', title: 'Custom tracking points' },
  { id: 'meds', title: 'Medications/Supplements (check off those you took today)' },
];
const P = (id, section, type, label, extra = {}) =>
  Object.assign({ id, section, type, label, options: [], min: 0, max: 10, step: 1, unit: '', archived: false, reminders: [], better: type === 'yesno' ? 'higher' : 'none' }, extra);
const DEFAULT_POINTS = [
  P('bipolar_mood', 'bipolar', 'number', 'Mood scale', { min: 0, max: 10, step: 1, better: 'middle' }),
  P('bipolar_mood2', 'bipolar', 'number', 'Mood scale, second number on mixed days', { min: 0, max: 10, step: 1, better: 'none' }),
  P('bipolar_mixed', 'bipolar', 'yesno', 'Mixed features', { better: 'none' }),
  P('outlook', 'daily', 'scale', 'How was your overall outlook today?', { options: ['Negative', 'Neutral', 'Positive'], better: 'higher' }),
  P('productive', 'daily', 'scale', 'How productive were you today?', { options: FREQ, better: 'higher' }),
  P('motivated', 'daily', 'scale', 'How motivated did you feel today?', { options: FREQ, better: 'higher' }),
  P('lonely', 'daily', 'scale', 'Did you feel lonely today?', { options: FREQ, better: 'lower' }),
  P('depressed', 'daily', 'scale', 'Did you feel depressed or hopeless today?', { options: FREQ, better: 'lower' }),
  P('anxious', 'daily', 'scale', 'Did you feel anxious today?', { options: FREQ, better: 'lower' }),
  P('sleep_hours', 'health', 'number', "Last night's sleep", { min: 0, max: 16, step: 0.5, unit: 'hrs' }),
  P('restful_sleep', 'health', 'yesno', "Did you have a restful night's sleep?"),
  P('nutrition', 'health', 'yesno', 'Have you met your nutrition needs today?'),
  P('outside', 'health', 'yesno', 'Did you spend time outside?'),
  P('exercise', 'health', 'yesno', 'Did you exercise today?'),
  P('hygiene', 'health', 'yesno', 'Did you tend to your personal hygiene today?'),
  P('friends_family', 'social', 'yesno', 'Did you spend quality time engaging with friends or family?'),
  P('mindfulness', 'social', 'yesno', 'Did you practice any kind of mindfulness or meditation?'),
  P('therapy', 'social', 'yesno', 'Did you have talk therapy today?'),
  P('chores', 'social', 'yesno', 'Did you accomplish any household chores or tasks?'),
  P('news_media', 'social', 'scale', 'News and media exposure:', { options: LEVEL, better: 'lower' }),
  P('social_media', 'social', 'scale', 'Social media exposure:', { options: LEVEL, better: 'lower' }),
];
const clone = o => JSON.parse(JSON.stringify(o));
const defaults = () => ({ sections: clone(DEFAULT_SECTIONS), points: clone(DEFAULT_POINTS), entries: {} });

const fmtNum = n => (Math.round(n * 10) / 10).toString();
function display(p, v) {
  if (v == null) return '';
  if (p.type === 'scale') return p.options[+v] ?? v;
  if (p.type === 'yesno') return v === '1' ? 'Yes' : 'No';
  if (p.type === 'number') return fmtNum(parseFloat(v)) + (p.unit ? ' ' + p.unit : '');
  return v;
}
const entryEmpty = e => !e || (Object.keys(e.values).length === 0 && !e.note && e.timed.length === 0);

/* ---------- XML ---------- */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function toXml(d) {
  const L = ["<?xml version='1.0' encoding='UTF-8' standalone='yes' ?>", '<scrmoods version="1">', '  <sections>'];
  for (const s of d.sections) L.push(`    <section id="${esc(s.id)}" title="${esc(s.title)}"${s.hidden ? ' hidden="true"' : ''} />`);
  L.push('  </sections>', '  <points>');
  for (const p of d.points) {
    let a = `id="${esc(p.id)}" section="${esc(p.section)}" type="${p.type}" label="${esc(p.label)}"`;
    if (p.type === 'number') a += ` min="${p.min}" max="${p.max}" step="${p.step}" unit="${esc(p.unit)}"`;
    a += ` archived="${p.archived}" better="${p.better || 'none'}"`;
    const rem = p.reminders || [];
    if (p.options.length || rem.length) {
      L.push(`    <point ${a}>`);
      for (const o of p.options) L.push(`      <option>${esc(o)}</option>`);
      // Reminder times are used by the Android app; kept here so they survive export/import.
      for (const r of rem) L.push(`      <reminder time="${esc(r)}" />`);
      L.push('    </point>');
    } else L.push(`    <point ${a} />`);
  }
  L.push('  </points>', '  <entries>');
  const byId = Object.fromEntries(d.points.map(p => [p.id, p]));
  for (const date of Object.keys(d.entries).sort()) {
    const e = d.entries[date];
    if (entryEmpty(e)) continue;
    L.push(`    <entry date="${date}">`);
    for (const [pid, v] of Object.entries(e.values)) {
      const t = byId[pid] ? ` text="${esc(display(byId[pid], v))}"` : '';
      L.push(`      <value point="${esc(pid)}"${t}>${esc(v)}</value>`);
    }
    if (e.note) L.push(`      <note>${esc(e.note)}</note>`);
    for (const t of e.timed) L.push(`      <timednote time="${esc(t.time)}">${esc(t.text)}</timednote>`);
    L.push('    </entry>');
  }
  L.push('  </entries>', '</scrmoods>', '');
  return L.join('\n');
}
function fromXml(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  const root = doc.documentElement;
  if (!root || root.nodeName !== 'scrmoods' || doc.getElementsByTagName('parsererror').length)
    throw new Error('This is not a scrmoods file');
  const num = (v, def) => { const n = parseFloat(v); return isNaN(n) ? def : n; };
  const sections = [...root.getElementsByTagName('section')].map(s => ({ id: s.getAttribute('id') || '', title: s.getAttribute('title') || '', hidden: s.getAttribute('hidden') === 'true' }));
  // Built-in sections that are missing go to their usual place (the mood scale at the top).
  DEFAULT_SECTIONS.forEach((d, i) => { if (!sections.some(s => s.id === d.id)) sections.splice(Math.min(i, sections.length), 0, clone(d)); });
  const points = [...root.getElementsByTagName('point')].map(p => ({
    id: p.getAttribute('id') || '',
    section: p.getAttribute('section') || 'custom',
    type: TYPES[p.getAttribute('type')] ? p.getAttribute('type') : 'yesno',
    label: p.getAttribute('label') || '',
    options: [...p.getElementsByTagName('option')].map(o => o.textContent),
    min: num(p.getAttribute('min'), 0), max: num(p.getAttribute('max'), 10), step: num(p.getAttribute('step'), 1),
    unit: p.getAttribute('unit') || '',
    archived: p.getAttribute('archived') === 'true',
    better: ['higher', 'lower', 'none', 'middle'].includes(p.getAttribute('better')) ? p.getAttribute('better')
      : (DEFAULT_POINTS.find(d => d.id === p.getAttribute('id'))?.better || (p.getAttribute('type') === 'yesno' ? 'higher' : 'none')),
    reminders: [...p.getElementsByTagName('reminder')].map(r => r.getAttribute('time')).filter(t => /^([01]\d|2[0-3]):[0-5]\d$/.test(t || '')),
  })).filter(p => p.id);
  const entries = {};
  for (const e of root.getElementsByTagName('entry')) {
    const date = e.getAttribute('date'); if (!date) continue;
    const values = {};
    for (const v of e.getElementsByTagName('value')) if (v.getAttribute('point')) values[v.getAttribute('point')] = v.textContent;
    const note = e.getElementsByTagName('note')[0]?.textContent || '';
    const timed = [...e.getElementsByTagName('timednote')].map(t => ({ time: t.getAttribute('time') || '', text: t.textContent }));
    entries[date] = { values, note, timed };
  }
  for (const id of ['bipolar_mixed', 'bipolar_mood2', 'bipolar_mood']) if (!points.some(p => p.id === id)) points.unshift(clone(DEFAULT_POINTS.find(p => p.id === id)));
  return { sections, points, entries };
}

/* ---------- storage ---------- */
let D;
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (raw) {
    try { D = fromXml(raw); return; }
    catch (e) {
      try { localStorage.setItem(KEY + '.unreadable-' + Date.now(), raw); } catch (_) {}
      setTimeout(() => toast('Saved data could not be read; a copy was kept. Starting fresh.'), 300);
    }
  }
  D = defaults(); save();
}
function save() {
  try { localStorage.setItem(KEY, toXml(D)); }
  catch (e) { toast('Could not save! Storage may be full: export your data.'); }
}
const entry = date => D.entries[date] || { values: {}, note: '', timed: [] };
function updateEntry(date, fn) {
  const e = clone(entry(date)); fn(e);
  if (entryEmpty(e)) delete D.entries[date]; else D.entries[date] = e;
  save();
}
function setValue(date, pid, v) { updateEntry(date, e => { if (v == null || v === '') delete e.values[pid]; else e.values[pid] = String(v); }); }

/* ---------- themes: warm, soft palettes (same as the Android app) ---------- */
const THEMES = [
  { id: 'rosewood', name: 'Rosewood', paper: '#F3E1DC', page: '#FFF8F5', ink: '#3B2A25', soft: '#8A6B63', faint: '#C2A49B', rule: '#EBCFC6', acc: '#C0584A', wash: '#F9DCD3' },
  { id: 'peach', name: 'Peach', paper: '#FCE3CF', page: '#FFF8F1', ink: '#43291C', soft: '#93684F', faint: '#CFA588', rule: '#F3D0B5', acc: '#DB6E35', wash: '#FFE0CB' },
  { id: 'sepia', name: 'Sepia', paper: '#EADFCF', page: '#FBF6EE', ink: '#4F3933', soft: '#85695A', faint: '#BCA893', rule: '#E0D2BF', acc: '#945B46', wash: '#F0E0D0' },
  { id: 'matcha', name: 'Matcha', paper: '#E3EDD8', page: '#F9FCF4', ink: '#26331F', soft: '#5F7351', faint: '#A2B393', rule: '#CFDDBF', acc: '#5C8A3E', wash: '#DDEDCC' },
  { id: 'lavender', name: 'Lavender', paper: '#ECE3F4', page: '#FCF9FF', ink: '#33263F', soft: '#77648A', faint: '#B4A5C4', rule: '#DED0EC', acc: '#8A5BB8', wash: '#EBDCF7' },
  { id: 'berry', name: 'Berry', paper: '#F7DFE8', page: '#FFF7FA', ink: '#3D2030', soft: '#8F5F74', faint: '#C99AAD', rule: '#EFC9D7', acc: '#C24A7C', wash: '#FBD9E6' },
  { id: 'night', name: 'Night', paper: '#221A17', page: '#2E2420', ink: '#F1E4DC', soft: '#BCA79C', faint: '#7E6B62', rule: '#44362F', acc: '#E39A7E', wash: '#4A3129', onAcc: '#2A1C17', dark: true },
];
let theme = THEMES[0];
const OLD_THEMES = { honey: 'sepia', butter: 'sepia', sage: 'matcha', cocoa: 'sepia', blush: 'berry' };
function applyTheme(id) {
  id = OLD_THEMES[id] || id;
  theme = THEMES.find(t => t.id === id) || THEMES[0];
  const r = document.documentElement.style;
  for (const k of ['paper', 'page', 'ink', 'soft', 'faint', 'rule', 'wash']) r.setProperty('--' + k, theme[k]);
  r.setProperty('--acc', theme.acc);
  r.setProperty('--on-acc', theme.onAcc || '#fff');
  document.documentElement.style.colorScheme = theme.dark ? 'dark' : 'light';
  document.querySelector('meta[name=theme-color]').setAttribute('content', theme.paper);
  try { localStorage.setItem('scrmoods.theme', theme.id); } catch (e) {}
}
try { applyTheme(localStorage.getItem('scrmoods.theme')); } catch (e) { applyTheme('rosewood'); }

/* =====================================================================
   UI
   ===================================================================== */
const $main = document.getElementById('main');
const $modal = document.getElementById('modal');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());

const ui = { tab: 'checkin', date: today(), manage: false, month: null, graphPoint: null, range: 1 };
try { const t = sessionStorage.getItem('scrmoods.tab'); if (t) ui.tab = t; } catch (e) {}

function afterRender() { stackLongQuestions(); fitPills(); }
window.addEventListener('resize', () => afterRender());
if (document.fonts) document.fonts.ready.then(() => afterRender());

function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', !ui.manage && b.dataset.tab === ui.tab));
  document.getElementById('nav').style.display = ui.manage ? 'none' : 'flex';
  if (ui.manage) { renderManage(); return afterRender(); }
  ({ checkin: renderCheckin, calendar: renderCalendar, graph: renderGraph, data: renderData })[ui.tab]();
  afterRender();
}

/* ---------- check-in ---------- */
const ARROW_L = '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
const ARROW_R = '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';

function seg(options, selected, act, pid, multiRow = true) {
  const rows = [];
  const all = options.map((o, i) => [o, i]);
  const chunk = multiRow ? 5 : all.length;
  for (let i = 0; i < all.length; i += chunk) rows.push(all.slice(i, i + chunk));
  return rows.map(r => `<div class="seg">${r.map(([o, i]) =>
    `<button class="${selected === i ? 'on' : ''}" data-act="${act}" data-pid="${esc(pid)}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`).join('');
}

function pointInput(p, v) {
  const sel = v == null ? null : parseInt(v);
  if (p.type === 'scale') return `<div class="q">${esc(p.label)}</div>${seg(p.options, sel, 'pick', p.id)}`;
  if (p.type === 'yesno') return `<div class="yn"><div class="q">${esc(p.label)}</div>${seg(['No', 'Yes'], sel, 'pick', p.id)}</div>`;
  if (p.type === 'number') {
    const has = v != null;
    const val = has ? parseFloat(v) : p.min;
    return `<div class="num">
      <div class="head"><div class="q">${esc(p.label)}</div>
        <span class="${has ? 'val' : 'unset'}" id="nv-${esc(p.id)}">${has ? fmtNum(val) : 'not set'}</span>
        ${has && p.unit ? `<span class="unit">${esc(p.unit)}</span>` : ''}</div>
      <div class="ctrl">
        <button class="rbtn" data-act="minus" data-pid="${esc(p.id)}" aria-label="Less">−</button>
        <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${val}" data-pid="${esc(p.id)}">
        <button class="rbtn" data-act="plus" data-pid="${esc(p.id)}" aria-label="More">+</button>
      </div>
      ${has ? `<button class="clear" data-act="clear" data-pid="${esc(p.id)}">Clear</button>` : ''}</div>`;
  }
  return `<div class="textq"><div class="q">${esc(p.label)}</div><textarea data-pid="${esc(p.id)}">${esc(v || '')}</textarea></div>`;
}

function pageHead(big, sub, prevAct, nextAct, nextDisabled, extra = '') {
  return `<div class="jhead"><div class="t"><div class="big">${esc(big)}</div><div class="sub">${esc(sub)}</div>${extra}</div>
    <button class="rbtn" data-act="${prevAct}" aria-label="Previous">${ARROW_L}</button>
    <button class="rbtn" data-act="${nextAct}" aria-label="Next" ${nextDisabled ? 'disabled' : ''}>${ARROW_R}</button></div>`;
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function renderCheckin() {
  const t = today(), d = ui.date, e = entry(d);
  const dt = parseYmd(d);
  let h = pageHead(cap(dt.toLocaleDateString(undefined, { weekday: 'long' })),
    dt.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' }),
    'prev', 'next', d >= t, d !== t ? '<button class="back" data-act="todayDate">Back to today</button>' : '');
  if (showQuote) h += quoteHtml(d);
  for (const s of D.sections) {
    if (s.hidden) continue;
    if (s.id === 'bipolar') { h += moodCard(s, e); continue; }
    const pts = D.points.filter(p => p.section === s.id && !p.archived);
    if (!pts.length && s.id !== 'custom' && s.id !== 'meds') continue;
    h += `<div class="section card"><h2>${esc(s.title)}</h2>`;
    for (const p of pts) h += pointInput(p, e.values[p.id]);
    if (s.id === 'custom') h += `<div><button class="link" data-act="addPoint" data-sec="custom">+ Add custom tracking point</button></div>`;
    if (s.id === 'meds') h += `<div><button class="link" data-act="addPoint" data-sec="meds">+ Add medication</button>
      <button class="link" style="margin-left:0" data-act="manage">Edit medications</button></div>`;
    h += '</div>';
  }
  h += `<div class="section card" style="padding-bottom:6px"><h2>Today's note</h2>
    <textarea class="ruled" id="noteArea" placeholder="Write about your day…">${esc(e.note)}</textarea></div>`;
  h += `<div class="section card"><h2>Through the day</h2>
    ${e.timed.map((n, i) => `<div class="tnote"><span class="t">${esc(n.time.split(' ')[1] || n.time)}</span>
      <span class="x">${esc(n.text)}</span><button data-act="delTimed" data-i="${i}" aria-label="Delete note">✕</button></div>`).join('')}
    <div><button class="link" data-act="addTimed">+ Add a timestamped note</button></div></div>`;
  $main.innerHTML = h + '<div style="height:28px"></div>';
}

/* Answer pills stay on one line: shrink a row's text a little if any label doesn't fit. */
function fitPills() {
  document.querySelectorAll('.seg').forEach(row => {
    const btns = [...row.children];
    let size = 14;
    btns.forEach(b => b.style.fontSize = size + 'px');
    while (size > 10.5 && btns.some(b => b.scrollWidth > b.clientWidth)) {
      size -= 0.5;
      btns.forEach(b => b.style.fontSize = size + 'px');
    }
  });
}
/* Yes/no questions that would take more than two lines beside the buttons go full width instead. */
function stackLongQuestions() {
  document.querySelectorAll('.yn').forEach(yn => {
    yn.classList.remove('stack');
    const q = yn.querySelector('.q');
    if (q.getBoundingClientRect().height > 21 * 2 + 4) yn.classList.add('stack');
  });
}

/* ---------- fixed Trends charts: mood trend and sleep pattern ---------- */
const shortDate = s => parseYmd(s).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
const ends = days => `<div class="ends"><span style="flex:1">${shortDate(days[0])}</span><span>${shortDate(days[days.length - 1])}</span></div>`;
const chartW = () => Math.round(Math.min(Math.max(window.innerWidth - 34, 280), 900));
function yLabels(L, T, B, H, labels) {
  return labels.map((l, i) => `<text x="${L - 6}" y="${T + (H - T - B) * i / (labels.length - 1) + 4}" text-anchor="end" font-size="10.5" font-style="italic" style="fill:var(--soft)">${esc(l)}</text>`).join('');
}
function moodTrendSvg(days) {
  const W = chartW(), H = 230, L = 70, R = 8, T = 10, B = 10, n = days.length, slot = (W - L - R) / n;
  const x = i => L + slot * i + slot / 2, y = v => T + (1 - Math.max(0, Math.min(10, v)) / 10) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  [[0, 1.5, 0], [1.5, 3.5, 2], [3.5, 6.5, 5], [6.5, 8.5, 7], [8.5, 10, 10]].forEach(([lo, hi, z]) =>
    s += `<rect x="${L}" y="${y(hi)}" width="${W - L - R}" height="${y(lo) - y(hi)}" fill="${moodZone(z)}" fill-opacity=".16"/>`);
  s += `<line x1="${L}" x2="${W - R}" y1="${y(5)}" y2="${y(5)}" style="stroke:var(--rule)"/>` + yLabels(L, T, B, H, ['10 Mania', '5 Balanced', '0 Depression']);
  const vals = days.map(d => { const e = D.entries[d]?.values || {}; const a = parseFloat(e.bipolar_mood);
    const b = e.bipolar_mixed === '1' ? parseFloat(e.bipolar_mood2) : NaN; return [isNaN(a) ? null : a, isNaN(b) ? null : b]; });
  vals.forEach(([a, b], i) => { if (a != null && b != null) s += `<line x1="${x(i)}" x2="${x(i)}" y1="${y(a)}" y2="${y(b)}" stroke-width="3" stroke-linecap="round" style="stroke:var(--acc);stroke-opacity:.7"/>`; });
  const pts = vals.map(([a], i) => a == null ? null : `${x(i)},${y(a)}`).filter(Boolean);
  if (pts.length > 1) s += `<polyline points="${pts.join(' ')}" fill="none" stroke-width="1.6" style="stroke:var(--ink);stroke-opacity:.55"/>`;
  const r = n > 120 ? 2.2 : 3.6;
  vals.forEach(([a, b], i) => { for (const v of [a, b]) if (v != null) s += `<circle cx="${x(i)}" cy="${y(v)}" r="${r}" fill="${moodZone(Math.round(v))}"/>`; });
  return s + '</svg>';
}
function moodLegend(days) {
  const items = [[moodZone(10), 'Mania'], [moodZone(7), 'Hypomania'], [moodZone(5), 'Balanced'], [moodZone(2), 'Mild to moderate'], [moodZone(0), 'Severe']];
  let h = '<div class="legend2">' + items.map(([c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join('') + '<span><i class="ln"></i>Mixed</span></div>';
  const vals = days.map(d => D.entries[d]?.values || {}).filter(e => e.bipolar_mood != null);
  if (!vals.length) return h + '<div class="tnote2" style="color:var(--faint)">No mood scale answers in this period yet.</div>';
  const mixed = vals.filter(e => e.bipolar_mixed === '1' && e.bipolar_mood2 != null).length;
  const bal = vals.filter(e => { const v = Math.round(parseFloat(e.bipolar_mood)); return v >= 4 && v <= 6 && !(e.bipolar_mixed === '1' && e.bipolar_mood2 != null); }).length;
  return h + `<div class="tnote2">Balanced on ${bal} of ${vals.length} days${mixed ? `, mixed on ${mixed}` : ''}</div>`;
}
function sleepSvg(p, days) {
  const vals = series(p, days), known = vals.filter(v => v != null);
  const maxV = Math.max(10, Math.ceil(Math.max(0, ...known) / 2) * 2), avg = known.length ? known.reduce((a, b) => a + b, 0) / known.length : null;
  const W = chartW(), H = 200, L = 70, R = 8, T = 10, B = 10, n = days.length, slot = (W - L - R) / n;
  const y = v => T + (1 - Math.min(1, v / maxV)) * (H - T - B), grid = [maxV, maxV * 3 / 4, maxV / 2, maxV / 4, 0];
  let s = `<svg viewBox="0 0 ${W} ${H}">` + grid.map(g => `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" style="stroke:var(--rule)"/>`).join('')
    + yLabels(L, T, B, H, grid.map(g => fmtNum(g) + ' h'));
  const bw = Math.min(22, Math.max(1, slot * 0.68));
  vals.forEach((v, i) => { if (v > 0) s += `<rect x="${L + slot * i + slot / 2 - bw / 2}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" rx="${Math.min(bw / 2, 3)}" style="fill:var(--acc);fill-opacity:.78"/>`; });
  if (avg != null) s += `<line x1="${L}" x2="${W - R}" y1="${y(avg)}" y2="${y(avg)}" stroke-width="1.4" stroke-dasharray="8 5" style="stroke:var(--ink);stroke-opacity:.6"/>`;
  return s + '</svg>';
}
function sleepNote(p, days) {
  const known = series(p, days).filter(v => v != null);
  if (!known.length) return '<div class="tnote2" style="color:var(--faint)">No sleep answers in this period yet.</div>';
  const avg = known.reduce((a, b) => a + b, 0) / known.length;
  return `<div class="tnote2">Average ${avg.toFixed(1)} ${esc(p.unit || 'hrs')} (dashed line), shortest ${fmtNum(Math.min(...known))}, longest ${fmtNum(Math.max(...known))}, ${known.length} nights</div>`;
}

function renderGraph() {
  const chartable = D.points.filter(p => p.type !== 'text' && p.id !== 'bipolar_mood2');
  if (!chartable.length) { $main.innerHTML = '<div class="info" style="padding:16px">No tracking points to chart yet.</div>'; return; }
  let p = chartable.find(q => q.id === ui.graphPoint) || chartable.find(q => q.id === 'outlook') || chartable[0];
  ui.graphPoint = p.id;
  const nDays = RANGES[ui.range][0];
  const days = []; for (let i = nDays - 1; i >= 0; i--) days.push(addDays(today(), -i));
  const short = s => parseYmd(s).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  const s = stats(p, days);
  const moodOn = D.sections.find(x => x.id === 'bipolar')?.hidden === false;
  const sleepP = D.points.find(q => q.id === 'sleep_hours' && !q.archived);
  const periodLabel = nDays === 365 ? 'year' : `${nDays} days`;
  let h = `<div class="rangeseg" style="margin:12px 16px 2px">${seg(RANGES.map(r => r[1]), ui.range, 'range', '')}</div>
    <button class="sumbtn" data-act="summary"><span><b>Summary</b><i>How your last ${periodLabel} went, in words</i></span><span class="star">✦</span></button>`;
  if (moodOn) h += `<div class="tcard"><div class="tt">Mood trend</div>${moodTrendSvg(days)}${ends(days)}${moodLegend(days)}</div>`;
  if (sleepP) h += `<div class="tcard"><div class="tt">Sleep pattern</div>${sleepSvg(sleepP, days)}${ends(days)}${sleepNote(sleepP, days)}</div>`;
  h += `<div class="section"><h2>Any tracking point</h2></div><div class="picker" style="margin-top:10px"><div class="ptitle">${esc(p.label)}${p.archived ? ' (removed)' : ''}</div>
    <div class="sub">Tap to look at another tracking point</div><select id="graphPick" aria-label="Tracking point">${chartable.map(q =>
    `<option value="${esc(q.id)}" ${q.id === p.id ? 'selected' : ''}>${esc(q.label)}${q.archived ? ' (removed)' : ''}</option>`).join('')}</select></div>
    <div class="chart" style="margin-top:12px">${chartSvg(p, days)}
      <div class="ends"><span style="flex:1">${short(days[0])}</span><span>${short(days[days.length - 1])}</span></div></div>
    <div class="section"><h2>In numbers</h2><div style="height:6px"></div>
    <div class="stat"><span>Days answered</span><span>${s ? s.count : 0} of ${nDays}</span></div>`;
  if (s) {
    if (p.type === 'yesno') {
      const yes = s.vals.filter(v => v >= 0.5).length;
      h += `<div class="stat"><span>Yes</span><span>${yes} days (${Math.round(yes * 100 / s.count)}%)</span></div>
            <div class="stat"><span>No</span><span>${s.count - yes} days</span></div>`;
    } else if (p.type === 'scale') {
      h += `<div class="stat"><span>Average</span><span>${s.avg.toFixed(2)} → ${esc(p.options[Math.round(s.avg)] || '')}</span></div><div style="height:8px"></div>`;
      p.options.forEach((o, i) => {
        const c = s.vals.filter(v => Math.round(v) === i).length;
        h += `<div class="dist"><span class="l">${esc(o)}</span><span class="b"><i style="width:${c * 100 / s.count}%;background:${valueColor(p, i)}"></i></span><span class="c">${c}</span></div>`;
      });
    } else {
      const u = p.unit ? ' ' + esc(p.unit) : '';
      h += `<div class="stat"><span>Average</span><span>${s.avg.toFixed(1)}${u}</span></div>
            <div class="stat"><span>Lowest</span><span>${fmtNum(s.min)}${u}</span></div>
            <div class="stat"><span>Highest</span><span>${fmtNum(s.max)}${u}</span></div>`;
    }
  }
  h += `</div><div class="section"><h2>Everything, last ${RANGES[ui.range][1]}</h2>
    <div class="hint" style="padding:8px 0 0">Green is going well, red needs attention. Each square is a day${nDays > 31 ? ' (or a few days averaged)' : ''}.</div>`;
  for (const sec of D.sections) {
    if (sec.hidden) continue;
    const pts = chartable.filter(q => q.section === sec.id && !q.archived);
    if (!pts.length) continue;
    h += `<div class="ovsec">${esc(sec.title)}</div>`;
    for (const q of pts) h += overviewRow(q, days);
  }
  $main.innerHTML = h + '</div>';
}

function verdict(p, s) {
  if (!s) return 'none';
  const g = goodness(p, s.avg);
  return g == null ? 'none' : g >= 0.6 ? 'good' : g <= 0.4 ? 'bad' : 'mixed';
}
function tagText(p, s) {
  if (p.type === 'scale') return p.options[Math.round(s.avg)] ?? fmtNum(s.avg);
  if (p.type === 'yesno') return s.avg >= 0.5 ? `Yes ${Math.round(s.avg * 100)}%` : `No ${Math.round((1 - s.avg) * 100)}%`;
  if (p.id === 'bipolar_mood') return `${MOOD[Math.round(s.avg)][0]} ${s.avg.toFixed(1)}`;
  return s.avg.toFixed(1) + (p.unit ? ' ' + p.unit : '');
}
function overviewRow(p, days) {
  const s = stats(p, days), v = verdict(p, s);
  const per = Math.max(1, Math.ceil(days.length / 31));
  let strip = '';
  for (let i = 0; i < days.length; i += per) {
    const vals = series(p, days.slice(i, i + per)).filter(x => x != null);
    let bg = 'color-mix(in srgb, var(--rule) 60%, transparent)';
    if (vals.length) {
      const avg = vals.reduce((a, b) => a + b, 0) / vals.length, g = goodness(p, avg);
      bg = g == null ? `color-mix(in srgb, var(--acc) ${Math.round(25 + 60 * fraction(p, avg))}%, transparent)` : moodColor(g);
    }
    strip += `<i style="background:${bg}"></i>`;
  }
  const right = s ? `<span class="tag ${v}">${esc(tagText(p, s))}</span><span class="cnt">${s.count} ${s.count === 1 ? 'day' : 'days'}</span>`
                  : '<span class="cnt" style="color:var(--faint)">no answers yet</span>';
  return `<button class="ov2" data-act="graphPoint" data-pid="${esc(p.id)}">
    <span class="top"><span class="l">${esc(p.label)}</span><span class="r">${right}</span></span>
    <span class="strip">${strip}</span>
    ${v === 'bad' ? '<span class="attn">Needs attention</span>' : ''}</button>`;
}

/* ---------- manage tracking points ---------- */
function typeSummary(p) {
  if (p.type === 'scale') return p.options.join(' · ');
  if (p.type === 'yesno') return 'No · Yes';
  if (p.type === 'number') return `Number ${fmtNum(p.min)}–${fmtNum(p.max)}${p.unit ? ' ' + p.unit : ''}`;
  return 'Text';
}
function renderManage() {
  let h = `<div class="backrow"><button data-act="closeManage" aria-label="Back">←</button>Tracking points</div>
    <div class="info" style="font-style:italic">Add your own questions, edit or reorder them, or remove the ones you don't need.
      Removing a point only hides it from the check-in, so its past answers stay in your data.</div>`;
  for (const s of D.sections) {
    if (s.id === 'bipolar') continue; // switched on/off in Settings
    const pts = D.points.filter(p => p.section === s.id && !p.archived);
    h += `<div class="section"><h2>${esc(s.title)}</h2>`;
    pts.forEach((p, i) => {
      h += `<div class="prow"><div class="lab" data-act="editPoint" data-pid="${esc(p.id)}"><div>${esc(p.label)}</div><div>${esc(typeSummary(p))}</div></div>
        <button class="ic" data-act="up" data-pid="${esc(p.id)}" ${i === 0 ? 'disabled' : ''} aria-label="Move up">▲</button>
        <button class="ic" data-act="down" data-pid="${esc(p.id)}" ${i === pts.length - 1 ? 'disabled' : ''} aria-label="Move down">▼</button>
        <button class="ic" data-act="editPoint" data-pid="${esc(p.id)}" aria-label="Edit">✎</button>
        <button class="ic" data-act="archive" data-pid="${esc(p.id)}" aria-label="Remove">🗑</button></div>`;
    });
    if (!pts.length) h += `<div class="empty">Nothing here yet.</div>`;
    h += `<div><button class="link" data-act="addPoint" data-sec="${esc(s.id)}">${s.id === 'meds' ? '+ Add medication' : '+ Add tracking point'}</button></div></div>`;
  }
  const removed = D.points.filter(p => p.archived && p.section !== 'bipolar');
  if (removed.length) {
    h += `<div class="section"><h2>Removed tracking points</h2>
      <div class="info">Hidden from the check-in. Restore brings a point back; Delete erases it and all its past answers.</div>`;
    for (const p of removed) {
      const st = D.sections.find(s => s.id === p.section)?.title || p.section;
      h += `<div class="prow"><div class="lab"><div style="color:var(--soft)">${esc(p.label)}</div><div>${esc(st)}</div></div>
        <button class="ic" data-act="restore" data-pid="${esc(p.id)}" aria-label="Restore">↺</button>
        <button class="ic red" data-act="deleteForever" data-pid="${esc(p.id)}" aria-label="Delete forever">🗑</button></div>`;
    }
    h += '</div>';
  }
  h += `<button class="small-btn" style="margin:20px 12px 24px" data-act="resetDefaults">Restore all built-in questions</button>`;
  $main.innerHTML = h;
}

/* ---------- dialogs ---------- */
function openDialog(title, bodyHtml, actions) {
  $modal.innerHTML = `<div class="dlg" role="dialog"><h3>${esc(title)}</h3><div class="body">${bodyHtml}</div>
    <div class="acts">${actions.map((a, i) => `<button data-dlg="${i}">${esc(a.label)}</button>`).join('')}</div></div>`;
  $modal.classList.add('open');
  $modal.querySelectorAll('[data-dlg]').forEach(b => b.onclick = () => { const r = actions[+b.dataset.dlg].run(); if (r !== false) closeDialog(); });
  const first = $modal.querySelector('textarea, input[type=text]');
  if (first) setTimeout(() => first.focus(), 50);
}
function closeDialog() { $modal.classList.remove('open'); $modal.innerHTML = ''; }
$modal.addEventListener('click', e => { if (e.target === $modal) closeDialog(); });

function textDialog(title, initial, confirm, onSave) {
  openDialog(title, `<textarea id="dlgText">${esc(initial)}</textarea>`,
    [{ label: 'Cancel', run: () => {} }, { label: confirm, run: () => onSave(document.getElementById('dlgText').value) }]);
}
function confirmDialog(title, msg, confirm, onOk) {
  openDialog(title, `<p style="margin:0 0 4px;line-height:1.4">${esc(msg)}</p>`, [{ label: 'Cancel', run: () => {} }, { label: confirm, run: onOk }]);
}

function betterOpts(type, cur) {
  const labels = type === 'yesno' ? ['Yes is good', 'No is good', 'Neither'] : type === 'scale'
    ? ['Later options are better', 'Earlier options are better', 'Neither'] : ['Higher is better', 'Lower is better', 'Neither'];
  return ['higher', 'lower', 'none'].map((b, i) =>
    `<label class="radio"><input type="radio" name="pBetter" value="${b}" ${cur === b ? 'checked' : ''}>${labels[i]}</label>`).join('');
}
function pointEditor(existing, sectionId) {
  const isNew = !existing;
  const p = existing ? clone(existing) : P('', sectionId, sectionId === 'meds' ? 'yesno' : 'scale', '', { options: FREQ.slice() });
  const body = () => {
    const med = p.section === 'meds';
    return `<label class="f">${med ? 'Name and dose' : 'Question'}</label>
      <input type="text" id="pLabel" value="${esc(p.label)}" placeholder="${med ? 'e.g. Vitamin D, 2000 IU (AM)' : 'e.g. Did you drink enough water?'}">
      <label class="f">Section</label>
      ${D.sections.filter(s => s.id !== 'bipolar').map(s => `<label class="radio"><input type="radio" name="pSec" value="${esc(s.id)}" ${p.section === s.id ? 'checked' : ''}>${esc(s.title)}</label>`).join('')}
      <label class="f">Answer type</label>
      ${isNew ? Object.entries(TYPES).map(([k, t]) => `<label class="radio"><input type="radio" name="pType" value="${k}" ${p.type === k ? 'checked' : ''}>${t}</label>`).join('')
              : `<div style="font-size:14px;padding:4px 0">${TYPES[p.type]} (can't be changed once created, so old answers stay valid)</div>`}
      <div id="pBetter" style="display:${p.type === 'text' ? 'none' : 'block'}"><label class="f">Which is better?</label>
        <div id="pBetterOpts">${betterOpts(p.type, p.better || 'higher')}</div>
        <div class="hint" style="padding:2px 0 0">Used to colour Trends green when it's going well and red when it needs attention.</div></div>
      <div id="pScale" style="display:${p.type === 'scale' ? 'block' : 'none'}">
        <label class="f">Options, one per line (lowest first)</label><textarea id="pOpts">${esc(p.options.join('\n'))}</textarea>
        ${isNew ? '' : '<div class="hint" style="padding:4px 0">Answers are saved by position, so keep the same number and order of options.</div>'}
      </div>
      <div id="pNum" style="display:${p.type === 'number' ? 'block' : 'none'}">
        <div class="row3"><div><label class="f">Min</label><input type="number" inputmode="decimal" id="pMin" value="${p.min}"></div>
          <div><label class="f">Max</label><input type="number" inputmode="decimal" id="pMax" value="${p.max}"></div>
          <div><label class="f">Step</label><input type="number" inputmode="decimal" id="pStep" value="${p.step}"></div></div>
        <label class="f">Unit (optional, e.g. hrs, cups)</label><input type="text" id="pUnit" value="${esc(p.unit)}">
      </div>
      <div class="err" id="pErr"></div>`;
  };
  openDialog(isNew ? (sectionId === 'meds' ? 'Add medication' : 'Add tracking point') : 'Edit tracking point', body(), [
    { label: 'Cancel', run: () => {} },
    { label: 'Save', run: () => {
      const err = m => { document.getElementById('pErr').textContent = m; return false; };
      const label = document.getElementById('pLabel').value.trim();
      const section = $modal.querySelector('input[name=pSec]:checked')?.value || p.section;
      const type = isNew ? ($modal.querySelector('input[name=pType]:checked')?.value || p.type) : p.type;
      if (!label) return err('Please enter a question or name.');
      const opts = document.getElementById('pOpts').value.split('\n').map(s => s.trim()).filter(Boolean);
      if (type === 'scale' && opts.length < 2) return err('A scale needs at least 2 options (one per line).');
      const mn = parseFloat(document.getElementById('pMin').value.replace(',', '.'));
      const mx = parseFloat(document.getElementById('pMax').value.replace(',', '.'));
      const st = parseFloat(document.getElementById('pStep').value.replace(',', '.'));
      if (type === 'number' && (isNaN(mn) || isNaN(mx) || isNaN(st) || mx <= mn || st <= 0))
        return err('Check the numbers: maximum must be above minimum and step above 0.');
      const better = type === 'text' ? 'none' : ($modal.querySelector('input[name=pBetter]:checked')?.value || 'higher');
      Object.assign(p, { label, section, type, better, options: type === 'scale' ? opts : [],
        min: type === 'number' ? mn : 0, max: type === 'number' ? mx : 10, step: type === 'number' ? st : 1,
        unit: type === 'number' ? document.getElementById('pUnit').value.trim() : '' });
      if (isNew) { p.id = (section === 'meds' ? 'med_' : 'custom_') + Date.now().toString(36); D.points.push(p); }
      else D.points = D.points.map(q => q.id === p.id ? p : q);
      save(); render();
    } },
  ]);
  // Show the right extra fields when the type or section changes.
  $modal.querySelectorAll('input[name=pType]').forEach(r => r.onchange = () => {
    document.getElementById('pScale').style.display = r.value === 'scale' ? 'block' : 'none';
    document.getElementById('pNum').style.display = r.value === 'number' ? 'block' : 'none';
    document.getElementById('pBetter').style.display = r.value === 'text' ? 'none' : 'block';
    const cur = $modal.querySelector('input[name=pBetter]:checked')?.value || 'higher';
    document.getElementById('pBetterOpts').innerHTML = betterOpts(r.value, cur);
  });
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* ---------- import / export ---------- */
async function exportData() {
  const name = `scrmoods-${today()}.xml`;
  const blob = new Blob([toXml(D)], { type: 'application/xml' });
  const file = new File([blob], name, { type: 'application/xml' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
document.getElementById('importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  const text = await f.text();
  let data;
  try { data = fromXml(text); } catch (e) { return toast('Import failed: ' + e.message); }
  confirmDialog('Replace all data?',
    `The file has ${Object.keys(data.entries).length} days. Importing replaces everything in the app (tracking points and all days). Export first if you want a copy of the current data.`,
    'Import', () => { D = data; save(); render(); toast(`Imported ${Object.keys(D.entries).length} days`); });
});

/* ---------- events ---------- */
function move(pid, dir) {
  const p = D.points.find(q => q.id === pid);
  const sib = D.points.filter(q => q.section === p.section && !q.archived);
  const other = sib[sib.indexOf(p) + dir];
  if (!other) return;
  const a = D.points.indexOf(p), b = D.points.indexOf(other);
  [D.points[a], D.points[b]] = [D.points[b], D.points[a]];
}
const snap = (p, v) => Math.min(p.max, Math.max(p.min, p.min + Math.round((v - p.min) / p.step) * p.step));
const pt = id => D.points.find(p => p.id === id);

document.addEventListener('click', ev => {
  const na = document.getElementById('noteArea');
  if (na && noteTimer) { clearTimeout(noteTimer); noteTimer = null; const v = na.value, d0 = ui.date; updateEntry(d0, e => e.note = v.trim()); }
  const nav = ev.target.closest('#nav button');
  if (nav) { ui.tab = nav.dataset.tab; ui.manage = false; try { sessionStorage.setItem('scrmoods.tab', ui.tab); } catch (e) {} render(); window.scrollTo(0, 0); return; }
  const el = ev.target.closest('[data-act]');
  if (!el || $modal.contains(el)) return;
  const act = el.dataset.act, pid = el.dataset.pid, d = ui.date;
  switch (act) {
    case 'prev': ui.date = addDays(d, -1); break;
    case 'next': if (d < today()) ui.date = addDays(d, 1); break;
    case 'todayDate': ui.date = today(); break;
    case 'pick': {
      const i = +el.dataset.i, cur = entry(d).values[pid];
      setValue(d, pid, cur === String(i) ? null : i); break;
    }
    case 'clear': setValue(d, pid, null); break;
    case 'minus': case 'plus': {
      const p = pt(pid), cur = parseFloat(entry(d).values[pid]);
      const base = isNaN(cur) ? (act === 'plus' ? p.min : p.min + p.step) : cur;
      setValue(d, pid, fmtNum(snap(p, base + (act === 'plus' ? p.step : -p.step)))); break;
    }
    case 'addPoint': return pointEditor(null, el.dataset.sec);
    case 'editPoint': return pointEditor(pt(pid));
    case 'manage': ui.manage = true; window.scrollTo(0, 0); break;
    case 'closeManage': ui.manage = false; window.scrollTo(0, 0); break;
    case 'editNote': return textDialog("Today's Note", entry(d).note, 'Save', v => { updateEntry(d, e => e.note = v.trim()); render(); });
    case 'addTimed': return textDialog('Timestamped note', '', 'Add', v => {
      if (!v.trim()) return;
      const n = new Date();
      updateEntry(d, e => e.timed.push({ time: `${d} ${pad(n.getHours())}:${pad(n.getMinutes())}`, text: v.trim() })); render();
    });
    case 'delTimed': {
      const i = +el.dataset.i;
      return confirmDialog('Delete note?', entry(d).timed[i]?.text || '', 'Delete', () => { updateEntry(d, e => e.timed.splice(i, 1)); render(); });
    }
    case 'prevMonth': case 'nextMonth': {
      const [y, m] = ui.month; const nd = new Date(y, m + (act === 'nextMonth' ? 1 : -1), 1);
      ui.month = [nd.getFullYear(), nd.getMonth()]; break;
    }
    case 'thisMonth': { const n = new Date(); ui.month = [n.getFullYear(), n.getMonth()]; break; }
    case 'pickDay': ui.date = el.dataset.d; ui.tab = 'checkin'; window.scrollTo(0, 0); break;
    case 'range': ui.range = +el.dataset.i; break;
    case 'graphPoint': ui.graphPoint = pid; window.scrollTo(0, 0); break;
    case 'theme': applyTheme(el.dataset.id); break;
    case 'toggleQuote': showQuote = !showQuote; try { localStorage.setItem('scrmoods.quote', showQuote ? 'on' : 'off'); } catch (e) {} break;
    case 'summary': { const n = RANGES[ui.range][0], ds = []; for (let i = n - 1; i >= 0; i--) ds.push(addDays(today(), -i)); openSummary(ds, n === 365 ? 'year' : `${n} days`); return; }
    case 'mood': {
      const ev = entry(d).values, n = +el.dataset.n, mixedOn = ev.bipolar_mixed === '1';
      const a = ev.bipolar_mood != null ? Math.round(+ev.bipolar_mood) : null, b = mixedOn && ev.bipolar_mood2 != null ? Math.round(+ev.bipolar_mood2) : null;
      let na = a, nb = b;
      if (!mixedOn) { na = a === n ? null : n; nb = null; }
      else if (n === a) { na = b; nb = null; }       // remove the first; the second becomes the main one
      else if (n === b) { nb = null; }
      else if (a == null) { na = n; }
      else { nb = n; }                              // set (or replace) the second number
      updateEntry(d, e => {
        if (na == null) delete e.values.bipolar_mood; else e.values.bipolar_mood = String(na);
        if (nb == null) delete e.values.bipolar_mood2; else e.values.bipolar_mood2 = String(nb);
      });
      break;
    }
    case 'mixed': updateEntry(d, e => { if (e.values.bipolar_mixed === '1') { delete e.values.bipolar_mixed; delete e.values.bipolar_mood2; } else e.values.bipolar_mixed = '1'; }); break;
    case 'toggleSection': { const sec = D.sections.find(x => x.id === el.dataset.id); sec.hidden = !sec.hidden; save(); break; }
    case 'export': exportData(); return;
    case 'import': document.getElementById('importFile').click(); return;
    case 'up': move(pid, -1); save(); break;
    case 'down': move(pid, 1); save(); break;
    case 'archive': pt(pid).archived = true; save(); break;
    case 'restore': pt(pid).archived = false; save(); break;
    case 'deleteForever': {
      const p = pt(pid);
      return confirmDialog('Delete forever?', `"${p.label}" and every answer you gave for it will be erased. This can't be undone.`, 'Delete', () => {
        D.points = D.points.filter(q => q.id !== pid);
        for (const [k, e] of Object.entries(D.entries)) { delete e.values[pid]; if (entryEmpty(e)) delete D.entries[k]; }
        save(); render();
      });
    }
    case 'resetDefaults': return confirmDialog('Restore built-in questions?',
      'Any removed or deleted built-in questions come back. Your own points and all answers are kept.', 'Restore', () => {
        const ids = new Set(D.points.map(p => p.id));
        for (const p of D.points) if (DEFAULT_POINTS.some(q => q.id === p.id)) p.archived = false;
        for (const q of DEFAULT_POINTS) if (!ids.has(q.id)) D.points.push(clone(q));
        save(); render();
      });
    default: return;
  }
  render();
});

// Slider: show the value while dragging, save when released.
document.addEventListener('input', ev => {
  if (ev.target.type === 'range') {
    const span = document.getElementById('nv-' + ev.target.dataset.pid);
    if (span) { span.textContent = fmtNum(parseFloat(ev.target.value)); span.className = 'val'; }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.type === 'range') { setValue(ui.date, t.dataset.pid, fmtNum(snap(pt(t.dataset.pid), parseFloat(t.value)))); render(); }
  else if (t.tagName === 'TEXTAREA' && t.dataset.pid && !$modal.contains(t)) setValue(ui.date, t.dataset.pid, t.value.trim() || null);
  else if (t.id === 'graphPick') { ui.graphPoint = t.value; render(); }
});
// Text answers also save while typing (in case the app is closed without leaving the field).
let typingTimer;
document.addEventListener('keyup', ev => {
  const t = ev.target;
  if (t.tagName === 'TEXTAREA' && t.dataset.pid && !$modal.contains(t)) {
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => setValue(ui.date, t.dataset.pid, t.value.trim() || null), 600);
  }
});
// The day's note saves shortly after you stop typing.
let noteTimer;
document.addEventListener('input', ev => {
  if (ev.target.id !== 'noteArea') return;
  const d = ui.date, v = ev.target.value;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => updateEntry(d, e => e.note = v.trim()), 500);
});
document.addEventListener('focusout', ev => {
  if (ev.target.id === 'noteArea') { clearTimeout(noteTimer); const v = ev.target.value; updateEntry(ui.date, e => e.note = v.trim()); }
});
// Coming back to the app on a new day: jump to today if you were on yesterday's "today".
let lastToday = today();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && today() !== lastToday) {
    if (ui.date === lastToday) ui.date = today();
    lastToday = today(); render();
  }
});

load();
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
