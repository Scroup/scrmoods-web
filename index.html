<style>

:root {
  /* cocoa ink on blush paper, dusty rosewood accent: same palette as the Android app */

}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: Lora, Georgia, serif; font-size: 15.5px; line-height: 1.35; }
body { padding-top: calc(56px + var(--safe-top)); padding-bottom: calc(68px + var(--safe-bottom)); -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

/* top bar */

#top .row { height: 56px; display: flex; align-items: center; padding: 0 8px 0 24px; }

/* bottom nav */
#nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; background: var(--paper); border-top: 1px solid var(--rule);
  display: flex; padding-bottom: var(--safe-bottom); }

/* page heading: big weekday / month, italic date, round arrows */

.rbtn { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--page); border: 1px solid var(--rule); display: grid; place-items: center; margin-bottom: 4px; color: var(--ink); }
.rbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

/* sections: italic heading followed by a hairline */
.section { padding: 0 20px; }
.section h2 { display: flex; align-items: center; gap: 14px; margin: 28px 0 2px; font-size: 19px; line-height: 24px; font-weight: 400; font-style: italic; color: var(--acc); }
.section h2::after { content: ""; flex: 1 0 24px; height: 1px; background: var(--rule); }

/* answer pills: always one line; fitPills() shrinks a row's text slightly if needed */
.seg { display: flex; gap: 4px; }
.section > .seg, .rangeseg .seg { margin-left: -4px; margin-right: -4px; } /* answer rows reach slightly past the text for more room */
.seg + .seg { margin-top: 6px; }

  background: var(--page); font-size: 14px; white-space: nowrap; overflow: hidden; text-align: center; }

/* a faint line between questions, so it's clear which answers belong to which question */

/* journal sections sit on rounded pages */
.card { background: var(--page); border: 1px solid var(--rule); border-radius: 20px; margin: 12px 10px 0; padding: 0 14px 16px; }

.card .ruled { border: 0; border-radius: 0; margin-top: 6px; padding: 10px 2px 4px; background: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px) content-box content-box; }

.jhead { padding-left: 24px; }
.themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }

/* quote of the day */
.quote { display: flex; padding: 10px 24px 4px 18px; }

/* summary */
.sumbtn { display: flex; align-items: center; width: calc(100% - 32px); margin: 12px 16px 0; padding: 14px 18px; border-radius: 16px; background: var(--acc); color: var(--on-acc); text-align: left; }

#summary { position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column; padding: calc(16px + var(--safe-top)) 24px calc(28px + var(--safe-bottom)); background: var(--page); cursor: pointer; user-select: none; }
#summary.sum-good { background: color-mix(in srgb, var(--good) 28%, var(--page)); }

#summary.sum-mood { background: var(--wash); }
.sbars { display: flex; gap: 4px; } .sbars i { flex: 1; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 15%, transparent); }
.sbars i.on { background: color-mix(in srgb, var(--ink) 70%, transparent); }
.stop { display: flex; align-items: center; margin-top: 4px; } .stop span { flex: 1; font-size: 14px; font-style: italic; color: var(--acc); }
.sclose { width: 44px; height: 44px; font-size: 18px; color: var(--soft); }
.sbody { flex: 1; display: flex; flex-direction: column; justify-content: center; animation: sfade .35s ease; }
.sk { font-size: 17px; font-style: italic; color: var(--acc); }
.sh { font-size: 32px; line-height: 39px; font-weight: 500; margin: 10px 0 18px; }
.sbody p { margin: 0 0 10px; font-size: 17px; line-height: 25px; } .sbody p.soft { font-style: italic; color: var(--soft); }
.shint { text-align: center; font-size: 13px; font-style: italic; color: var(--faint); }
@keyframes sfade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sbody { animation: none; } }
/* good night celebration */
.finish { display: block; width: 100%; margin: 4px 0 10px; padding: 13px 0; border-radius: 999px; background: var(--acc); color: var(--on-acc);
  font-size: 16px; font-weight: 500; border: 1px solid var(--acc); }
.finish.done { background: transparent; color: var(--acc); border-color: var(--rule); font-style: italic; }
/* opening: a short welcome, then the journal rises into place */
#welcome { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 0 32px; background: var(--paper); pointer-events: none; transition: opacity .48s ease; }
#welcome .wrap { transition: transform .5s ease; }

@keyframes wIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
#main.intro > * { animation: rise .75s cubic-bezier(.16, 1, .3, 1) both; animation-delay: var(--d, 0ms); }
@keyframes rise { from { opacity: 0; transform: translateY(90px); } to { opacity: 1; transform: none; } }
.quickbtn { width: calc(100% - 20px); margin: 10px 10px 0; border-radius: 20px; }
#quick { position: fixed; inset: 0; z-index: 40; background: var(--paper); display: flex; flex-direction: column;
  padding: calc(4px + var(--safe-top)) 0 calc(8px + var(--safe-bottom)); }
#quick .qtop { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px; }
#quick .qx { width: 44px; height: 44px; font-size: 18px; color: var(--soft); }

.pslots button { border-radius: 16px; border: 1px solid var(--rule); background: var(--page); padding: 8px 0; display: flex; flex-direction: column; align-items: center; font: inherit; color: var(--ink); }
.pslots button b { font-size: 15px; font-weight: 400; } .pslots button i { font-size: 12px; font-style: normal; color: var(--soft); }
.pslots button.on { background: var(--wash); border: 1.5px solid var(--acc); } .pslots button.on b { font-weight: 600; }
.paddstage { width: 100%; padding: 14px 0; border-radius: 16px; border: 1.5px dashed var(--rule); background: none; color: var(--acc); font: inherit; font-size: 15px; }
.choice { display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; padding: 8px 0; background: none; border: 0; font: inherit; color: var(--ink); }
.choice .r { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--faint); box-sizing: border-box; flex-shrink: 0; margin-top: 2px; }
.choice.on .r { border: 6px solid var(--acc); } .choice .t { display: flex; flex-direction: column; } .choice .t b { font-size: 16px; font-weight: 400; } .choice .t i { font-size: 13px; color: var(--soft); line-height: 18px; }
.ptime { font: inherit; font-size: 16px; color: var(--acc); border: 1px solid var(--rule); border-radius: 10px; padding: 6px 8px; background: var(--page); }
.headsup { padding: 14px 10px 4px 18px; background: color-mix(in srgb, var(--acc) 10%, var(--page)); }
.headsup.urgent { background: color-mix(in srgb, #C98378 22%, var(--page)); }
.headsup .hk { font-size: 13px; font-style: italic; color: var(--acc); }
.headsup .ht { font-size: 19px; font-weight: 500; margin-top: 2px; }
.headsup .hb { font-size: 15px; line-height: 21px; margin-top: 6px; }
.headsup .ha { font-size: 14px; line-height: 20px; font-style: italic; color: var(--soft); margin-top: 6px; }
.msleep .msrow { display: flex; align-items: center; margin-top: 10px; padding-right: 8px; }
.msleep .msh { flex: 1; text-align: center; font-size: 30px; font-weight: 500; color: var(--acc); }
.msleep .msfaces { display: flex; justify-content: space-evenly; margin-top: 10px; padding-right: 8px; }
.msleep .face { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 6px 12px; border-radius: 16px; font: inherit; color: var(--ink); }
.msleep .face svg { width: 44px; height: 44px; }
.msleep .btn.primary { margin-right: 8px; width: calc(100% - 8px) !important; }
.headsup .hbtns { display: flex; justify-content: flex-end; gap: 4px; }
.dayhint { padding: 8px 24px 0; font-size: 13px; font-style: italic; color: var(--faint); }
.wtop { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.wtop .n { font-size: 30px; font-weight: 500; color: var(--acc); } .wtop .of { font-size: 16px; font-style: italic; color: var(--soft); }
.wsub { font-size: 13.5px; font-style: italic; color: var(--soft); }
.cups { display: flex; gap: 4px; margin-top: 10px; }
.cup { flex: 1 1 0; min-width: 0; max-width: 28px; padding: 0; border-radius: 8px; background: none; border: 0; }
.cup svg { width: 100%; height: auto; aspect-ratio: 28 / 34; display: block; overflow: visible; }
.cup .o { fill: none; stroke: var(--faint); stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }
.cup.on .o { stroke: var(--acc); }
.cup .w { fill: var(--acc); opacity: .85; } .cup.extra .w { opacity: .5; }
.cup .s { stroke: var(--on-acc); stroke-width: 1.6; stroke-linecap: round; opacity: .75; fill: none; }
.cup .f { fill: var(--on-acc); opacity: .9; } .cup .s.f2 { stroke-width: 1.3; opacity: .9; }
.wmsg { margin-top: 10px; font-size: 13.5px; font-style: italic; color: var(--soft); } .wmsg.ok { color: var(--acc); }
.goalrow { display: flex; align-items: center; gap: 8px; padding: 10px 0 4px; } .goalrow .t { flex: 1; } .goalrow .t b { display: block; font-weight: 400; font-size: 16px; } .goalrow .t i { font-size: 13px; color: var(--soft); }
.wweight { width: 160px; margin-top: 8px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 12px; background: var(--page); font-size: 16px; }
#sparkles { position: fixed; inset: 0; z-index: 45; pointer-events: none; overflow: hidden; }
#sparkles span { position: fixed; display: block; will-change: transform, opacity; }
#sparkles svg { display: block; width: 100%; height: 100%; }
#goodnight { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 0 32px;
  background: rgba(42, 28, 23, .28); opacity: 0; transition: opacity .7s ease; cursor: pointer; user-select: none; }
#goodnight.in { opacity: 1; }
#goodnight canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#goodnight .gcard { position: relative; max-width: 380px; width: 100%; background: var(--page); border-radius: 26px; padding: 28px 26px; text-align: center;
  transform: scale(.92); transition: transform .7s cubic-bezier(.2, .9, .3, 1.2); box-shadow: 0 10px 40px rgba(0, 0, 0, .12); }
#goodnight.in .gcard { transform: scale(1); }
#goodnight .moon { font-size: 42px; line-height: 1.1; color: var(--acc); }
#goodnight .gh { font-size: 34px; font-weight: 500; margin-top: 4px; }
#goodnight .gs { font-size: 15px; font-style: italic; color: var(--acc); margin-top: 6px; }
#goodnight .gw { font-size: 17px; line-height: 25px; margin-top: 14px; }
#goodnight .genc { font-size: 15.5px; line-height: 22px; font-style: italic; color: var(--acc); margin-top: 14px; }
#goodnight .genc .rest { opacity: 0; }
#goodnight .gt { font-size: 13px; font-style: italic; color: var(--faint); margin-top: 18px; }

/* fixed Trends charts */
.tcard { margin: 12px 16px 0; padding: 12px 0 10px; background: var(--page); border: 1px solid var(--rule); border-radius: 16px; }
.tcard .tt { font-size: 18px; font-weight: 500; padding: 0 14px 6px; }
.tcard svg { width: 100%; height: auto; display: block; }
.tcard .ends { display: flex; padding: 0 14px 0 70px; font-size: 12px; font-style: italic; color: var(--soft); }
.legend2 { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 14px 0; font-size: 12px; color: var(--soft); }
.legend2 span { display: inline-flex; align-items: center; gap: 5px; }
.legend2 i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.legend2 i.ln { width: 4px; background: var(--acc); }
.tnote2 { padding: 8px 14px 0; font-size: 13px; font-style: italic; color: var(--soft); line-height: 18px; }

/* mood scale */
.mstate { display: flex; height: 196px; border-radius: 16px; overflow: hidden; background: var(--paper); border: 1px solid var(--rule); }
.mstate .mempty { margin: auto; padding: 20px; text-align: center; font-size: 14px; font-style: italic; color: var(--soft); line-height: 19px; }
.mhalf { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 12px 18px; }
.mstate.two .mhalf { padding: 12px 10px; }
.mstate.two .mhalf + .mhalf { border-left: 1px solid var(--rule); }
.mhalf .mnum { font-size: 42px; line-height: 46px; font-weight: 500; }
.mhalf b { font-size: 18px; line-height: 23px; font-weight: 500; }
.mhalf i { font-size: 13.5px; line-height: 18px; color: var(--soft); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.mstate.two .mnum { font-size: 34px; line-height: 38px; }
.mstate.two b { font-size: 14px; line-height: 18px; }
.mstate.two i { font-size: 12px; line-height: 16px; -webkit-line-clamp: 5; }
.mdots { display: flex; gap: 3px; margin-top: 12px; }
.mdots button { flex: 1; aspect-ratio: 1; border-radius: 50%; border: 1px solid; font-size: 12.5px; padding: 0; color: var(--ink); }
.mlabels { display: flex; margin-top: 6px; font-size: 12px; font-style: italic; color: var(--soft); }
.mlabels span { flex: 1; } .mlabels span:nth-child(2) { text-align: center; } .mlabels span:last-child { text-align: right; }
.mmixed { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.mmixed button { flex: none; white-space: nowrap; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); color: var(--acc); font-size: 14px; font-weight: 500; }
.mmixed button.on { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.mmixed span { font-size: 12.5px; font-style: italic; color: var(--faint); }
.msupport { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--wash); font-size: 13.5px; line-height: 19px; }
.switchrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 0 6px; }
.switchrow .t { flex: 1; } .switchrow .t b { display: block; font-weight: 400; font-size: 16px; }
.switchrow .t i { display: block; font-size: 13px; line-height: 18px; color: var(--soft); }
.switch { width: 50px; height: 30px; flex: none; border-radius: 15px; background: var(--paper); border: 1px solid var(--rule); position: relative; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--faint); transition: left .15s; }
.switch.on { background: var(--acc); border-color: var(--acc); }
.switch.on::after { left: 24px; background: var(--on-acc); }

/* number slider */
.num { margin-top: 18px; }
.num .head { display: flex; align-items: baseline; gap: 4px; }
.num .head .q { margin: 0; flex: 1; }
.num .val { font-size: 21px; font-weight: 500; color: var(--acc); }
.num .unit, .num .unset { font-size: 14.5px; font-style: italic; color: var(--soft); }
.num .unset { color: var(--faint); }
.num .ctrl { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.num .ctrl .rbtn { margin: 0; font-size: 20px; }
.num input[type=range] { flex: 1; accent-color: var(--acc); height: 32px; }
.num .clear { display: block; margin-left: auto; font-size: 14px; font-style: italic; color: var(--soft); padding: 2px 8px; }
.textq textarea, .dlg input[type=text], .dlg input[type=number], .dlg textarea {
  width: 100%; border: 1px solid var(--rule); border-radius: 12px; background: var(--page); padding: 10px 12px; }
.textq textarea { min-height: 64px; resize: vertical; }
.textq textarea:focus, .dlg input:focus, .dlg textarea:focus { outline: none; border-color: var(--acc); }

/* the day's note on ruled notebook lines */
.ruled { display: block; width: 100%; min-height: 168px; margin-top: 14px; padding: 10px 18px 12px; resize: none;
  font-size: 15.5px; line-height: 28px; border: 1px solid var(--rule); border-radius: 16px;
  background: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px) content-box content-box, var(--page);
  background-attachment: local; }
.ruled:focus { outline: none; border-color: var(--faint); }
.ruled::placeholder { font-style: italic; color: var(--faint); }

.link { display: inline-block; margin: 6px 0 0 -12px; padding: 10px 12px; color: var(--acc); font-size: 15px; font-weight: 500; font-style: italic; border-radius: 999px; }
.tnote { display: flex; align-items: flex-start; gap: 4px; margin-top: 8px; }
.tnote .t { width: 52px; flex: none; color: var(--acc); font-size: 14px; font-style: italic; padding-top: 2px; }
.tnote .x { flex: 1; white-space: pre-wrap; line-height: 21px; }
.tnote button { color: var(--faint); width: 32px; height: 28px; font-size: 14px; }

/* calendar */
.calgrid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 6px 12px 0; gap: 2px; }
.calgrid .wd { text-align: center; font-size: 13px; font-style: italic; color: var(--soft); padding: 6px 0; }
.day { aspect-ratio: 1; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 15px; }
.day.today { box-shadow: inset 0 0 0 1.5px var(--acc); font-weight: 600; }
.day.sel { background: var(--acc); color: var(--on-acc); }
.day.future { color: var(--faint); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 20px; font-size: 14px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.info { color: var(--soft); font-size: 14.5px; padding: 6px 20px; line-height: 1.45; }
.hint { color: var(--faint); font-size: 14px; font-style: italic; padding: 4px 20px; }

/* trends */
.picker { margin: 12px 20px 0; position: relative; }
.picker .ptitle { font-size: 22px; line-height: 28px; font-weight: 500; padding-right: 26px; }
.picker .ptitle::after { content: " ▾"; color: var(--acc); font-size: 18px; }
/* the real dropdown sits invisibly on top of the heading, so the whole heading is tappable */
.picker select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; appearance: none; -webkit-appearance: none; font-size: 16px; }
.picker .sub { font-size: 14px; font-style: italic; color: var(--soft); margin-top: 2px; }
.rangeseg { margin: 18px 20px 14px; }
.chart { margin: 0 16px; padding: 10px 0 8px; background: var(--page); border: 1px solid var(--rule); border-radius: 16px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .ends { display: flex; padding: 0 16px 0 70px; font-size: 12px; font-style: italic; color: var(--soft); }
.stat { display: flex; padding: 5px 0; }
.stat span:first-child { flex: 1; color: var(--soft); }
.stat span:last-child { font-weight: 500; }
.dist { display: flex; align-items: center; padding: 3px 0; font-size: 14px; gap: 8px; }
.dist .l { width: 96px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dist .b { flex: 1; height: 12px; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.dist .b i { display: block; height: 100%; }
.dist .c { width: 30px; color: var(--soft); text-align: right; }
.ovsec { font-size: 14px; font-style: italic; color: var(--acc); margin: 18px 0 2px; }
.ov2 { display: block; width: 100%; text-align: left; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.ov2 .top { display: flex; gap: 10px; align-items: flex-start; }
.ov2 .l { flex: 1; font-size: 15px; line-height: 20px; }
.ov2 .r { display: flex; flex-direction: column; align-items: flex-end; flex: none; max-width: 48%; }
.ov2 .cnt { font-size: 12.5px; font-style: italic; color: var(--soft); margin-top: 2px; padding-right: 4px; }
.tag { font-size: 13.5px; font-weight: 500; padding: 2px 10px; border-radius: 999px; white-space: nowrap; background: color-mix(in srgb, var(--acc) 14%, transparent); }
.tag.good { background: rgba(147,167,127,.32); } .tag.mixed { background: rgba(217,178,106,.32); } .tag.bad { background: rgba(201,131,120,.32); }
.ov2 .strip { display: flex; gap: 2px; height: 10px; margin-top: 8px; }
.ov2 .strip i { flex: 1; border-radius: 2px; }
.ov2 .attn { display: block; margin-top: 6px; font-size: 13px; font-style: italic; font-weight: 500; color: var(--danger); }
.ov { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); width: 100%; text-align: left; }
.ov .l { flex: 1; line-height: 21px; }
.ov .s { color: var(--soft); font-size: 14px; font-style: italic; max-width: 46%; text-align: right; }

/* data & tracking points */
.count { font-size: 24px; font-weight: 500; margin-top: 12px; }
.btn { display: block; width: 100%; margin: 8px 0; padding: 13px; border-radius: 999px; text-align: center; font-weight: 500; }
.btn.primary { background: var(--acc); color: var(--on-acc); }
.btn.outline { border: 1px solid var(--rule); color: var(--acc); background: var(--page); }
.backrow { display: flex; align-items: center; gap: 4px; padding: 4px 8px; font-size: 23px; font-weight: 500; }
.backrow button { width: 44px; height: 44px; font-size: 22px; color: var(--ink); }
.prow { display: flex; align-items: center; padding: 6px 0; gap: 2px; }
.prow .lab { flex: 1; min-width: 0; }
.prow .lab div:first-child { font-size: 15px; line-height: 20px; }
.prow .lab div:last-child { font-size: 13px; color: var(--soft); font-style: italic; }
.prow .ic { width: 36px; height: 36px; color: var(--soft); font-size: 16px; display: grid; place-items: center; border-radius: 50%; }
.prow .ic:disabled { color: var(--rule); }
.prow .ic.red { color: var(--danger); }
.empty { color: var(--faint); padding: 6px 0; font-size: 15px; font-style: italic; }
.small-btn { color: var(--soft); font-size: 15px; font-style: italic; padding: 6px 8px; }

/* dialogs */
#modal { position: fixed; inset: 0; z-index: 50; background: rgba(59, 42, 37, .35); display: none; align-items: center; justify-content: center; padding: 16px; }
#modal.open { display: flex; }
.dlg { background: var(--page); border-radius: 22px; width: 100%; max-width: 480px; max-height: calc(100vh - 64px); display: flex; flex-direction: column; }
.dlg h3 { margin: 0; padding: 22px 22px 10px; font-size: 20px; font-weight: 500; }
.dlg .body { padding: 0 22px; overflow: auto; }
.dlg .acts { display: flex; justify-content: flex-end; gap: 4px; padding: 12px 14px 14px; }
.dlg .acts button { color: var(--soft); padding: 10px 14px; }
.dlg .acts button:last-child { color: var(--acc); font-weight: 500; }
.dlg label.f { display: block; font-size: 14px; color: var(--soft); margin: 12px 0 4px; }
.dlg textarea { min-height: 110px; resize: vertical; }
.dlg .radio { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 15px; }
.dlg .radio input { width: 20px; height: 20px; flex: none; accent-color: var(--acc); margin: 0; }
.dlg .row3 { display: flex; gap: 8px; }
.dlg .row3 > div { flex: 1; }
.err { color: var(--danger); font-size: 14px; margin-top: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(84px + var(--safe-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--page);
  padding: 10px 18px; border-radius: 20px; font-size: 15px; z-index: 60; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script>
'use strict';
/* =====================================================================
   Language: English is written in the code and doubles as the key for its
   Russian translation (same dictionary as the Android app). Your own

    case 'plSlot': { const s = g.stages[+el.dataset.k], c = el.dataset.c; s.slots = s.slots.includes(c) ? s.slots.filter(x => x !== c) : [...s.slots, c]; return true; }

let D;
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (raw) {
    try { D = fromXml(raw); return; }
    catch (e) {
      try { localStorage.setItem(KEY + '.unreadable-' + Date.now(), raw); } catch (_) {}
      setTimeout(() => toast(tr('Saved data could not be read; a copy was kept. Starting fresh.')), 300);
    }
  }
  D = defaults(); save();
}
function save() {
  try { localStorage.setItem(KEY, toXml(D)); }
  catch (e) { toast(tr('Could not save! Storage may be full: export your data.')); }
}
const entry = date => D.entries[date] || { values: {}, note: '', timed: [] };
function updateEntry(date, fn) {

}

function seg(options, selected, act, pid, multiRow = true) {
  const rows = [];
  const all = options.map((o, i) => [o, i]);
  const chunk = multiRow ? 5 : all.length;
  for (let i = 0; i < all.length; i += chunk) rows.push(all.slice(i, i + chunk));
  return rows.map(r => `<div class="seg">${r.map(([o, i]) =>
    `<button class="${selected === i ? 'on' : ''}" data-act="${act}" data-pid="${esc(pid)}" data-i="${i}">${esc(tr(o))}</button>`).join('')}</div>`).join('');
}

/* Medications can be taken several times a day (e.g. magnesium with each meal). Once a day: yes/no ("1"/"0").
   Several times: a number from 0 to the doses a day. Both show as a row of little pills to tap. */
const isPillMed = p => !!p && p.section === 'meds' && (p.type === 'yesno' || p.type === 'number');
const doses = p => p.type === 'number' ? Math.min(12, Math.max(1, Math.round(p.max))) : 1;

  ? '<path class="pa" d="M16 9.95H8.29a6.05 6.05 0 0 0 0 12.1H16Z"/><path class="pb" d="M16 9.95h7.71a6.05 6.05 0 0 1 0 12.1H16Z"/><path class="ps" d="M8.6 12.6H13"/>' : ''}

/* Settings → Meals: the switch and the meals a day goal. */
function mealsSettings() {
  const s = D.sections.find(x => x.id === 'meals'), p = mealsPoint();
  if (!s || !p) return '';
  let h = `<div class="section"><h2>${tr('Meals')}</h2>
    <button class="switchrow" data-act="toggleSection" data-id="meals" role="switch" aria-checked="${!s.hidden}">
      <span class="t"><b>${tr('Meal tracker')}</b><i>${tr('Tap a bowl after each meal and a cookie for each snack, to see that you eat enough to get through the day.')}</i></span>
      <span class="switch ${s.hidden ? '' : 'on'}"></span></button>`;
  if (!s.hidden) {
    const goal = goalMeals(p);
    h += `<div class="goalrow"><span class="t"><b>${tr('Meals a day')}</b><i>${goal} ${trp(goal, 'meal', 'meals')}</i></span>
        <button class="rbtn" style="font-size:20px" data-act="mealGoalMinus" aria-label="${tr('Less')}" ${goal > 1 ? '' : 'disabled'}>−</button>
        <button class="rbtn" style="font-size:20px" data-act="mealGoalPlus" aria-label="${tr('More')}" ${goal < 8 ? '' : 'disabled'}>+</button></div>`;
  }
  return h + '</div>';
}
/* Settings → Water: the switch, the daily goal and a weight-based suggestion. */
function waterSettings() {
  const s = D.sections.find(x => x.id === 'water'), p = waterPoint();
  if (!s || !p) return '';
  let h = `<div class="section"><h2>${tr('Water')}</h2>
    <button class="switchrow" data-act="toggleSection" data-id="water" role="switch" aria-checked="${!s.hidden}">
      <span class="t"><b>${tr('Water tracker')}</b><i>${tr('Tap a cup for every glass (200 ml) you drink. During the day it sits at the top of the journal.')}</i></span>
      <span class="switch ${s.hidden ? '' : 'on'}"></span></button>`;
  if (!s.hidden) {
    const goal = goalCups(p);
    let weight = ''; try { weight = localStorage.getItem('scrmoods.weight') || ''; } catch (e) {}
    const kg = parseFloat(weight.replace(',', '.'));
    h += `<div class="goalrow"><span class="t"><b>${tr('Daily goal')}</b><i>${goal} ${trp(goal, 'cup', 'cups')} · ${tr('{0} L', litres(goal))}</i></span>
        <button class="rbtn" style="font-size:20px" data-act="goalMinus" aria-label="${tr('Less')}" ${goal > 1 ? '' : 'disabled'}>−</button>
        <button class="rbtn" style="font-size:20px" data-act="goalPlus" aria-label="${tr('More')}">+</button></div>
      <label class="f" for="waterWeight">${tr('Your weight, kg')}</label>
      <input class="wweight" id="waterWeight" type="number" inputmode="decimal" min="25" max="250" value="${esc(weight)}">`;
    if (kg >= 25 && kg <= 250) {
      const rec = recommendedCups(kg);
      h += `<div style="margin-top:8px">${tr('Suggested: about {0} {1} ({2} L) a day.', rec, trp(rec, 'cup', 'cups'), litres(rec))}</div>`;
      if (rec !== goal) h += `<div><button class="link" data-act="waterUseRec" data-n="${rec}">${tr('Use {0} {1} as my goal', rec, trp(rec, 'cup', 'cups'))}</button></div>`;
    }
    h += `<div class="hint" style="padding:6px 0 0">${tr('A rule of thumb: about 30 ml per kg of body weight, counting all drinks. Heat and exercise mean more. If you take lithium or have heart or kidney problems, ask your doctor how much is right for you.')}</div>`;
  }
  return h + '</div>';
}

/* ---------- manage tracking points ---------- */
const timesADay = n => n === 1 ? tr('Once a day') : tr('{0} times a day', n);
function typeSummary(p) {
  if (isPillMed(p)) return timesADay(doses(p));
  if (p.type === 'scale') return p.options.map(o => tr(o)).join(' · ');
  if (p.type === 'yesno') return tr('No') + ' · ' + tr('Yes');
  if (p.type === 'number') return tr('Number {0}–{1}', fmtNum(p.min), fmtNum(p.max)) + (p.unit ? ' ' + tr(p.unit) : '');
  return tr('Text');
}
function renderManage() {
  let h = `<div class="backrow"><button data-act="closeManage" aria-label="${tr('Back')}">←</button>${tr('Tracking points')}</div>
    <div class="info" style="font-style:italic">${tr("Add your own questions, edit or reorder them, or remove the ones you don't need. Removing a point only hides it from the check-in, so its past answers stay in your data.")}</div>`;
  for (const s of D.sections) {
    if (s.id === 'bipolar' || s.id === 'water' || s.id === 'meals') continue; // switched on/off in Settings
    const pts = D.points.filter(p => p.section === s.id && !p.archived);
    h += `<div class="section"><h2>${esc(tr(s.title))}</h2>`;
    pts.forEach((p, i) => {
      h += `<div class="prow"><div class="lab" data-act="editPoint" data-pid="${esc(p.id)}"><div>${esc(tr(p.label))}</div><div>${esc(typeSummary(p))}</div></div>
        <button class="ic" data-act="up" data-pid="${esc(p.id)}" ${i === 0 ? 'disabled' : ''} aria-label="${tr('Move up')}">▲</button>
        <button class="ic" data-act="down" data-pid="${esc(p.id)}" ${i === pts.length - 1 ? 'disabled' : ''} aria-label="${tr('Move down')}">▼</button>
        <button class="ic" data-act="editPoint" data-pid="${esc(p.id)}" aria-label="${tr('Edit')}">✎</button>
        <button class="ic" data-act="archive" data-pid="${esc(p.id)}" aria-label="${tr('Remove')}">🗑</button></div>`;
    });
    if (!pts.length) h += `<div class="empty">${tr('Nothing here yet.')}</div>`;
    h += `<div><button class="link" data-act="addPoint" data-sec="${esc(s.id)}">${s.id === 'meds' ? tr('+ Add medication') : tr('+ Add tracking point')}</button></div></div>`;
  }
  const removed = D.points.filter(p => p.archived && !['bipolar', 'water', 'meals'].includes(p.section));
  if (removed.length) {
    h += `<div class="section"><h2>${tr('Removed tracking points')}</h2>
      <div class="info">${tr('Hidden from the check-in. Restore brings a point back; Delete erases it and all its past answers.')}</div>`;
    for (const p of removed) {
      const st = tr(D.sections.find(s => s.id === p.section)?.title || p.section);
      h += `<div class="prow"><div class="lab"><div style="color:var(--soft)">${esc(tr(p.label))}</div><div>${esc(st)}</div></div>
        <button class="ic" data-act="restore" data-pid="${esc(p.id)}" aria-label="${tr('Restore')}">↺</button>
        <button class="ic red" data-act="deleteForever" data-pid="${esc(p.id)}" aria-label="${tr('Delete forever')}">🗑</button></div>`;
    }
    h += '</div>';
  }
  h += `<button class="small-btn" style="margin:20px 12px 24px" data-act="resetDefaults">${tr('Restore all built-in questions')}</button>`;
  $main.innerHTML = h;
}

/* ---------- dialogs ---------- */
function openDialog(title, bodyHtml, actions) {
  $modal.innerHTML = `<div class="dlg" role="dialog"><h3>${esc(title)}</h3><div class="body">${bodyHtml}</div>
    <div class="acts">${actions.map((a, i) => `<button data-dlg="${i}">${esc(a.label)}</button>`).join('')}</div></div>`;
  $modal.classList.add('open');
  $modal.querySelectorAll('[data-dlg]').forEach(b => b.onclick = () => { const r = actions[+b.dataset.dlg].run(); if (r !== false) closeDialog(); });
  const first = $modal.querySelector('textarea, input[type=text]');
  if (first) setTimeout(() => first.focus(), 50);
}
function closeDialog() { $modal.classList.remove('open'); $modal.innerHTML = ''; }
$modal.addEventListener('click', e => { if (e.target === $modal) closeDialog(); });

function textDialog(title, initial, confirm, onSave) {
  openDialog(title, `<textarea id="dlgText">${esc(initial)}</textarea>`,
    [{ label: tr('Cancel'), run: () => {} }, { label: confirm, run: () => onSave(document.getElementById('dlgText').value) }]);
}
function confirmDialog(title, msg, confirm, onOk) {

function betterOpts(type, cur) {
  const labels = type === 'yesno' ? ['Yes is good', 'No is good', 'Neither'] : type === 'scale'
    ? ['Later options are better', 'Earlier options are better', 'Neither'] : ['Higher is better', 'Lower is better', 'Neither'];
  return ['higher', 'lower', 'none'].map((b, i) =>
    `<label class="radio"><input type="radio" name="pBetter" value="${b}" ${cur === b ? 'checked' : ''}>${tr(labels[i])}</label>`).join('');
}
function pointEditor(existing, sectionId) {
  const isNew = !existing;
  const p = existing ? clone(existing) : P('', sectionId, sectionId === 'meds' ? 'yesno' : 'scale', '', { options: FREQ.map(o => tr(o)) });
  // built-in questions show in the app's language; left unchanged, they keep their original wording
  const orig = existing ? clone(existing) : null;
  // medications are set up by how many times a day they're taken (a pill for each), not by answer type
  const canPill = sec => sec === 'meds' && (isNew || isPillMed(orig));
  let nDoses = orig && isPillMed(orig) ? doses(orig) : 1;
  const doseBox = () => `<div class="goalrow" style="padding:6px 0 0"><span class="t"><b>${timesADay(nDoses)}</b></span>
      <button class="rbtn" style="font-size:20px" data-dose="-1" ${nDoses > 1 ? '' : 'disabled'}>−</button>
      <button class="rbtn" style="font-size:20px" data-dose="1" ${nDoses < 12 ? '' : 'disabled'}>+</button></div>
    <div class="pills" style="margin-top:6px">${Array.from({ length: nDoses }, () => `<span class="pill on" style="width:26px;height:26px;display:inline-block">${pillSvg(true)}</span>`).join('')}</div>
    <div class="hint" style="padding:4px 0 0">${tr('A pill for each time. Tap them through the day as you take them.')}</div>`;
  const body = () => {
    const med = p.section === 'meds', pill = canPill(p.section);
    return `<label class="f">${med ? tr('Name and dose') : tr('Question')}</label>
      <input type="text" id="pLabel" value="${esc(tr(p.label))}" placeholder="${med ? tr('e.g. Vitamin D, 2000 IU (AM)') : tr('e.g. Did you drink enough water?')}">
      <label class="f">${tr('Section')}</label>
      ${D.sections.filter(s => !['bipolar', 'water', 'meals'].includes(s.id)).map(s => `<label class="radio"><input type="radio" name="pSec" value="${esc(s.id)}" ${p.section === s.id ? 'checked' : ''}>${esc(tr(s.title))}</label>`).join('')}
      <div id="pDoses" style="display:${pill ? 'block' : 'none'}"><label class="f">${tr('How many times a day?')}</label><div id="pDoseBox">${doseBox()}</div></div>
      <div id="pGeneric" style="display:${pill ? 'none' : 'block'}">
      <label class="f">${tr('Answer type')}</label>
      ${isNew ? Object.entries(TYPES).map(([k, t]) => `<label class="radio"><input type="radio" name="pType" value="${k}" ${p.type === k ? 'checked' : ''}>${tr(t)}</label>`).join('')
              : `<div style="font-size:14px;padding:4px 0">${tr("{0} (can't be changed once created, so old answers stay valid)", tr(TYPES[p.type]))}</div>`}
      <div id="pBetter" style="display:${p.type === 'text' ? 'none' : 'block'}"><label class="f">${tr('Which is better?')}</label>
        <div id="pBetterOpts">${betterOpts(p.type, p.better || 'higher')}</div>
        <div class="hint" style="padding:2px 0 0">${tr("Used to colour Trends green when it's going well and red when it needs attention.")}</div></div>
      <div id="pScale" style="display:${p.type === 'scale' ? 'block' : 'none'}">
        <label class="f">${tr('Options, one per line (lowest first)')}</label><textarea id="pOpts">${esc(p.options.map(o => tr(o)).join('\n'))}</textarea>
        ${isNew ? '' : `<div class="hint" style="padding:4px 0">${tr('Answers are saved by position, so keep the same number and order of options.')}</div>`}
      </div>
      <div id="pNum" style="display:${p.type === 'number' ? 'block' : 'none'}">
        <div class="row3"><div><label class="f">${tr('Min')}</label><input type="number" inputmode="decimal" id="pMin" value="${p.min}"></div>
          <div><label class="f">${tr('Max')}</label><input type="number" inputmode="decimal" id="pMax" value="${p.max}"></div>
          <div><label class="f">${tr('Step')}</label><input type="number" inputmode="decimal" id="pStep" value="${p.step}"></div></div>
        <label class="f">${tr('Unit (optional, e.g. hrs, cups)')}</label><input type="text" id="pUnit" value="${esc(tr(p.unit))}">
      </div></div>
      <div class="err" id="pErr"></div>`;
  };
  openDialog(isNew ? (sectionId === 'meds' ? tr('Add medication') : tr('Add tracking point')) : tr('Edit tracking point'), body(), [
    { label: tr('Cancel'), run: () => {} },
    { label: tr('Save'), run: () => {
      const err = m => { document.getElementById('pErr').textContent = m; return false; };
      let label = document.getElementById('pLabel').value.trim();
      if (orig && label === tr(orig.label)) label = orig.label;
      const section = $modal.querySelector('input[name=pSec]:checked')?.value || p.section;
      if (canPill(section)) {
        if (!label) return err(tr('Please enter a question or name.'));
        const before = orig && isPillMed(orig) ? doses(orig) : null;
        Object.assign(p, { label, section, options: [] }); withDoses(p, nDoses);
        // keep old answers meaning the same: "all taken" stays all taken
        if (before != null && before !== nDoses) for (const e of Object.values(D.entries)) if (e.values[p.id] != null) e.values[p.id] = remapDose(e.values[p.id], before, nDoses);
        if (isNew) { p.id = 'med_' + Date.now().toString(36); D.points.push(p); }
        else D.points = D.points.map(q => q.id === p.id ? p : q);
        save(); render(); return;
      }
      const type = isNew ? ($modal.querySelector('input[name=pType]:checked')?.value || p.type) : p.type;
      if (!label) return err(tr('Please enter a question or name.'));
      const opts = document.getElementById('pOpts').value.split('\n').map(s => s.trim()).filter(Boolean)
        .map((o, i) => orig && orig.options[i] != null && tr(orig.options[i]) === o ? orig.options[i] : o);
      if (type === 'scale' && opts.length < 2) return err(tr('A scale needs at least 2 options (one per line).'));
      const mn = parseFloat(document.getElementById('pMin').value.replace(',', '.'));
      const mx = parseFloat(document.getElementById('pMax').value.replace(',', '.'));
      const st = parseFloat(document.getElementById('pStep').value.replace(',', '.'));
      if (type === 'number' && (isNaN(mn) || isNaN(mx) || isNaN(st) || mx <= mn || st <= 0))
        return err(tr('Check the numbers: maximum must be above minimum and step above 0.'));
      const better = type === 'text' ? 'none' : ($modal.querySelector('input[name=pBetter]:checked')?.value || 'higher');
      Object.assign(p, { label, section, type, better, options: type === 'scale' ? opts : [],
        min: type === 'number' ? mn : 0, max: type === 'number' ? mx : 10, step: type === 'number' ? st : 1,
        unit: type === 'number' ? (u => orig && u === tr(orig.unit) ? orig.unit : u)(document.getElementById('pUnit').value.trim()) : '' });
      if (isNew) { p.id = (section === 'meds' ? 'med_' : 'custom_') + Date.now().toString(36); D.points.push(p); }
      else D.points = D.points.map(q => q.id === p.id ? p : q);
      save(); render();
    } },
  ]);
  $modal.querySelector('#pDoses').addEventListener('click', ev => {
    const b = ev.target.closest('[data-dose]'); if (!b) return;
    nDoses = Math.max(1, Math.min(12, nDoses + +b.dataset.dose)); haptic();
    document.getElementById('pDoseBox').innerHTML = doseBox();
  });
  $modal.querySelectorAll('input[name=pSec]').forEach(r => r.onchange = () => {
    const pill = canPill(r.value);

  });
  // Show the right extra fields when the type or section changes.
  $modal.querySelectorAll('input[name=pType]').forEach(r => r.onchange = () => {
    document.getElementById('pScale').style.display = r.value === 'scale' ? 'block' : 'none';
    document.getElementById('pNum').style.display = r.value === 'number' ? 'block' : 'none';
    document.getElementById('pBetter').style.display = r.value === 'text' ? 'none' : 'block';
    const cur = $modal.querySelector('input[name=pBetter]:checked')?.value || 'higher';
    document.getElementById('pBetterOpts').innerHTML = betterOpts(r.value, cur);
  });
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* ---------- import / export ---------- */
async function exportData() {
  const name = `scrmoods-${today()}.xml`;
  const blob = new Blob([toXml(D)], { type: 'application/xml' });
  const file = new File([blob], name, { type: 'application/xml' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
document.getElementById('importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  const text = await f.text();
  let data;
  try { data = fromXml(text); } catch (e) { return toast(tr('Import failed: {0}', e.message)); }
  const nIn = Object.keys(data.entries).length;
  confirmDialog(tr('Replace all data?'),
    tr('The file has {0} {1}. Importing replaces everything in the app (tracking points and all days). Export first if you want a copy of the current data.', nIn, trp(nIn, 'day', 'days')),
    tr('Import'), () => { D = data; save(); render(); const n = Object.keys(D.entries).length; toast(tr('Imported {0} {1}', n, trp(n, 'day', 'days'))); });
});

/* ---------- events ---------- */
function move(pid, dir) {
  const p = D.points.find(q => q.id === pid);
  const sib = D.points.filter(q => q.section === p.section && !q.archived);
  const other = sib[sib.indexOf(p) + dir];
  if (!other) return;
  const a = D.points.indexOf(p), b = D.points.indexOf(other);
  [D.points[a], D.points[b]] = [D.points[b], D.points[a]];
}
const snap = (p, v) => Math.min(p.max, Math.max(p.min, p.min + Math.round((v - p.min) / p.step) * p.step));
const pt = id => D.points.find(p => p.id === id);

document.addEventListener('click', ev => {
  const na = document.getElementById('noteArea');
  if (na && noteTimer) { clearTimeout(noteTimer); noteTimer = null; const v = na.value, d0 = ui.date; updateEntry(d0, e => e.note = v.trim()); }
  const nav = ev.target.closest('#nav button');
  if (nav) { ui.tab = nav.dataset.tab; ui.manage = false; ui.plan = null; try { sessionStorage.setItem('scrmoods.tab', ui.tab); } catch (e) {} render(); window.scrollTo(0, 0); return; }
  const el = ev.target.closest('[data-act]');
  if (!el || $modal.contains(el)) return;
  const act = el.dataset.act, pid = el.dataset.pid, d = ui.date;
  if (planClick(act, el)) { render(); return; }

    ctx.clearRect(0, 0, W, H);
    // a soft glow that breathes behind the card
    const R = Math.min(W, H) * .75, g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, R);
    const glow = still ? .4 : .35 + .15 * Math.sin(t * 1.6);
    g.addColorStop(0, `rgba(255,231,184,${glow})`); g.addColorStop(1, 'rgba(255,231,184,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const p of pieces) {
      const life = t - p.delay; if (life < 0) continue;
      const y = (-.04 + p.speed * life) * H; if (y > H + 40) continue;
      const x = (p.x + Math.sin(life * p.swayRate + p.phase) * p.sway) * W;
      const twinkle = .5 + .5 * Math.sin(life * 6.5 + p.phase);    // gentle, about once a second
      ctx.globalAlpha = .45 + .55 * twinkle;
      ctx.fillStyle = p.color;
      const w = p.w / 2.2, h = p.h / 2.2;
      if (p.round) { ctx.beginPath(); ctx.arc(x, y, h * .6, 0, Math.PI * 2); ctx.fill(); }
      else {
        const fw = w * Math.max(.15, Math.abs(Math.cos(life * p.flip + p.phase)));
        ctx.save(); ctx.translate(x, y); ctx.rotate((p.rot + p.spin * life) * Math.PI / 180); ctx.fillRect(-fw / 2, -h / 2, fw, h); ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    el.classList.remove('in');
    setTimeout(() => { running = false; el.remove(); }, 900);
  };
  el.addEventListener('click', ev => { ev.stopPropagation(); close(); });
  setTimeout(close, 13700);
}

/* ---------- quick check-in: one question at a time, ending with the note and the good night (same as Android) ---------- */
let quick = null;
/* 0 = bad (red), 0.5 = in between (amber), 1 = good (green); same colours as Android */
function answerColor(g) {
  const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
  const bad = [201, 88, 75], mid = [217, 160, 64], good = [95, 158, 85];
  const c = g < .5 ? mix(bad, mid, g * 2) : mix(mid, good, (g - .5) * 2);
  return `rgb(${c.join(',')})`;
}
function quickSteps() {
  const steps = [];
  for (const s of D.sections) {
    if (s.hidden) continue;
    if (s.id === 'bipolar') { if (D.points.some(p => p.id === 'bipolar_mood')) steps.push({ kind: 'mood', section: s.title }); continue; }
    if (s.id === 'meals') { if (mealsPoint()) steps.push({ kind: 'meals', section: s.title }); continue; } // bowls and cookies on one page
    for (const p of D.points) if (p.section === s.id && !p.archived) steps.push({ kind: 'point', p, section: s.title });
  }
  steps.push({ kind: 'note' });
  return steps;
}
function stepDone(st, e) {
  if (st.kind === 'mood') return e.values.bipolar_mood != null;
  if (st.kind === 'note') return !!e.note.trim();
  if (st.kind === 'meals') return e.values[MEALS_ID] != null;
  const v = e.values[st.p.id]; return v != null && v !== '';
}
function openQuick(date) {
  const steps = quickSteps(), e = entry(date);
  let i = steps.findIndex(st => !stepDone(st, e)); if (i < 0) i = steps.length - 1;
  quick = { date, steps, i, fwd: true, busy: false };
  const el = document.createElement('div'); el.id = 'quick'; document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
  el.addEventListener('click', quickClick);
  el.addEventListener('input', quickInput);
  showQuick();
}
function closeQuick() {
  document.getElementById('quick')?.remove(); document.body.style.overflow = ''; quick = null; render();
}
function quickGo(to) {
  quick.fwd = to >= quick.i; quick.i = Math.max(0, Math.min(quick.steps.length - 1, to)); quick.busy = false; showQuick();
}
function showQuick() {
  const el = document.getElementById('quick'); if (!el || !quick) return;
  const { steps, i, date } = quick, st = steps[i], e = entry(date);
  let b = '';
  if (st.kind === 'mood') {
    const v = e.values.bipolar_mood != null ? Math.round(+e.values.bipolar_mood) : null;
    const circle = n => { const c = moodZone(n), on = n === v;
      return `<button data-q="mood" data-v="${n}" style="border-color:${on ? c : `color-mix(in srgb, ${c} 55%, transparent)`};background:${on ? c : 'var(--page)'};${on ? 'color:#fff;font-weight:600' : ''}">${n}</button>`; };
    b = `<div class="qk">${esc(tr(st.section))}</div><div class="qh">${tr('Where is your mood today?')}</div>
      <div class="qmrow">${[0, 1, 2, 3, 4, 5].map(circle).join('')}</div><div class="qmrow">${[6, 7, 8, 9, 10].map(circle).join('')}</div>
      <div class="qmlab"><span>${tr('0 depression')}</span><span>${tr('5 balanced')}</span><span>${tr('10 mania')}</span></div>
      <div class="qmdesc">${v == null ? '' : `<b style="color:${moodZone(v)}">${v} · ${esc(tr(MOOD[v][0]))}</b><i>${esc(tr(MOOD[v][1]))}</i>`}</div>`;
  } else if (st.kind === 'meals') {
    b = `<div class="qk">${esc(tr(st.section))}</div><div class="qh">${tr('How did you eat today?')}</div>
      <div id="qmeals">${mealsCard(null, e, true)}</div><button class="qnext" data-q="skip">${tr('Next')}</button>`;
  } else if (st.kind === 'note') {
    b = `<div class="qk">${tr("Today's note")}</div><div class="qh">${tr("Anything you'd like to remember about today?")}</div>
      <textarea id="qnote" placeholder="${tr('Write about your day…')}">${esc(e.note)}</textarea>
      <button class="qnext" data-q="finish">${gn.finished === date ? tr('Save and close') : tr('Finish the day') + '&nbsp; ☾'}</button>`;
  } else {
    const p = st.p.id === WATER_ID ? Object.assign({}, st.p, { max: Math.max(st.p.max * 2, 12) }) : st.p, v = e.values[p.id];
    quick.np = p;
    b = `<div class="qk">${esc(tr(st.section))}</div><div class="qh">${esc(tr(p.label))}</div>`;
    if (p.type === 'scale' || p.type === 'yesno') {
      const opts = p.type === 'yesno' ? [[1, 'Yes'], [0, 'No']] : p.options.map((o, k) => [k, o]);
      // red for the bad end, green for the good end (following the question's "Which is better?")
      b += opts.map(([k, o]) => {
        const g = goodness(p, k), c = g == null ? 'var(--acc)' : answerColor(g);
        return `<button class="qopt ${v != null && +v === k ? 'on' : ''}" style="--c:${c}" data-q="pick" data-v="${k}">${esc(tr(o))}</button>`;
      }).join('');
    } else if (isPillMed(p)) {
      // a medication taken several times a day: a big pill for each dose
      b += `<div class="qpills">${pills(p, v, 'qpill')}</div><div class="qpcount">${tr('{0} of {1} taken', Math.min(doses(p), dosesTaken(v)), doses(p))}</div>
        <button class="qnext" data-q="pnext">${tr('Next')}</button>`;
    } else if (p.type === 'number') {
      const prev = entry(addDays(date, -1)).values[p.id];
      const start = v != null ? +v : p.id === WATER_ID ? 0 : prev != null ? +prev : snap(p, (p.min + p.max) / 2);
      quick.num = start;
      b += `<div class="qnum"><b id="qnv">${fmtNum(start)}</b>${p.unit ? `<span> ${esc(tr(p.unit))}</span>` : ''}</div>
        <div class="qctrl"><button class="rbtn" data-q="minus">−</button>
        <input type="range" id="qrange" min="${p.min}" max="${p.max}" step="${p.step}" value="${start}">
        <button class="rbtn" data-q="plus">+</button></div>
        <button class="qnext" data-q="next">${tr('Next')}</button>`;
    } else {
      b += `<textarea id="qtext">${esc(v || '')}</textarea><button class="qnext" data-q="next">${tr('Next')}</button>`;
    }
  }
  el.innerHTML = `<div class="qtop"><button class="qx" data-q="close" aria-label="${tr('Close')}">✕</button>
      <div class="qbar"><i style="width:${(i + 1) / steps.length * 100}%"></i></div>
      ${st.kind === 'note' ? '<span style="width:52px"></span>' : `<button class="qskip" data-q="skip">${tr('Skip')}</button>`}</div>
    <div class="qcount">${tr('{0} of {1}', i + 1, steps.length)}</div>
    <div class="qbody ${quick.fwd ? 'fwd' : 'back'}"><div>${b}</div></div>
    <div class="qbottom">${i > 0 ? `<button class="link" data-q="prev" style="margin-left:-12px">‹ ${tr('Previous')}</button>` : ''}</div>`;
}
function quickInput(ev) {
  if (ev.target.id === 'qrange') { quick.num = parseFloat(ev.target.value); document.getElementById('qnv').textContent = fmtNum(quick.num); }
}
function quickClick(ev) {
  const t = ev.target.closest('[data-q]'); if (!t || !quick) return;
  const { steps, i, date } = quick, st = steps[i], act = t.dataset.q;
  if (act === 'close') return closeQuick();
  if (act === 'skip') return quickGo(i + 1);
  if (act === 'prev') return quickGo(i - 1);
  if (act === 'pick') {
    if (quick.busy) return; quick.busy = true;
    setValue(date, st.p.id, t.dataset.v);
    t.parentNode.querySelectorAll('.qopt').forEach(o => o.classList.toggle('on', o === t));
    popButton({ el: t, stars: true });
    setTimeout(() => quickGo(i + 1), 420);
  } else if (act === 'mood') {
    const n = +t.dataset.v;
    updateEntry(date, e => { e.values.bipolar_mood = String(n); if (e.values.bipolar_mixed !== '1') delete e.values.bipolar_mood2; });
    showQuick();                                    // redraw to show the choice and its description
    const nb = document.querySelector(`#quick [data-q="mood"][data-v="${n}"]`);
    document.querySelector('#quick .qbody').className = 'qbody';
    popButton({ el: nb, stars: true });
    if (!quick.busy) { quick.busy = true; setTimeout(() => quick && quickGo(quick.i + 1), 900); }
  } else if (act === 'minus' || act === 'plus') {
    const p = quick.np || st.p, r = document.getElementById('qrange');
    quick.num = snap(p, quick.num + (act === 'plus' ? p.step : -p.step));
    r.value = quick.num; document.getElementById('qnv').textContent = fmtNum(quick.num);
  } else if (act === 'meal' || act === 'snack') {
    const p = act === 'meal' ? mealsPoint() : snacksPoint(); if (!p) return;
    const cur = Math.round(parseFloat(entry(date).values[p.id]) || 0), k = +t.dataset.n, n = tapTo(k, cur);
    setValue(date, p.id, String(n));
    const box = document.getElementById('qmeals'); box.innerHTML = mealsCard(null, entry(date), true);
    if (n > cur) popButton({ el: box.querySelector(`[data-q="${act}"][data-n="${k}"]`), stars: true, color: 'acc' });
  } else if (act === 'qpill') {
    const p = st.p, n = doses(p), cur = Math.min(n, dosesTaken(entry(date).values[p.id])), k = +t.dataset.n, next = k + 1 === cur ? k : k + 1;
    const v = doseValue(next, n); setValue(date, p.id, v);
    const box = t.closest('.qpills'); box.innerHTML = pills(p, v, 'qpill');
    box.nextElementSibling.textContent = tr('{0} of {1} taken', next, n);
    if (next > cur) popButton({ el: box.querySelector(`[data-n="${k}"]`), stars: true, color: 'acc' });
  } else if (act === 'pnext') {
    if (entry(date).values[st.p.id] == null) setValue(date, st.p.id, doseValue(0, doses(st.p)));
    quickGo(i + 1);
  } else if (act === 'next') {
    if (st.p.type === 'number') setValue(date, st.p.id, fmtNum(snap(quick.np || st.p, quick.num)));
    else setValue(date, st.p.id, document.getElementById('qtext').value.trim() || null);
    quickGo(i + 1);
  } else if (act === 'finish') {
    const note = document.getElementById('qnote').value;
    updateEntry(date, e => e.note = note.trim());
    closeQuick();
    if (gn.on && gn.finished !== date) celebrate(date, true);
  }
}

/* Opening the app: a short welcome, then the header and cards swoosh up from below (same as Android). */
let welcomeOn = true;
try { welcomeOn = localStorage.getItem('scrmoods.welcome') !== 'off'; } catch (e) {}
function greeting() {
  const h = new Date().getHours();
  return tr(h >= 5 && h < 12 ? 'Good morning' : h >= 12 && h < 17 ? 'Good afternoon' : h >= 17 && h < 23 ? 'Good evening' : 'Hello, night owl');
}
function playIntro() {
  if (!welcomeOn || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  const RISE = 950, STEP = 85;
  const el = document.createElement('div');
  el.id = 'welcome';
  el.innerHTML = `<div class="wrap"><div class="w"><div class="orn">✦</div><div class="wh">${greeting()}</div>
    <div class="ws">${tr("Welcome back. Let's see how today is going.")}</div></div></div>`;
  document.body.appendChild(el);
  [...$main.children].forEach((c, i) => c.style.setProperty('--d', (RISE + i * STEP) + 'ms'));
  $main.classList.add('intro');
  setTimeout(() => el.classList.add('out'), RISE - 80);
  setTimeout(() => el.remove(), RISE + 520);
  const end = () => $main.classList.remove('intro');
  setTimeout(end, RISE + 20 * STEP + 800);
  document.addEventListener('click', end, { once: true, capture: true }); // tapping early just shows everything
}

load();
render();
playIntro();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
