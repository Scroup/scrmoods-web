<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>scrcook</title>
<meta name="theme-color" content="#F3E1DC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="scrcook">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face { font-family: Lora; src: url(../lora_regular.woff) format('woff'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: Lora; src: url(../lora_medium.woff) format('woff'); font-weight: 500 700; font-style: normal; font-display: swap; }
@font-face { font-family: Lora; src: url(../lora_italic.woff) format('woff'); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: Lora; src: url(../lora_medium_italic.woff) format('woff'); font-weight: 500 700; font-style: italic; font-display: swap; }
:root {
  /* та же палитра, что в scrmoods и scrmoney: какао-чернила на розоватой бумаге */
  --paper: #F3E1DC; --page: #FFF8F5; --ink: #3B2A25; --soft: #8A6B63; --faint: #C2A49B; --rule: #EBCFC6;
  --acc: #C0584A; --wash: #F9DCD3; --on-acc: #fff; --good: #93A77F; --warn: #D9B26A; --danger: #A8463F;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: Lora, Georgia, serif; font-size: 15.5px; line-height: 1.35; }
body { padding-top: calc(56px + var(--safe-top)); padding-bottom: calc(84px + var(--safe-bottom)); -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
a { color: var(--acc); }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
#main { max-width: 620px; margin: 0 auto; }
.num { font-variant-numeric: tabular-nums lining-nums; }

/* верхняя полоса */
#top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: var(--paper); padding-top: var(--safe-top); }
#top .row { height: 56px; display: flex; align-items: center; padding: 0 16px 0 24px; max-width: 620px; margin: 0 auto; }
#top h1 { flex: 1; margin: 0; font-size: 21px; font-weight: 500; font-style: italic; color: var(--acc); }
#top .tpill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 10px; border-radius: 17px; background: var(--wash); color: var(--acc); font-size: 15px; font-weight: 500; }
#top .tpill svg { width: 18px; height: 18px; fill: currentColor; }
#top .tpill.ring { background: var(--acc); color: var(--on-acc); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }

/* нижняя навигация */
#nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; background: var(--paper); border-top: 1px solid var(--rule);
  display: flex; justify-content: center; padding-bottom: var(--safe-bottom); }
#nav button { flex: 1; max-width: 200px; height: 68px; color: var(--soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12.5px; position: relative; }
#nav .ic { width: 58px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
#nav svg { width: 22px; height: 22px; fill: currentColor; }
#nav button.on { color: var(--acc); font-weight: 500; }
#nav button.on .ic { background: var(--wash); }
#nav .badge { position: absolute; top: 8px; left: calc(50% + 10px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--acc); color: var(--on-acc); font-size: 11px; line-height: 18px; font-weight: 500; font-style: normal; }

/* заголовок страницы */
.jhead { display: flex; align-items: flex-end; padding: 12px 20px 2px 24px; gap: 8px; }
.jhead .t { flex: 1; min-width: 0; }
.jhead .big { font-size: 32px; line-height: 38px; font-weight: 500; letter-spacing: -0.3px; text-wrap: balance; }
.jhead .sub { font-size: 15.5px; font-style: italic; color: var(--soft); }
.jhead.back { align-items: center; padding-left: 14px; }
.jhead.back .big { font-size: 26px; line-height: 31px; }
.rbtn { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--page); border: 1px solid var(--rule); display: grid; place-items: center; margin-bottom: 4px; color: var(--ink); }
.rbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

/* секции и карточки */
.section { padding: 0 20px; }
h2.hl { display: flex; align-items: center; gap: 14px; margin: 28px 0 6px; font-size: 19px; line-height: 24px; font-weight: 400; font-style: italic; color: var(--acc); }
h2.hl::after { content: ""; flex: 1 0 24px; height: 1px; background: var(--rule); }
.card { background: var(--page); border: 1px solid var(--rule); border-radius: 20px; margin: 12px 10px 0; padding: 4px 16px 16px; }
.card h2.hl { margin-top: 14px; }
.hint { font-size: 13px; font-style: italic; color: var(--soft); line-height: 18px; margin: 10px 4px 0; }
.empty { padding: 24px 8px 12px; text-align: center; font-style: italic; color: var(--soft); line-height: 21px; }

/* поиск и фильтры */
.find { display: flex; gap: 8px; padding: 12px 10px 0; }
.in { width: 100%; min-height: 48px; border: 1px solid var(--rule); border-radius: 14px; background: var(--page); padding: 10px 14px; font-size: 17px; }
.in:focus { outline: none; border-color: var(--acc); }
.find .in { flex: 1; min-width: 0; }
.find .go { flex: none; padding: 0 18px; border-radius: 14px; background: var(--acc); color: var(--on-acc); font-weight: 500; }
.chips { display: flex; gap: 6px; padding: 12px 10px 0; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--rule); background: var(--page); font-size: 14px; white-space: nowrap; }
.chips button.on { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.hrt { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; display: block; }
.chips .fvchip { display: inline-flex; align-items: center; gap: 5px; color: var(--acc); }
.chips .fvchip .hrt { width: 15px; height: 15px; fill: currentColor; }
.chips .fvchip.on { color: var(--on-acc); }
.rbtn.fav { color: var(--acc); align-self: center; margin-bottom: 0; }
.rbtn.fav .hrt { width: 21px; height: 21px; }
.rbtn.fav.on { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.rbtn.fav.on .hrt { fill: currentColor; }
.rc .ph { position: relative; }
.rc .fv { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.rc .fv .hrt { width: 18px; height: 18px; fill: currentColor; }
.seg { display: flex; gap: 6px; padding: 10px 10px 0; }
.seg button { flex: 1 1 0; min-width: 0; min-height: 36px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg button.on { background: var(--ink); border-color: var(--ink); color: var(--page); }
.count { font-size: 13px; font-style: italic; color: var(--soft); padding: 12px 24px 0; }
h2.hl small { font-size: 13px; font-style: normal; color: var(--faint); }
.chips.ingc small { font-size: 11.5px; color: var(--faint); margin-left: 2px; }
.chips.ingc button.on small { color: inherit; opacity: .8; }
.bundles { display: flex; gap: 10px; overflow-x: auto; padding: 10px 10px 2px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.bundles::-webkit-scrollbar { display: none; }
.bcard { flex: 0 0 76%; max-width: 290px; scroll-snap-align: start; text-align: left; background: var(--wash); border: 1px solid var(--rule); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.bcard:first-child { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.bcard b { font-size: 18px; line-height: 22px; font-weight: 500; }
.bcard i { font-size: 13px; opacity: .8; }
.bcard .bk { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.bcard .bk span { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--page); color: var(--ink); }
.tags .ml { background: var(--wash); color: var(--acc); }
.rc.row { display: flex; align-items: stretch; }
.rc.row .ph { width: 38%; flex: none; aspect-ratio: auto; }
.rc.row .tx { flex: 1; min-width: 0; padding: 10px 14px 12px; }
.rc.row .tt { font-size: 17px; line-height: 21px; }
.xtra { margin-top: 6px; font-size: 13px; font-style: italic; color: var(--acc); line-height: 18px; }

/* список рецептов */
.rc { display: block; width: calc(100% - 20px); margin: 12px 10px 0; text-align: left; background: var(--page); border: 1px solid var(--rule); border-radius: 20px; overflow: hidden; }
.rc .ph { aspect-ratio: 16 / 9; max-width: 100%; background: var(--wash); overflow: hidden; }
.rc .ph img, .hero img, .rc .ph svg, .hero svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.rc .tx { padding: 12px 16px 14px; }
.rc .tt { font-size: 20px; line-height: 25px; font-weight: 500; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 6px; font-size: 13.5px; font-style: italic; color: var(--soft); }
.lvl { display: inline-flex; align-items: center; gap: 3px; font-style: normal; }
.lvl i { width: 7px; height: 7px; border-radius: 50%; background: var(--rule); }
.lvl i.f { background: var(--acc); }
.lvl span { margin-left: 4px; font-style: italic; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tags > span { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--paper); color: var(--soft); }

/* рецепт */
.hero:has(img) { aspect-ratio: 4 / 3; }
.hero { margin: 12px 10px 0; border-radius: 20px; overflow: hidden; aspect-ratio: 16 / 10; max-width: calc(100% - 20px); background: var(--wash); }
.lede { padding: 14px 24px 0; font-size: 16.5px; line-height: 23px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 22px 0; }
.facts > span { font-size: 13.5px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--page); }
.sumbtn { display: flex; align-items: center; width: calc(100% - 20px); margin: 14px 10px 0; padding: 14px 18px; border-radius: 20px; background: var(--acc); color: var(--on-acc); text-align: left; }
.sumbtn > span:first-child { flex: 1; } .sumbtn b { display: block; font-size: 18px; font-weight: 500; } .sumbtn i { font-size: 13.5px; opacity: .85; }
.sumbtn .plus { width: 34px; height: 34px; flex: none; border-radius: 50%; background: color-mix(in srgb, var(--on-acc) 18%, transparent); display: grid; place-items: center; font-size: 22px; line-height: 1; }
.sumbtn.done { background: var(--page); color: var(--acc); border: 1px solid var(--rule); }
.sumbtn.done .plus { background: var(--wash); }

/* строки ингредиентов и покупок */
.ing { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 11px 2px; text-align: left; border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); }
.ing:last-child { border-bottom: 0; }
.ing .ck { width: 24px; height: 24px; flex: none; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--faint); display: grid; place-items: center; color: transparent; }
.ing .ck svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 3; fill: none; }
.ing.on .ck { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.ing .m { flex: 1; min-width: 0; }
.ing .n { font-size: 16px; }
.ing .s { display: block; font-size: 13px; font-style: italic; color: var(--soft); margin-top: 1px; }
.ing .w { display: block; font-size: 12.5px; color: var(--acc); margin-top: 3px; }
.ing .w.alt { color: var(--danger); font-style: italic; }
.ing .q { flex: none; text-align: right; max-width: 40%; font-size: 15px; color: var(--soft); }
.ing .q i { display: block; font-size: 12px; color: var(--faint); }
.ing.on .n, .ing.on .q { text-decoration: line-through; color: var(--faint); }
.ing.on .w, .ing.on .s { opacity: .55; }
h3.gt { margin: 14px 0 0; font-size: 13px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); }

.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { display: flex; gap: 14px; padding: 12px 2px; border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); counter-increment: s; }
.steps li:last-child { border-bottom: 0; }
.steps li::before { content: counter(s); flex: none; width: 26px; font-size: 26px; line-height: 26px; font-weight: 500; font-style: italic; color: var(--acc); }
.steps p { margin: 0; flex: 1; min-width: 0; line-height: 22px; }
.steps .tip { display: block; margin-top: 6px; font-size: 13.5px; font-style: italic; color: var(--soft); line-height: 19px; }
.note { margin: 12px 10px 0; padding: 12px 16px; border-radius: 16px; background: var(--wash); font-size: 14px; font-style: italic; line-height: 20px; }
.note p { margin: 0; } .note p + p { margin-top: 6px; }

/* покупки */
.shop .src { display: block; font-size: 12.5px; font-style: italic; color: var(--faint); margin-top: 2px; }
.btn { display: block; width: 100%; margin: 8px 0; padding: 13px; border-radius: 999px; text-align: center; font-weight: 500; }
.btn.primary { background: var(--acc); color: var(--on-acc); }
.btn.outline { border: 1px solid var(--rule); color: var(--acc); background: var(--page); }
.btn.quiet { color: var(--danger); font-weight: 400; font-style: italic; }
.confirm { margin-top: 6px; text-align: center; font-style: italic; }
.confirm .row { display: flex; gap: 8px; } .confirm .btn { flex: 1; }

/* магазины */
.place .pt { display: flex; align-items: baseline; gap: 10px; margin-top: 14px; }
.place .pt b { flex: 1; font-size: 19px; font-weight: 500; }
.place .pt span { font-size: 12.5px; font-style: italic; color: var(--soft); white-space: nowrap; }
.place p { margin: 6px 0 0; font-size: 14.5px; line-height: 20px; color: var(--soft); }
.place .what { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.place .what span { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--paper); }

/* настройки */
.themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.theme { border-radius: 16px; padding: 7px; text-align: left; border: 1px solid; min-width: 0; }
.theme.on { box-shadow: inset 0 0 0 1px var(--acc); }
.theme .mini { border-radius: 10px; padding: 8px; border: 1px solid; }
.theme .mini i { display: block; height: 5px; border-radius: 3px; margin-bottom: 5px; }
.theme .mini .pills { display: flex; gap: 4px; margin-top: 3px; }
.theme .mini b { flex: 1; height: 10px; border-radius: 5px; border: 1px solid transparent; }
.theme .nm { display: block; font-size: 12px; margin: 6px 0 0; font-style: italic; text-align: center; white-space: nowrap; overflow: hidden; }
.theme.on .nm { font-style: normal; font-weight: 500; }

#toast { position: fixed; left: 50%; bottom: calc(84px + var(--safe-bottom)); transform: translate(-50%, 20px); opacity: 0; z-index: 60; background: var(--ink); color: var(--page);
  padding: 10px 18px; border-radius: 999px; font-size: 14px; font-style: italic; transition: .3s ease; pointer-events: none; white-space: nowrap; }
#toast.in { opacity: 1; transform: translate(-50%, 0); }
#main.intro > * { animation: rise .5s cubic-bezier(.16, 1, .3, 1) both; animation-delay: var(--d, 0ms); }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
/* таймеры */
.tset { padding-top: 6px; }
.dial { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 0 4px; }
.dial .step { width: 48px; height: 48px; flex: none; border-radius: 50%; border: 1px solid var(--rule); background: var(--paper); font-size: 22px; color: var(--acc); }
.dial .val { min-width: 0; text-align: center; }
.dial input { width: 3.2ch; border: 0; background: transparent; text-align: center; font-size: 46px; line-height: 54px; font-weight: 500; padding: 0; }
.dial input:focus { outline: none; color: var(--acc); }
.dial .colon { font-size: 40px; color: var(--faint); }
.dial .u { display: block; font-size: 12.5px; font-style: italic; color: var(--soft); text-align: center; margin-top: -2px; }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
.presets button { min-height: 40px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); font-size: 14.5px; }
.tl { display: flex; align-items: center; gap: 12px; padding: 14px 2px; border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); }
.tl:last-child { border-bottom: 0; }
.tl .ring { width: 54px; height: 54px; flex: none; position: relative; }
.tl .ring svg { width: 54px; height: 54px; transform: rotate(-90deg); }
.tl .ring circle { fill: none; stroke-width: 5; }
.tl .ring .bg { stroke: var(--rule); } .tl .ring .fg { stroke: var(--acc); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.tl .m { flex: 1; min-width: 0; }
.tl .left { display: block; font-size: 30px; line-height: 34px; font-weight: 500; }
.tl .lab { display: block; font-size: 13.5px; font-style: italic; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl .acts { display: flex; gap: 6px; flex: none; }
.tl .acts button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--rule); background: var(--paper); font-size: 13px; color: var(--acc); display: grid; place-items: center; }
.tl .acts svg { width: 18px; height: 18px; fill: currentColor; }
.tl.paused .left { color: var(--faint); }
.tl.done .left { color: var(--acc); }
.stimer { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); color: var(--acc); font-size: 13.5px; font-style: normal; }
.stimer svg { width: 15px; height: 15px; fill: currentColor; }
.setrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; text-align: left; width: 100%; }
.setrow .l { flex: 1; } .setrow .l i { display: block; font-size: 13px; color: var(--soft); }
.sw { width: 46px; height: 28px; flex: none; border-radius: 14px; background: var(--rule); position: relative; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--page); transition: transform .2s; }
.sw.on { background: var(--acc); } .sw.on::after { transform: translateX(18px); }
#alarm { position: fixed; inset: 0; z-index: 80; background: var(--acc); color: var(--on-acc); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: calc(24px + var(--safe-top)) 24px calc(24px + var(--safe-bottom)); text-align: center; }
#alarm.open { display: flex; }
#alarm .bell svg { width: 72px; height: 72px; fill: currentColor; animation: shake .9s ease-in-out infinite; }
@keyframes shake { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-14deg); } 40% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(5deg); } }
#alarm .al { font-size: 34px; line-height: 40px; font-weight: 500; text-wrap: balance; }
#alarm .as { font-size: 16px; font-style: italic; opacity: .85; }
#alarm .ab { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; margin-top: 18px; }
#alarm .ab button { padding: 16px; border-radius: 999px; font-size: 18px; font-weight: 500; }
#alarm .ab .off { background: var(--on-acc); color: var(--acc); }
#alarm .ab .more { display: flex; gap: 10px; } #alarm .ab .more button { flex: 1; border: 1px solid color-mix(in srgb, var(--on-acc) 55%, transparent); font-size: 16px; }
@media (prefers-reduced-motion: reduce) { #main.intro > * { animation: none; } #toast { transition: none; } #alarm .bell svg, #top .tpill.ring { animation: none; } }
/* v5: холодильник, неделя, свои рецепты */
.bundles { scroll-padding-inline: 10px; }
.bcard { scroll-margin-inline: 10px; }
.lnk { color: var(--acc); font-style: italic; font-size: inherit; }
.lnk.sm { font-size: 13px; margin-left: auto; order: 2; flex: none; }
h2.hl .lnk.sm + * { display: none; }
.rbtn.add { font-size: 26px; line-height: 1; color: var(--acc); }
.homebar { display: flex; align-items: center; gap: 6px; width: calc(100% - 20px); margin: 12px 10px 0; padding: 12px 16px; border-radius: 16px; background: var(--wash); color: var(--ink); text-align: left; font-size: 14.5px; }
.homebar b { font-size: 18px; color: var(--acc); }
.homebar span { margin-left: auto; color: var(--acc); }

/* ---------- поделиться рецептом ----------
   Встроенный рецепт: ссылка вида …/#r=pirog — у получателя он уже есть в приложении.
   Свой рецепт: весь рецепт упакован в ссылку (#s=…), получатель может сохранить его себе. */
const b64u = bytes => { let t = ''; bytes.forEach(b => t += String.fromCharCode(b)); return btoa(t).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const pipe = (bytes, T) => new Response(new Blob([bytes]).stream().pipeThrough(new T('deflate-raw'))).arrayBuffer().then(b => new Uint8Array(b));
async function packRecipe(r) {
  const o = { title: r.title, lede: r.lede, meal: r.meal, time: r.time, level: r.level, big: r.big, url: reelOf(r) || r.url || '', groups: r.groups, steps: r.steps, notes: r.notes };
  const raw = new TextEncoder().encode(JSON.stringify(o));
  if (window.CompressionStream) { try { return 'z' + b64u(await pipe(raw, CompressionStream)); } catch (e) {} }
  return 'j' + b64u(raw);
}
async function unpackRecipe(s) {
  let bytes = unb64u(s.slice(1));
  if (s[0] === 'z') bytes = await pipe(bytes, DecompressionStream);
  return JSON.parse(new TextDecoder().decode(bytes));
}

}

function status(r) {

function addRecipe(r, onlyMissing) {
  let added = 0;
  items(r).forEach((i, n) => {
    if (checks[r.id + '|' + n]) return;
    const ks = i.ks || [];
    for (const k of ks) {                                   // вода, рассол из банки и т.п. без продукта пропускаем
      const home = !!haveVia(k);
      if (onlyMissing && home) continue;
      const one = ks.length === 1, q = one ? i.q || '' : '';
      const same = list.find(x => !x.done && x.key === k);
      if (same) {
        if (!forOf(same).includes(r.id)) { same.for = [...forOf(same), r.id]; same.n = k; }
        if (q && !/^по /.test(q)) same.q = same.q && !/^по /.test(same.q) ? same.q + ' + ' + q : q;
        continue;
      }
      list.push({ k: r.id + '|' + n + '|' + k, key: k, ks: [k], rid: r.id, n: one ? i.n : k, q, w: (one && i.w) || prod(k).w || '', for: [r.id], home, done: false }); added++;
    }

}
function shopOf(x) {

  if (x.ks && x.ks.every(isPantry)) return 'Запасы';

function putHome(ks) {

}

/* ---------- неделя ---------- */
const SLOTS = [['b', 'Завтрак'], ['l', 'Обед'], ['d', 'Ужин']];
const POOL = { b: ['Завтрак'], l: ['Суп', 'Основное', 'Салат', 'Закуска'], d: ['Основное', 'Суп', 'Закуска'] };
// Умный подбор: случайность + то, что лежит дома (особенно скоропортящееся), + общие с неделей продукты,
// меньше повторов, сложные блюда — на выходные, ужин из больших блюд идёт на обед следующего дня.
function score(r, slot, day, chosen, weekKeys) {
  const st = status(r), wd = parseISO(addDays(plan.start, day)).getDay(), weekend = wd === 0 || wd === 6;
  let s = Math.random() * 1.2;
  s += 1.4 * st.homeShare + 0.9 * st.soon.length;
  const fresh = needs(r).filter(k => !isPantry(k));
  if (fresh.length) s += 0.8 * fresh.filter(k => weekKeys.has(k)).length / fresh.length;
  const times = chosen.filter(x => x === r.id).length;
  s -= (slot === 'b' ? 0.7 : 1.6) * times;
  if (favs[r.id]) s += 0.6;                               // избранное попадает в план чаще
  if (r.level === 3) s += weekend ? 0.3 : -0.9;
  if (slot === 'd' && r.big) s += 0.3;
  return s;
}
function pick(slot, day, chosen, weekKeys, except) {
  const pool = all().filter(r => inRotation(r) && POOL[slot].includes(r.meal) && r.id !== except);
  if (!pool.length) return null;
  return pool.map(r => [r, score(r, slot, day, chosen, weekKeys)]).sort((a, b) => b[1] - a[1])[0][0].id;
}
function buildPlan(keepLocks) {
  const old = keepLocks && plan ? plan : null;
  const start = old ? old.start : todayISO();
  plan = { start, days: Array.from({ length: 7 }, () => ({})), lock: old ? old.lock : {} };
  const chosen = [], weekKeys = new Set();
  const take = id => { if (!id) return; chosen.push(id); const r = byId(id); if (r) needs(r).forEach(k => weekKeys.add(k)); };
  // сначала закреплённые
  if (old) for (let i = 0; i < 7; i++) for (const [s] of SLOTS) if (plan.lock[i + s] && old.days[i][s] && byId(old.days[i][s]) && inRotation(byId(old.days[i][s]))) { plan.days[i][s] = old.days[i][s]; plan.days[i][s + 'lo'] = old.days[i][s + 'lo']; take(old.days[i][s]); }
  for (let i = 0; i < 7; i++) for (const [s] of SLOTS) {
    if (plan.days[i][s]) continue;
    if (s === 'l' && prefs.leftovers && i > 0) {
      const prev = byId(plan.days[i - 1].d);
      if (prev && prev.big && !plan.days[i - 1].dlo) { plan.days[i].l = prev.id; plan.days[i].llo = 1; continue; }
    }
    if (s === 'd' && plan.days[i].l) { /* ужин не повторяет обед */ }
    const id = pick(s, i, chosen, weekKeys, s === 'd' ? plan.days[i].l : null);
    plan.days[i][s] = id; take(id);
  }
  savePlan();
}
function rerollSlot(i, s) {
  const cur = plan.days[i][s], chosen = [], weekKeys = new Set();
  plan.days.forEach((d, j) => SLOTS.forEach(([x]) => { if ((j !== i || x !== s) && d[x]) { chosen.push(d[x]); const r = byId(d[x]); if (r) needs(r).forEach(k => weekKeys.add(k)); } }));
  chosen.push(cur);
  plan.days[i][s] = pick(s, i, chosen, weekKeys, cur) || cur; delete plan.days[i][s + 'lo'];
  savePlan();
}

  return ids.map(byId).filter(Boolean);
}

async function exportData() {
  const data = { app: 'scrcook', v: 1, saved: new Date().toISOString(), mine, custom, fridge, pantry, plan, list, checks, prefs, reels, favs };
  const name = `scrcook-${todayISO()}.json`, blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  try { const file = new File([blob], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } }
  catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(text) {
  const d = JSON.parse(text);
  if (!d || d.app !== 'scrcook') throw new Error('это не копия scrcook');
  let n = 0;
  for (const r of d.mine || []) { const i = mine.findIndex(x => x.id === r.id); if (i >= 0) mine[i] = r; else { mine.push(r); n++; } }
  for (const p of d.custom || []) if (!custom.some(x => x.n === p.n)) custom.push(p);
  for (const f of d.fridge || []) if (!inFridge(f.k)) fridge.push(f);

}

      <input class="in" id="tLabel" type="text" maxlength="40" placeholder="Что готовится: картошка, духовка…" style="margin-top:10px">
      <button class="btn primary" data-act="tstart" style="margin-top:12px">Запустить</button>
      <div class="presets">${[1, 3, 5, 8, 10, 15, 20, 25, 30, 40, 45, 60].map(m => `<button data-act="tpreset" data-s="${m * 60}">${m === 60 ? '1 ч' : m + ' мин'}</button>`).join('')}</div>
      <p class="hint">Кнопки снизу сразу запускают таймер. В шагах рецептов тоже есть кнопки с временем из шага.</p>
    </div>
    <p class="hint" style="margin:14px 24px">${isIOS ? 'На iPhone приложение засыпает, когда гаснет экран или вы переключаетесь в другое приложение, — тогда сигнал прозвучит, как только вы вернётесь. Поэтому, пока идёт таймер, экран не гаснет (можно выключить в настройках). Чтобы будильник сработал на заблокированном телефоне, надёжнее попросить Siri: «Поставь таймер на 10 минут».' : 'Когда время выйдет, прозвучит сигнал и придёт уведомление, если оно разрешено в настройках.'}</p>`;
  const mm = $('#tMin'), ss = $('#tSec');
  const read = () => { const v = (parseInt(mm.value) || 0) * 60 + Math.min(59, parseInt(ss.value) || 0); dial = Math.max(0, v); store.set('dial', dial); };
  mm.oninput = ss.oninput = read;
  ss.onblur = () => { ss.value = pad(dial % 60); mm.value = Math.floor(dial / 60); };
  mm.onfocus = ss.onfocus = e => e.target.select();
}

/* тик: обновляем цифры на месте, без перерисовки */
let tickT = null;
function tickNow() {
  let fired = null;
  for (const t of timers) if (!t.rang && t.left == null && t.end <= Date.now()) { t.rang = true; fired = t; }
  if (fired) { saveTimers(); ring(timers.filter(t => t.rang && !t.seen)); }
  const run = timers.filter(t => !t.rang && t.left == null).sort((a, b) => a.end - b.end);
  const pill = $('#tpill'), anyRing = timers.some(t => t.rang && !t.seen);
  pill.hidden = !run.length && !anyRing;
  pill.classList.toggle('ring', anyRing);
  $('#tpillT').textContent = anyRing ? 'Готово' : run.length ? fmt(remain(run[0])) : '';
  if (tab === 'timer') document.querySelectorAll('.tl[data-tid]').forEach(el => {
    const t = timers.find(x => x.id === +el.dataset.tid); if (!t || t.rang) return;
    const left = remain(t), C = 2 * Math.PI * 23;
    el.querySelector('.left').textContent = fmt(left);
    el.querySelector('.fg').setAttribute('stroke-dashoffset', (C * (1 - left / t.dur)).toFixed(1));
  });
  if (fired && tab === 'timer') render();
  const need = timers.some(t => !t.rang && t.left == null) || anyRing;
  if (need && !tickT) tickT = setInterval(tickNow, 250);
  if (!need && tickT) { clearInterval(tickT); tickT = null; }
  if (!need) wake();
}

/* сигнал */
let actx = null, beepT = null, beepStop = null;
function unlockAudio() {
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
}
function beep() {
  if (!actx) return;
  const t0 = actx.currentTime;
  [0, .18, .36].forEach((d, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = i === 2 ? 1175 : 880;
    g.gain.setValueAtTime(0, t0 + d); g.gain.linearRampToValueAtTime(.35, t0 + d + .02); g.gain.exponentialRampToValueAtTime(.001, t0 + d + .16);
    o.connect(g).connect(actx.destination); o.start(t0 + d); o.stop(t0 + d + .17);
  });
}
function ring(list) {
  if (!list.length) return;
  const late = Date.now() - Math.max(...list.map(t => t.end));
  $('#alarmL').textContent = list.length > 1 ? 'Время вышло' : (list[0].label || 'Время вышло');
  $('#alarmS').textContent = (list.length > 1 ? list.map(t => t.label || 'Таймер').join(', ') + ' · ' : list[0].label ? 'время вышло · ' : '') +
    (late > 60000 ? `закончился ${Math.round(late / 60000)} мин назад` : 'таймер на ' + fmtShort(Math.round(list[0].dur / 1000)));
  $('#alarm').classList.add('open');
  if (opts.sound) { unlockAudio(); clearInterval(beepT); beep(); beepT = setInterval(beep, 1100); clearTimeout(beepStop); beepStop = setTimeout(() => clearInterval(beepT), 90000); }
  try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 400]); } catch (e) {}
  notify(list);
}
function stopAlarm(clear) {
  clearInterval(beepT); clearTimeout(beepStop); $('#alarm').classList.remove('open');
  if (clear) timers = timers.filter(t => !t.rang);
  saveTimers(); tickNow(); render();
}
function snooze(sec) {
  const last = timers.filter(t => t.rang);
  clearInterval(beepT); $('#alarm').classList.remove('open');
  for (const t of last) { t.rang = false; t.end = Date.now() + sec * 1000; t.dur = sec * 1000; }
  saveTimers(); wake(); tickNow(); render(); toast('Ещё ' + fmtShort(sec));
}

/* уведомления */
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const notifOn = () => 'Notification' in window && Notification.permission === 'granted';
function notifText() {
  if (!('Notification' in window)) return isIOS ? 'на iPhone работают, только если приложение добавлено на экран «Домой»' : 'этот браузер их не поддерживает';
  return Notification.permission === 'granted' ? 'разрешены' : Notification.permission === 'denied' ? 'запрещены — включите в настройках телефона' : 'нажмите, чтобы разрешить';
}
function askNotif() {
  try { if ('Notification' in window && Notification.permission === 'default') return Notification.requestPermission().catch(() => {}); } catch (e) {}
  return Promise.resolve();
}
async function notify(list) {
  if (!notifOn()) return;
  const title = list.length > 1 ? 'Время вышло' : (list[0].label || 'Таймер') + ': время вышло';
  const opt = { body: list.length > 1 ? list.map(t => t.label || 'Таймер').join(', ') : 'scrcook', icon: 'icon-192.png', tag: 'scrcook-timer', renotify: true, requireInteraction: true };
  try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) { reg.showNotification(title, opt); return; } } catch (e) {}
  try { new Notification(title, opt); } catch (e) {}
}

/* не гасить экран, пока идёт таймер */
let wakeLock = null;
async function wake() {
  const need = opts.awake && timers.some(t => !t.rang && t.left == null);
  try {
    if (need && !wakeLock && 'wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    if (!need && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tickNow(); wake(); } });
window.addEventListener('pageshow', () => tickNow());

function render(anim) {
  $main.classList.toggle('intro', !!anim);
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'recipes') (editId ? renderEdit : openId ? renderRecipe : openB ? renderBundle : renderRecipes)();
  else if (tab === 'week') renderWeek(); else if (tab === 'timer') renderTimer(); else if (tab === 'products') renderProducts(); else renderSettings();
}

let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('in'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('in'), 2400); }
const confirmBox = (box, text, yes, label) => { $(box).innerHTML = `<div class="confirm">${text}<div class="row"><button class="btn outline" data-act="cancelBox" data-box="${box}">Нет</button><button class="btn primary" data-act="${yes}">${label}</button></div></div>`; };

/* ---------- события ---------- */
document.addEventListener('click', e => {
  const navb = e.target.closest('#nav button');
  if (navb) {
    const t = navb.dataset.tab;
    if (t === tab && t === 'recipes') { history.replaceState({ tab: 'recipes' }, ''); apply({ tab: 'recipes' }); }
    else { history.pushState({ tab: t }, ''); apply({ tab: t }); }
    draft = null; render(true); window.scrollTo(0, 0); return;
  }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  switch (a) {
    /* рецепты */
    case 'meal': meal = el.dataset.m; store.set('meal', meal); render(); break;
    case 'ingf': ing = ing === el.dataset.k ? null : el.dataset.k; render(); if (ing) { const c = $('#cards'); c && c.scrollIntoView({ behavior: 'smooth', block: 'start' }); } break;
    case 'sort': sort = el.dataset.s; store.set('sort', sort); render(); break;
    case 'open': nav({ tab: 'recipes', r: el.dataset.id }); break;
    case 'bundle': nav({ tab: 'recipes', b: el.dataset.id }); break;
    case 'back': history.back(); break;
    case 'goHome': ptab = 'home'; store.set('ptab', ptab); nav({ tab: 'products', p: 'home' }); break;
    case 'check': {
      const k = el.dataset.k; if (checks[k]) delete checks[k]; else checks[k] = true; store.set('checks', checks);
      el.classList.toggle('on', !!checks[k]); el.setAttribute('aria-pressed', !!checks[k]); break;
    }
    case 'uncheck': for (const k in checks) if (k.startsWith(openId + '|')) delete checks[k]; store.set('checks', checks); render(); break;
    case 'tolist': {
      const r = byId(openId);
      if (list.some(x => forOf(x).includes(r.id))) { ptab = 'buy'; nav({ tab: 'products', p: 'buy' }); break; }
      const n = addRecipe(r); saveList(); render(); toast(n ? `В покупках: ${n} ${plural(n, 'продукт', 'продукта', 'продуктов')}` : 'Всё уже отмечено'); break;
    }
    case 'bundleList': {
      const rs = BUNDLES.find(x => x.id === openB).recipes.map(byId);
      if (rs.every(r => list.some(x => forOf(x).includes(r.id)))) { ptab = 'buy'; nav({ tab: 'products', p: 'buy' }); break; }
      let n = 0; for (const r of rs) n += addRecipe(r);
      saveList(); render(); toast(`В покупках: ${n} ${plural(n, 'строка', 'строки', 'строк')} для ${rs.length} рецептов`); break;
    }
    /* свой рецепт */
    case 'newRecipe': draft = null; nav({ tab: 'recipes', e: 'new' }); break;
    case 'editRecipe': draft = null; nav({ tab: 'recipes', e: openId }); break;
    case 'eMeal': draft.meal = el.dataset.m; render(); break;
    case 'eLevel': draft.level = +el.dataset.n; render(); break;
    case 'eBig': draft.big = !draft.big; render(); break;
    case 'pickIng': draft.ing.push({ k: el.dataset.k, q: '' }); pickQ = ''; render(); { const ins = document.querySelectorAll('[data-qi]'); ins.length && ins[ins.length - 1].focus(); } break;
    case 'pickNew': draft.ing.push({ k: newProduct(pickQ), q: '' }); pickQ = ''; render(); break;
    case 'unpick': draft.ing.splice(+el.dataset.i, 1); render(); break;
    case 'saveRecipe': { const id = saveDraft(); if (id) { history.replaceState({ tab: 'recipes', r: id }, ''); apply({ tab: 'recipes', r: id }); render(true); window.scrollTo(0, 0); toast('Рецепт сохранён'); } break; }
    case 'delRecipe': confirmBox('#delBox', 'Удалить этот рецепт?', 'delYes', 'Удалить'); break;
    case 'delYes': mine = mine.filter(r => r.id !== openId); saveMine(); history.back(); toast('Рецепт удалён'); break;
    case 'cancelBox': $(el.dataset.box).innerHTML = ''; break;
    case 'fav': {
      const id = openId; if (favs[id]) delete favs[id]; else favs[id] = true; saveFavs();
      el.classList.toggle('on', !!favs[id]); el.setAttribute('aria-pressed', !!favs[id]); el.setAttribute('aria-label', favs[id] ? 'Убрать из избранного' : 'В избранное');
      toast(favs[id] ? 'Добавлено в избранное' : 'Убрано из избранного'); break;
    }
    case 'share': { const r = byId(openId); shareUrl(r).then(url => navigator.share({ title: r.title, text: r.title + ' — рецепт из scrcook', url })).catch(() => {}); break; }
    case 'copyLink': { const r = byId(openId); shareUrl(r).then(copyText).then(ok => toast(ok ? 'Ссылка скопирована — отправьте её' : 'Не получилось скопировать')); break; }
    case 'saveShared': {
      const r = { ...shared, id: 'my-' + Date.now().toString(36), mine: 1 }; delete r.shared;
      for (const g of r.groups) for (const i of g.items) for (const k of i.ks || []) if (!catalog().some(p => p.n === k)) { custom.push({ n: k, g: 'Другое', d: 7, w: i.w || '' }); store.set('custom', custom); }
      mine.push(r); saveMine(); shared = null;
      history.replaceState({ tab: 'recipes', r: r.id }, ''); apply({ tab: 'recipes', r: r.id }); render(true); toast('Рецепт сохранён в ваши'); break;
    }
    case 'reelEdit': delete reels[openId]; saveReels(); render(); { const f = document.querySelector('.reelform input'); f && f.focus(); } break;
    /* продукты */
    case 'ptab': ptab = el.dataset.p; store.set('ptab', ptab); history.replaceState({ tab: 'products', p: ptab }, ''); render(); break;
    case 'fadd': {
      const k = el.dataset.k, d = prod(k).d;
      fridge.push({ k, added: todayISO(), exp: d ? addDays(todayISO(), d) : null }); saveFridge(); addQ = ''; render(); toast(k + ' — дома'); break;
    }
    case 'fnew': { const k = newProduct(addQ); fridge.push({ k, added: todayISO(), exp: addDays(todayISO(), 7) }); saveFridge(); addQ = ''; render(); toast(k + ' — дома'); break; }
    case 'fdel': fridge = fridge.filter(x => x.k !== el.dataset.k); saveFridge(); render(); break;
    case 'fmore': { const x = inFridge(el.dataset.k); if (x) { x.exp = addDays(x.exp || todayISO(), 2); saveFridge(); render(); } break; }
    case 'pantry': { const k = el.dataset.k; if (pantry[k]) delete pantry[k]; else pantry[k] = true; savePantry(); render(); break; }
    case 'togglePantry': prefs.hidePantry = !prefs.hidePantry; savePrefs(); render(); break;
    case 'buyMissing': {
      const r = byId(el.dataset.id), n = addRecipe(r, true); saveList(); render();
      toast(n ? `В покупках: ${n} ${plural(n, 'продукт', 'продукта', 'продуктов')} для «${r.title}»` : 'Уже в покупках'); break;
    }
    case 'buy': {
      const x = list.find(y => y.k === el.dataset.k); if (!x) break;
      x.done = !x.done;
      if (x.done && x.ks) putHome(x.ks);
      else if (!x.done && x.ks) { fridge = fridge.filter(f => !(x.ks.includes(f.k) && f.added === todayISO() && f.fromList)); saveFridge(); }
      saveList(); render(); if (x.done && x.ks && x.ks.length) toast('Положил в «Дома»'); break;
    }
    case 'clean': list = list.filter(x => !x.done); saveList(); render(); toast('Купленное убрано'); break;
    case 'wipe': confirmBox('#wipeBox', 'Очистить весь список?', 'wipeyes', 'Очистить'); break;
    case 'wipeyes': list = []; saveList(); render(); toast('Список очищен'); break;
    /* неделя */
    case 'genPlan': buildPlan(true); render(true); toast('План собран'); break;
    case 'newWeek': { const lock = plan ? plan.lock : {}; plan = null; buildPlan(false); plan.lock = {}; savePlan(); render(true); toast('Новый план с сегодняшнего дня'); break; }
    case 'reroll': rerollSlot(+el.dataset.i, el.dataset.s); render(); break;
    case 'lock': { const k = el.dataset.i + el.dataset.s; if (plan.lock[k]) delete plan.lock[k]; else plan.lock[k] = 1; savePlan(); render(); break; }
    case 'pref': { const k = el.dataset.k; if (k === 'webPlan' && !prefs.webBook) { prefs.webBook = true; prefs.webPlan = true; } else prefs[k] = !prefs[k]; savePrefs();
      if (plan && ['leftovers', 'webPlan', 'webBook'].includes(k)) { buildPlan(true); if (k !== 'leftovers') toast(prefs.webBook && prefs.webPlan ? 'План пересобран с рецептами из интернета' : 'План пересобран без рецептов из интернета'); } render(); break; }
    case 'planList': {
      const rs = planRecipes();
      if (rs.length && rs.every(r => list.some(x => forOf(x).includes(r.id)))) { ptab = 'buy'; nav({ tab: 'products', p: 'buy' }); break; }
      let n = 0; for (const r of rs) n += addRecipe(r);
      saveList(); render(); toast(`В покупках: ${n} ${plural(n, 'строка', 'строки', 'строк')} на неделю`); break;
    }
    /* настройки */
    case 'theme': applyTheme(el.dataset.id); render(); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'resetChecks': confirmBox('#resetBox', 'Снять отметки во всех рецептах?', 'resetyes', 'Снять'); break;
    case 'resetyes': checks = {}; store.set('checks', checks); render(); toast('Отметки сняты'); break;
    /* таймер */
    case 'gotimer': nav({ tab: 'timer' }); break;
    case 'tstep': setDial(dial + (+el.dataset.s)); break;
    case 'tpreset': startTimer(+el.dataset.s, $('#tLabel') ? $('#tLabel').value.trim() : ''); break;
    case 'tstart': if (dial > 0) startTimer(dial, $('#tLabel').value.trim()); else toast('Задайте время'); break;
    case 'tstepstart': startTimer(+el.dataset.s, el.dataset.l); toast('Таймер на ' + fmtShort(+el.dataset.s) + ' запущен'); break;
    case 'tpause': pauseTimer(+el.dataset.id); break;
    case 'tadd': addTime(+el.dataset.id, 60); break;
    case 'tdel': timers = timers.filter(t => t.id !== +el.dataset.id); saveTimers(); render(); break;
    case 'alarmoff': stopAlarm(true); break;
    case 'alarmmore': snooze(+el.dataset.s); break;
    case 'opt': opts[el.dataset.k] = !opts[el.dataset.k]; store.set('opts', opts); if (el.dataset.k === 'awake') wake(); render(); break;
    case 'notif': askNotif().then(render); break;
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('.reelform'); if (!f) return;
  e.preventDefault();
  const u = f.u.value.trim();
  if (!/^https?:\/\//.test(u)) { toast('Вставьте ссылку целиком, с https://'); return; }
  reels[f.dataset.id] = u.replace(/\?.*$/, ''); saveReels(); render(); toast('Ссылка на рилс сохранена');
});
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { const n = importData(String(rd.result)); render(); toast(n ? `Загружено своих рецептов: ${n}` : 'Копия загружена'); } catch (err) { toast('Не получилось: ' + err.message); } e.target.value = ''; };
  rd.readAsText(f, 'utf-8');
};
window.addEventListener('popstate', e => { apply(e.state); draft = null; render(true); window.scrollTo(0, 0); });

history.replaceState({ tab: 'recipes' }, '');
tickNow(); wake();
badge();
render(true);
openFromHash();
window.addEventListener('hashchange', openFromHash);
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
